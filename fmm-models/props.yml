# iekcorbar - place FreeMinecraftModels props in every direction
# (generated by make_props.py - edit freely, but a regeneration overwrites it)
#
# FreeMinecraftModels on its own always places a prop upright on top of the
# clicked face. A family below is ONE item (the base model) with a model
# variant for every way it can be mounted. Which variant is placed depends on
# the face you right-click:
#   floor         top of a block              floor-sneak    same, while sneaking
#   wall          side of a block             wall-sneak     same, while sneaking
#   ceiling       underside of a block        ceiling-sneak  same, while sneaking
# Leave a key out to fall back (sneak -> normal, wall/ceiling -> floor).
#
# Wall variants: the wall is at Z=0 and the model sticks out towards -Z. If it
# ends up inside the wall instead, set wall-yaw-offset: 180.
# yaw-snap: floor/ceiling models turn towards the player in steps of this many
# degrees (0 = free).
# yaw-offset: extra turn for floor/ceiling models (e.g. 180 if a model ends up
# facing away from you).
# light: 1-15 gives the prop real light (invisible light block in its block).
# recipe: our own crafting recipe for the item (shape rows, ingredients,
# amount = how many one craft gives). Players get it in their recipe book.
# Remove a recipe: block to make an item creative/shop-only. Material
# variants: copper / brass (gold) / iron / verdigris (oxidized copper blocks).
# copper_gear has no recipe here - its recipe is FreeMinecraftModels' own file.
#
# The models live in plugins/FreeMinecraftModels/models/steampunk_iekcorbar/,
# one subfolder per item.
#
# Picking a variant up again (hit it 3x, FMM's pickupable script) gives the
# base item back. After editing: /iprop reload.
#
# Steam Wrench (craft: iron _ iron / _ copper _ / _ copper _, or /iprop wrench):
# right-click a placed model to swap it for the next one in its wrench-cycles
# list, sneak + right-click for the previous one.

enabled: true

families:
  copper_gear:
    floor: copper_gear
    floor-sneak: copper_gear_flat
    wall: copper_gear_wall
    wall-sneak: copper_gear_wall
