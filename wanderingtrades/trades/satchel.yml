# WanderingTrades 1.9.6 trade config: Satchel backpacks (iekcorbar)
#
# Backpacks are not craftable. The trade result is a plain paper named exactly like the backpack with the LAST lore
# line exactly "Satchel"; the first time a player right-clicks it, the Satchel plugin swaps it for the real backpack.
# Keep the names and the last lore line as they are. Staff: /satchel give <tier> [player].

enabled: true

# chance that a wandering trader gets this trade (allowMultipleSets is true in config.yml, so this is a plain percentage)
chance: 0.35

# a trader gets ONE random trade of this file
randomized: true
randomAmount: 1

invincible: false
customName: NONE
disableHeroOfTheVillageGifts: false

trades:
  canvas:
    maxUses: 1
    experienceReward: true
    ingredients:
      1:
        customname: NONE
        material: EMERALD
        amount: 16
      2:
        customname: NONE
        material: LEATHER
        amount: 8
    result:
      customname: "<gold>Canvas Backpack"
      material: PAPER
      amount: 1
      lore:
        - "<gray>Right-click to open."
        - "<gray>Upgrades go in the bottom row."
        - "<dark_aqua>Satchel"
  copper:
    maxUses: 1
    experienceReward: true
    ingredients:
      1:
        customname: NONE
        material: EMERALD
        amount: 24
      2:
        customname: NONE
        material: COPPER_INGOT
        amount: 16
    result:
      customname: "<gold>Copper Backpack"
      material: PAPER
      amount: 1
      lore:
        - "<gray>Right-click to open."
        - "<gray>Upgrades go in the bottom row."
        - "<dark_aqua>Satchel"
  iron:
    maxUses: 1
    experienceReward: true
    ingredients:
      1:
        customname: NONE
        material: EMERALD
        amount: 32
      2:
        customname: NONE
        material: IRON_INGOT
        amount: 16
    result:
      customname: "<gold>Iron Backpack"
      material: PAPER
      amount: 1
      lore:
        - "<gray>Right-click to open."
        - "<gray>Upgrades go in the bottom row."
        - "<dark_aqua>Satchel"
