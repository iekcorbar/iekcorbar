eliteScript:
  TagVoidBell:
    Events:
    - EliteMobDeathEvent
    Actions:
    - action: TITLE_MESSAGE
      wait: 5
      title: '&cThe Void Bell'
      subtitle: '&cGrows Weaker!'
      Target:
        targetType: NEARBY_PLAYERS
        range: 30
      duration: 30
      fadeIn: 5
      fadeOut: 5
    - action: PLAY_SOUND
      Target:
        targetType: NEARBY_PLAYERS
        range: 30
      sValue: minecraft:entity.player.levelup
    - action: TAG
      Target:
        targetType: NEARBY_MOBS
        range: 2000
      tags:
      - Green2
      Conditions:
        hasTags:
        - VoidBell
        Target:
          targetType: ACTION_TARGET
        conditionType: FILTERING
  SpawnPrep:
    Events:
    - EliteMobSpawnEvent
    Actions:
    - action: SET_MOB_AI
      bValue: false
      Target:
        targetType: SELF
  ActivateMobs:
    Events:
    - ZoneEnterEvent
    Zone:
      shape: SPHERE
      radius: 18
      Target:
        targetType: SELF
    Actions:
    - action: TITLE_MESSAGE
      wait: 24
      title: '&cThe Void Bell'
      subtitle: '&cRings!'
      Target:
        targetType: WORLD_PLAYERS
      duration: 15
      fadeIn: 5
      fadeOut: 5
    - action: PLAY_SOUND
      wait: 24
      sValue: block.bell.use
      Target:
        targetType: SELF
      repeatEvery: 10
      times: 4
    - action: SET_MOB_AI
      wait: 24
      Target:
        targetType: NEARBY_MOBS
        range: 25
      bValue: true
      Conditions:
        hasTags:
        - Disturbed
        Target:
          targetType: ACTION_TARGET
    - action: SET_MOB_AI
      wait: 24
      Target:
        targetType: SELF
      bValue: true
    - action: MAKE_INVULNERABLE
      wait: 34
      Target:
        targetType: NEARBY_MOBS
        range: 25
      invulnerable: false
      Conditions:
        hasTags:
        - Disturbed
        Target:
          targetType: ACTION_TARGET
    - action: PUSH
      wait: 24
      Target:
        targetType: NEARBY_MOBS
        range: 25
      vValue: 0,0.6,0
      Conditions:
        hasTags:
        - Disturbed
        Target:
          targetType: ACTION_TARGET
    Cooldowns:
      local: 99999
      global: 100
