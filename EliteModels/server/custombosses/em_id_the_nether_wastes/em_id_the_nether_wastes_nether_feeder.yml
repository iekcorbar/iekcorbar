eliteScript:
  Trigger:
    Events:
    - EliteMobDamagedByPlayerEvent
    Actions:
    - action: RUN_SCRIPT
      scripts:
      - PushToPlayer
      repeatEvery: 92
      wait: 92
      Conditions:
        isAlive: true
        Target:
          targetType: SELF
    Cooldowns:
      local: 9999
      global: 1
  PushToPlayer:
    Actions:
    - action: PUSH
      Target:
        targetType: SELF
      vValue: 0,1.1,0
    - action: PUSH
      wait: 20
      Target:
        targetType: SELF
      RelativeVector:
        SourceTarget:
          targetType: SELF
        DestinationTarget:
          targetType: DIRECT_TARGET
        normalize: true
        multiplier: 2.5
      Conditions:
        isAlive: true
        Target:
          targetType: SELF
  NerfDamage:
    Events:
    - ZoneEnterEvent
    - ZoneLeaveEvent
    Zone:
      shape: SPHERE
      radius: 1
      Target:
        targetType: SELF
    Actions:
    - action: SET_MOB_AI
      Target:
        targetType: SELF
      bValue: false
      duration: 10
