name: SteamworksPower
version: '${project.version}'
main: com.iekcorbar.power.PowerPlugin
api-version: '26.2'
# Power add-on of Steamworks: water turbine, press, ticker, flywheel and sieve funnel.
# Needs Steamworks (it is the network these machines plug into); models join Steamworks' FMM folder.
depend: [Steamworks]
description: Water turbine, press, ticker, brass flywheel and sieve funnel for the Steamworks network.
author: iekcorbar

commands:
  swpower:
    description: Steamworks Power commands
    usage: /swpower <list|give|reload>
    aliases: [pwr, swp]

permissions:
  power.admin:
    description: Give and configure Steamworks Power machines
    default: op
