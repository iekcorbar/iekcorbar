# IekcorbarSiteSync Configuration

# MySQL Database Configuration (Plesk MariaDB op de VPS)
# Let op: de server draait in een Docker-container — MySQL is íets bereikbaar via de
# docker-gateway (172.18.0.1), NIET via het publieke IP (3306 is van buitenaf dicht).
# zelfde database als BetonQuest gebruikt (plugins/BetonQuest/config.yml: mysql.host).
database:
  enabled: true
  host: "172.18.0.1"           # docker-gateway van de VPS; zelfde adres als in werkende plugins
  port: 3306                   # MySQL Port (default 3306)
  name: "s30266_iekcorbar_player_data"  # Database Name
  username: "TODO"             # Database Username  - LET OP: de echte gegevens staan ALLEEN op de server
  password: "TODO"             # Database Password  - in plugins/IekcorbarSiteSync/config.yml, nooit in git
  ssl: false                   # Enable SSL if required by your provider
  sync-interval-seconds: 30    # Sync frequency in seconds

# Automatically sync all player statistics (playtime, kills, deaths, mob kills, blocks mined, balance, elite coins, lands, jobs)
sync-player-stats: true

# Deep sync for Staff Panel > Player Data: vanilla statistics and advancement
# progress live in the server's save files, so a slow drip-fed cycle loads each
# player through Paper (offline-safe) and writes stats_json + advancements_json
# into player_stats. Never-synced rows go first and quitting bumps you up the
# queue. Costs nothing during play - it all runs async, batch by batch.
deep-sync:
  enabled: true
  every-seconds: 30      # how often the cycle runs
  batch-size: 5          # players per cycle (5 / 30 s = ~10 per minute)
  refresh-minutes: 15    # re-check a player after this long even when nothing changed

# Sakagura garden season -> website calendar (reads plugins/Sakagura/config.yml, writes one settings row).
season-sync:
  enabled: true
  every-seconds: 300

# Generic PlaceholderAPI bridge — lets the website show data from ANY plugin
# that registers PlaceholderAPI placeholders (Lands, ValhallaMMO, ValhallaRaces,
# etc.) without needing a code change/plugin rebuild every time you want a new
# stat. Requires PlaceholderAPI itself to be installed on this server.
#
# Add/remove/rename entries freely — the key on the left is what shows up on
# the website, the value on the right is the exact placeholder to resolve.
# Verify a placeholder actually works BEFORE adding it here by running
# "/papi parse <yourname> <placeholder>" in-game (e.g. "/papi parse Notch
# %lands_player_chunks_claimed%") — if that prints the placeholder text back
# unchanged instead of a real value, the plugin isn't installed, the
# placeholder name is wrong, or that specific plugin doesn't support offline
# players (this sync only runs for currently-online players).
#
# "lands_claims" is special-cased: if present, it's parsed as a whole number
# and also written into the website's existing dedicated claims column (the
# one the homepage "Claims Protected" counter sums) — every other key here
# just goes into a generic per-player stats blob the website can display.
# 2026-10-26: the Lands plugin is retired; Gouw's claims are synced straight
# from plugins/Gouw/claims.json (see GouwClaims.java), so the %lands% entries
# are gone. Keep this bridge for the OTHER plugins below.
placeholder-sync:
  enabled: true
  placeholders:
    valhalla_race: "%valhallaraces_racename%"
    valhalla_class: "%valhallaraces_classname_1%"
    mmocore_class: "%mmocore_class%"
    mmocore_level: "%mmocore_level%"
    # Example for a ValhallaMMO skill — replace <skill> with the real
    # profile id from your server's own Valhalla config, then verify with
    # /papi parse before uncommenting:
    # valhalla_smithing_level: "%valhallammo_smithingprofile_level%"

# Mirrors in-game/console CMI moderation commands (cmi kick/ban/tempban/unban)
# into the website's own moderation_logs table, so staff acting directly
# in-game (bypassing the Staff Panel) still show up in the site's moderation
# history. See ModerationAuditListener.java.
moderation-audit:
  enabled: true

# HeadDatabase: heads are free ONLY for players with iekcorbar.heads.creativefree
# while they are in creative mode; everyone else (OP included) always pays.
# Leaving this section out = enabled with the built-in node list.
creative-heads:
  enabled: true
  # Uncomment to override the HeadDatabase "free" permission nodes that get
  # switched on/off (Bukkit doesn't expand wildcards, so list each one):
  # free-nodes:
  #   - "headdb.free.*"
  #   - "headdb.free.blocks"

# Print debug info in server console
debug: false
