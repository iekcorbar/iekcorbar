# ============================================================================
#  Iekcorbar custom advancements
# ============================================================================
#  Real Minecraft advancements (own tab(s) in the advancement screen [L],
#  toast + chat announcement) that you define here — no datapack needed.
#
#  After editing this file:   /iadv reload
#  Other commands:            /iadv list
#                             /iadv grant <player> <id>
#                             /iadv revoke <player> <id>
#                             /iadv check <player>      (re-check requirements now)
#  Permission: iekcorbar.advancements.admin (default: op)
#
#  Text (title / description / message) supports colors:
#    legacy codes:  "&6Gold &lbold"      or  MiniMessage:  "<gold>Gold <bold>bold"
#
#  Icons: any Minecraft item id, e.g. minecraft:diamond, minecraft:cherry_sapling
#  Frame: task (normal) | goal (rounded) | challenge (spiky, purple toast + sound)
#
#  IDs (the keys below) may only contain lowercase letters, digits, _ and -.
#  Renaming an id = a new advancement (players lose that progress), so don't
#  rename ids of advancements players already earned.
# ============================================================================

# How often (seconds) online players are checked for automatic requirements.
check-interval-seconds: 20

# ---------------------------------------------------------------------------
#  TABS — each tab is its own page in the advancement screen.
# ---------------------------------------------------------------------------
tabs:
  iekcorbar:
    title: "&6Iekcorbar"
    description: "Sakura & steam adventures"
    icon: minecraft:cherry_sapling
    # Background texture of the tab: any block texture, e.g.
    # minecraft:block/cherry_planks, minecraft:block/stone_bricks,
    # minecraft:block/copper_block, minecraft:block/deepslate_tiles
    background: minecraft:block/cherry_planks

  # Tab ids are part of every advancement key (iekcorbar/<id>, delver/<id>, ...):
  # never rename a tab that players already earned something in.
  delver:
    title: "&8Delvers and Hunters"
    description: "Dig deep, fight hard"
    icon: minecraft:iron_pickaxe
    background: minecraft:block/deepslate_tiles

  homestead:
    title: "&2Homesteaders"
    description: "Build, farm, trade and brew"
    icon: minecraft:wheat
    background: minecraft:block/moss_block

# ---------------------------------------------------------------------------
#  ADVANCEMENTS
# ---------------------------------------------------------------------------
#  tab:          which tab it belongs to (see above)
#  parent:       id of the advancement it hangs under (leave out = directly under the tab)
#  title / description / icon / frame
#  hidden:       true = invisible until earned (secret advancement)
#  announce:     true = message in chat for everyone when earned
#  toast:        true = popup top-right for the player
#
#  requirements: ALL listed requirements must be met. Types:
#    - type: manual                 only via /iadv grant (e.g. by staff, or RCON from the website)
#    - type: playtime, hours: 10
#    - type: break_block, block: diamond_ore, amount: 50        (also: blocks: [a, b] = combined)
#    - type: place_block, block: cherry_planks, amount: 500
#    - type: craft_item, item: brewing_stand, amount: 1
#    - type: kill_entity, entity: zombie, amount: 100
#    - type: statistic, statistic: JUMP, amount: 1000           (any Bukkit Statistic name;
#          add block:/item:/entity: for statistics that need one, e.g. statistic: USE_ITEM, item: bow)
#    - type: placeholder, placeholder: "%jobs_total_levels%", min: 25     (needs PlaceholderAPI;
#          or equals: "some text" for text values)
#    - type: permission, permission: "group.vip"
#    - type: location, world: world_nether                      (just being in that world)
#    - type: location, world: world, x: 120, z: -340, radius: 30   (near a spot)
#    - type: location, environment: nether                      (by dimension: normal | nether | the_end -
#          works whatever the worlds are called)
#    - type: advancements, list: [first_steps, miner]           (other advancements from this file)
#    - type: website, achievement: first-chat-message           (earned when the website awards that
#          achievement slug — see Staff Panel achievements)
#    Lore books (books/*.txt, see books.yml). "Read" = the player opened the book at least once
#    (right-click it, read it on a lectern, or /ibook open):
#    - type: books_read, amount: 5                              (any 5 different lore books)
#    - type: book_read, book: brewers_handbook_1                (that exact book; books: [a, b] = all of them)
#    - type: book_series, series: "The Brewer's Handbook"       (every volume of that series)
#    - type: book_series, series: "The Brewer's Handbook", amount: 2   (at least 2 volumes of it)
#
#  rewards (optional, given once when earned):
#    commands:  console commands, {player} = player name
#    xp:        experience points
#    message:   private message to the player
# ---------------------------------------------------------------------------
advancements:

