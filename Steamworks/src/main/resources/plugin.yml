name: Steamworks
version: '${project.version}'
main: com.iekcorbar.steamworks.SteamworksPlugin
api-version: '26.2'
description: Steampunk/Japanese kinetic machines - shafts, cogwheels, cranks, water wheels, millstones and steam hammers.
author: iekcorbar
softdepend: [FreeMinecraftModels, AfkCinema, Gouw, Hihou, IekcorbarSiteSync, Kitchen, Kura, Relics, Sakagura, Satchel, SteamworksAdditions, Wildlife, Zukan]

commands:
  steamworks:
    description: Steamworks admin commands
    usage: /steamworks <give|info|list|reload>
    aliases: [sw]
  swpower:
    description: Steamworks Power commands
    usage: /swpower <list|give|reload>
    aliases: [pwr, swp]

permissions:
  steamworks.admin:
    description: Give parts, reload the config
    default: op
  power.admin:
    description: /swpower give and reload (the power machines are part of this plugin since 0.3.34)
    default: op

