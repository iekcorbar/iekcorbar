# IekQuests 0.2 - quest definitions (30-10)
#
# NOTE: everything the PLAYER can see is English (staff + players are
# international). Code comments may stay Dutch.
#
# stages: talk | craft | deliver | walk | kill   (order = sequence;
# next/goto to jump). choices = branching options with labels.
# rewards/actions: money|eco|title A|B|sound ns:key|say|tag+|tag-|
#   point <cat> +N | effect TYPE secs amp | teleport | give | shop <cmd> |
#   compass | sequence <id>
# conditions (start / stage cond / choice cond): tag:name, point:cat>=N,
#   item:MAT>=N, perm:node, day, night  (comma = and)
# repeat: contracts after completion (deliver|walk, own cooldown).
# sequences: timelines "delay|action".

quests:
  milo:
    title: "&6The Lost Caravan"
    subtitle: "Milo the Wandering Trader"
    icon: BOOK
    npc-id: 136
    order: 10
    journal:
      - "Four blank labels for Milo's caravan."
    stages:
      talk:
        type: talk
        label: "&aI'll help you, Milo."
        voice: steamworks:milo.line01
        lines:
          - "&fMilo: &7my caravan spilled its label case on"
          - "&7the road. Four blank sheets of paper and I can"
          - "&7deliver close to home again - coin AND elite coins!"
      labels:
        type: craft
        material: PAPER
        amount: 4
        label: "&aHand in the four labels"
        voice: steamworks:milo.line02
        lines:
          - "&fMilo: &7Four blank sheets. Paper is sugar cane and"
          - "&7water - or torn out of a book. Whatever you prefer."
    rewards:
      - "money 300"
      - "eco 10"
      - "sound steamworks:quest.complete"
      - "title &aQUEST COMPLETE|&7+300 coin, +10 elite coins"
      - "say &eMilo: &aBless your crafting hands!"
      - "tag+ milo_done"
    repeat:
      labels:
        label: "&aFour more labels"
        material: PAPER
        amount: 4
        cooldown: 900
        money: 150
        eco: 2
        voice: steamworks:milo.line09

  igor:
    title: "&5Halloween Lanterns"
    subtitle: "Igor Nightgrave - Halloween Town"
    icon: CARVED_PUMPKIN
    npc-id: 137
    order: 20
    journal:
      - "Hear Igor's plan for the dying lanterns."
      - "Craft 8 candles (1 honeycomb + 1 string each)."
      - "Bring 6 WHOLE pumpkins from the patch."
      - "Light the first lantern together."
    start: "!tag:igor_done"
    stages:
      talk:
        type: talk
        label: "&aHear Igor's plan"
        voice: steamworks:igor.line01
        lines:
          - "&fIgor: &7Heeeeey, little pumpkin. Come closer - don't"
          - "&7mind the cold. It only bites the living."
          - "&fIgor: &7The lanterns of Halloween Town are dying, and"
          - "&7restless spirits hate a dark street."
          - "&fIgor: &7Here is the whole spell: &feight candles &7and"
          - "&fsix whole pumpkins&7. Bring those, and the town"
          - "&7glows until Samhain."
          - "&e> Click the green button - the list stays in your journal."
      candles:
        type: craft
        material: CANDLE
        amount: 8
        label: "&eCraft 8 candles (you keep them)"
        voice: steamworks:igor.line03
        lines:
          - "&fIgor: &7First: candles. &fOne honeycomb, one string&7 -"
          - "&7that is a whole candle in a crafting square."
          - "&fIgor: &7Eight of them, and &akeep them in your pack&7:"
          - "&7you light the lanterns with these same candles."
          - "&e> All 8 in your pack? Click &aCraft 8 candles&7."
      pumpkins:
        type: deliver
        material: PUMPKIN
        amount: 6
        label: "&aHand in 6 whole pumpkins"
        voice: steamworks:igor.line09
        lines:
          - "&fIgor: &7Six pumpkins now - round, whole, &fun-carved&7."
          - "&7The flame does the carving; a knife only cheats it."
          - "&fIgor: &7These six burn on the pyre, so they are gone"
          - "&7afterwards. The candles you keep. Clear?"
          - "&e> Six in your pack? Click &aHand in 6 whole pumpkins&7."
      lantern:
        type: deliver
        material: CANDLE
        amount: 1
        label: "&eLight the first lantern (1 candle)"
        voice: steamworks:igor.line11
        lines:
          - "&fIgor: &7There they are. Now hold still, little pumpkin"
          - "&7- one candle from your pack, and we light the"
          - "&7first lantern &utogether&7."
          - "&e> Click &aLight the first lantern&7."
    rewards:
      - "money 400"
      - "eco 15"
      - "give CARVED_PUMPKIN 1"
      - "effect NIGHT_VISION 60"
      - "sound steamworks:quest.complete"
      - "say &eIgor: &aThere she burns. Take the first lantern - you earned it, little pumpkin."
      - "title &aQUEST COMPLETE|&7Halloween Town blazes on"
      - "tag+ igor_done"
    repeat:
      trick_or_treat:
        label: "&aTrick or treat (2 pumpkins)"
        material: PUMPKIN
        amount: 2
        cooldown: 600
        money: 120
        eco: 2
        voice: steamworks:igor.line12

