  cleric:
    title: "&fCleric of Valhalla"
    subtitle: "Divine services - race and class"
    icon: GOLDEN_APPLE
    npc-id: 94
    order: 63
    stages:
      talk:
        type: talk
        label: "&fTake your blessing and go."
        lines:
