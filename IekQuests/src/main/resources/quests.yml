  kit_knife:
    title: "&eFirst, the Blade"
    subtitle: "Daichi - Cook's course I"
    icon: STONE_SWORD
    npc-id: 85
    order: 48
    start: "!tag:kit_knife_done"
    journal:
      - "Cook's course I - a knife and a cutting board for Daichi."
    stages:
      offer:
        type: talk
        label: "&aTeach me to cook for real."
        lines:
          - "&fDaichi: &7A cook who borrows knives is a guest."
          - "&7Yours begins cheap - flint on a stick, and a plank"
          - "&7sawn flat to cut on. Make both, then we talk fish."
      handin:
        type: deliverall
        label: "&aBring a knife and a cutting board"
        items:
          - "STONE_SWORD 1 knife"
          - "PAPER 1 cutting board"
        lines:
          - "&fDaichi: &7Blade on board. That is where every meal"
          - "&7starts - the sea, the field and the fire follow."
    rewards:
      - "tag+ kit_knife_done"
      - "money 600"
      - "eco 15"
      - "sound steamworks:quest.complete"
      - "title &aQUEST COMPLETE|&eFirst, the Blade"
      - "say &fDaichi: &aKeep it sharp. Next comes the field."

  kit_prep:
    title: "&eFrom Field to Board"
    subtitle: "Daichi - Cook's course II"
    icon: BOWL
    npc-id: 85
    order: 49
    start: "qtag:kit_knife:kit_knife_done,!tag:kit_prep_done"
    journal:
      - "Cook's course II - prepped vegetables and steamed rice."
    stages:
      offer:
        type: talk
        label: "&aWhat grows on the board next?"
        lines:
          - "&fDaichi: &7Cut what the field gives. Daikon thin,"
          - "&7green onion fine, rice steamed until it clings."
          - "&8Grow it yourself - rice seed on wet farmland."
      handin:
        type: deliverall
        label: "&aDeliver the prepped trays"
        items:
          - "PAPER 2 daikon slices"
          - "PAPER 4 green onion"
          - "PAPER 4 steamed rice"
        lines:
          - "&fDaichi: &7Even slices. A knife reads a cook's"
          - "&7patience in the cut. This one passes."
    rewards:
      - "tag+ kit_prep_done"
      - "money 700"
      - "eco 18"
      - "sound steamworks:quest.complete"
      - "title &aQUEST COMPLETE|&eFrom Field to Board"
      - "say &fDaichi: &7Now the fire wants something."

  kit_hot:
    title: "&eThe Hot Kitchen"
    subtitle: "Daichi - Cook's course III"
    icon: MUSHROOM_STEW
    npc-id: 85
    order: 50
    start: "qtag:kit_prep:kit_prep_done,!tag:kit_hot_done"
