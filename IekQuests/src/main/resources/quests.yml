# IekQuests 0.2 - quest definitions (30-10)
#
# NOTE: everything the PLAYER can see is English (staff + players are
# international). Code comments may stay Dutch.
#
# stages: talk | craft | deliver | walk | kill   (order = sequence;
# next/goto to jump). choices = branching options with labels.
# rewards/actions: money|eco|title A|B|sound ns:key|say|tag+|tag-|
#   point <cat> +N | effect TYPE secs amp | teleport | give | shop <cmd> |
#   compass | sequence <id>
# conditions (start / stage cond / choice cond): tag:name, point:cat>=N,
#   item:MAT>=N, perm:node, day, night  (comma = and)
# repeat: contracts after completion (deliver|walk, own cooldown).
# sequences: timelines "delay|action".

quests:
  milo:
    title: "&6The Lost Caravan"
    subtitle: "Milo the Wandering Trader"
    icon: BOOK
    npc-id: 136
    order: 10
    journal:
      - "Four blank labels for Milo's caravan."
    stages:
      talk:
        type: talk
        label: "&aI'll help you, Milo."
        voice: steamworks:milo.line01
        lines:
          - "&fMilo: &7my caravan spilled its label case on"
          - "&7the road. Four blank sheets of paper and I can"
          - "&7deliver close to home again - coin AND elite coins!"
      labels:
        type: craft
        material: PAPER
        amount: 4
        label: "&aHand in the four labels"
        voice: steamworks:milo.line02
        lines:
          - "&fMilo: &7Four blank sheets. Paper is sugar cane and"
          - "&7water - or torn out of a book. Whatever you prefer."
    rewards:
      - "money 300"
      - "eco 10"
      - "sound steamworks:quest.complete"
      - "title &aQUEST COMPLETE|&7+300 coin, +10 elite coins"
      - "say &eMilo: &aBless your crafting hands!"
      - "tag+ milo_done"
    repeat:
      labels:
        label: "&aFour more labels"
        material: PAPER
        amount: 4
        cooldown: 900
        money: 150
        eco: 2
        voice: steamworks:milo.line09

  igor:
    title: "&5Halloween Lanterns"
    subtitle: "Igor Nightgrave - Halloween Town"
    icon: CARVED_PUMPKIN
    npc-id: -1
    order: 20
    journal:
      - "Eight candles and six pumpkins for the town."
    start: "!tag:igor_done"
    stages:
      talk:
        type: talk
        label: "&aLight up the lanterns"
        voice: steamworks:igor.line01
        lines:
          - "&fIgor: &7Heeeeey, little pumpkin. The lanterns of the"
          - "&7town are dying and the spirits grow restless."
          - "&7Eight candles, six pumpkins - and it glows again."
      candles:
        type: craft
        material: CANDLE
        amount: 8
        label: "&aHand in the eight candles"
        voice: steamworks:igor.line03
        lines:
          - "&fIgor: &7Candles! Honeycomb and string - the world"
          - "&7remembers how that works."
      pumpkins:
        type: deliver
        material: PUMPKIN
        amount: 6
        label: "&aSix pumpkins on the pyre"
        voice: steamworks:igor.line09
        lines:
          - "&fIgor: &7Six round, whole pumpkins. Carve them with"
          - "&7shears if you like - whole ones glow the best."
    rewards:
      - "money 400"
      - "eco 15"
      - "give CARVED_PUMPKIN 1"
      - "effect NIGHT_VISION 60"
      - "sound steamworks:quest.complete"
      - "title &aQUEST COMPLETE|&7Halloween Town blazes on"
      - "tag+ igor_done"
    repeat:
      trick_or_treat:
        label: "&aTrick or treat (2 pumpkins)"
        material: PUMPKIN
        amount: 2
        cooldown: 600
        money: 120
        eco: 2
        voice: steamworks:igor.line11

  # ---- migration-style demo (greyarts' vorkan in 0.2 language) -------------
  vorkan_demo:
    title: "&2Vorkan - Weapon Merchant"
    subtitle: "Weapon Merchant Vorkan Kross &8(demo)"
    icon: IRON_SWORD
    npc-id: 79
    order: 90
    start: "!tag:vorkan_demo_done"
    stages:
      talk:
        type: talk
        label: "&2I'm looking for work."
        lines:
          - "&fVorkan: &7Materials, not excuses. This time:"
          - "&76× gunpowder. The smith needs it for blasting charges."
        choices:
          - label: "&2What went wrong with the last contract?"
            say: "&7Vorkan: &8nothing - except you never finished it."
            cond: "!tag:vorkan_grumpy"
            do: ["tag+ vorkan_grumpy"]
        next: gunpowder
      gunpowder:
        type: deliver
        material: GUNPOWDER
        amount: 6
        label: "&aDeliver 6× gunpowder"
    rewards:
      - "money 650"
      - "point vorkan_friend +1"
      - "sound steamworks:quest.complete"
      - "title &2CONTRACT COMPLETE|&7Vorkan remembers your name"
      - "tag+ vorkan_demo_done"

sequences: {}
