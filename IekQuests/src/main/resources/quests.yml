      - "Cook's course III - one ramen and two miso soups, hot."
    stages:
      offer:
        type: talk
        label: "&aTeach me the pots."
        lines:
          - "&fDaichi: &7Dashi first - kombu and fish, then the"
          - "&7pot sings. Bring me one ramen, steaming, and two"
          - "&7miso soups. Cold food insults the fire."
      handin:
        type: deliverall
        label: "&aDeliver the hot dishes"
        items:
          - "PAPER 1 ramen"
          - "PAPER 2 miso soup"
        lines:
          - "&fDaichi: &7Broth clear, noodles unbroken. You cook"
          - "&7like someone who will be fed again."
    rewards:
      - "tag+ kit_hot_done"
      - "money 800"
      - "eco 20"
      - "sound steamworks:quest.complete"
      - "title &aQUEST COMPLETE|&eThe Hot Kitchen"
      - "say &fDaichi: &7Last lesson: a meal is not eaten alone."

