  # ---- golf 3 (30-10): preek- en service-quests uit BQ overgezet ------------
  mad_doctor:
    title: "&dThe Mad Doctor"
    subtitle: "Volunteer for science - Machine Hill"
    icon: LINGERING_POTION
    npc-id: 76
    order: 60
    journal:
      - "Sign the waiver, ride the machine, earn /rt."
    stages:
      talk:
        type: talk
        label: "&aLeave the laboratory."
        lines:
          - "&dMad Doctor: &7Ah! A fresh volunteer! Wonderful!"
          - "&7My teleportation machine only exploded twice this week!"
        choices:
          - label: "&aI'll do it."
            cond: "!tag:mad_doctor_done"
            say: "&7Mad Doctor: &eExcellent! Please sign this completely legitimate liability waiver."
            do: ["sequence md_show"]
          - label: "&bSend me immediately. &8(quick trip)"
            cond: "tag:mad_doctor_done"
            say: "&7Mad Doctor: &eStraight to the destination this time. The machine and I had a long talk."
            do: ["sequence md_quick"]
          - label: "&cNo thanks."
            say: "&7Mad Doctor: &eA perfectly reasonable decision. Cowardly, but reasonable."
    rewards: []

  usop:
    title: "&bCapitan Usop's Voyage"
    subtitle: "Passage to the capital"
    icon: OAK_BOAT
    npc-id: 126
    order: 61
    stages:
      talk:
        type: talk
        label: "&aAsk about the voyage."
        lines:
          - "&bCapitan Usop: &7I'm setting sail for the capital."
          - "&7Would you like to travel with me?"
        choices:
          - label: "&aYes, I want passage to the capital."
            say: "&7Capitan Usop: &eVery well! The compass points to the capital docks - meet me there and all aboard!"
            do: ["teleport 2883;67;-670;iekcorbarSeason2"]
          - label: "&cNo, not now."
            say: "&7Capitan Usop: &eAs you wish. Come back if you change your mind."
    rewards: []

  techcore:
    title: "&dThe First Steel"
    subtitle: "Engineer - Techcore trial"
    icon: IRON_INGOT
    npc-id: 125
    order: 62
    start: "!tag:first_steel_completed_1"
    journal:
      - "Chapter I - The Alloy Test: one real Steel Ingot."
    stages:
      offer:
        type: talk
        label: "&dI will make the Steel Ingot."
        lines:
          - "&dEngineer: &7Before you call yourself an engineer, prove it."
          - "&7Make one Steel Ingot the right way - no shortcuts,"
          - "&7no iron painted gray. The blueprint is yours on the word."
        rewards:
          - "techcore blueprint grant %player% ERA_1:technocore_placement"
          - "say &6Quest Updated&7 - &dThe First Steel&7: obtain &d1 Steel Ingot&7 and return."
          - "tag+ first_steel_active_1"
      turnin:
        type: deliver
        material: IRON_INGOT
        name: "steel"
        amount: 1
        label: "&aShow him the ingot."
        lines:
          - "&dEngineer: &7Not yet. I want to see one proper Steel Ingot."
          - "&7Learn the process, build what you need, and come back."
    rewards:
      - "tag+ first_steel_completed_1"
      - "tag- first_steel_active_1"
      - "title &dQUEST COMPLETE|&7The First Steel"
      - "say &dEngineer: &aGood. That is real steel. You earned it - keep it."

  steam_gears:
    title: "&6Cogwork 101"
    subtitle: "Engineer - Steamworks course II"
    icon: CLOCK
    npc-id: 125
    order: 64
    start: "qtag:techcore:first_steel_completed_1,!tag:steam_gears_done"
    journal:
      - "Chapter II - Cogwork: four Cogwheels and two Shafts for the Engineer."
    stages:
      offer:
        type: talk
        label: "&aTeach me to make it turn."
        lines:
          - "&dEngineer: &7Steel was the body. Motion is the soul."
          - "&7Anyone can stack ingots. I want hands that make"
          - "&7things TURN - quietly, in a line, like clockwork."
      cogwork:
        type: deliver
        material: PAPER
        name: cogwheel
        amount: 4
        label: "&aHand in four Cogwheels"
        lines:
          - "&dEngineer: &7Oak sawn straight, teeth cut even."
          - "&7Four Cogwheels. Lay them on the bench, not the floor."
      shafts:
        type: deliver
        material: PAPER
        name: shaft
        amount: 2
        label: "&aHand in two Shafts"
        lines:
          - "&dEngineer: &7A wheel without a spine is a frisbee."
          - "&7Two copper Shafts - and yes, they count as spinning."
    rewards:
      - "tag+ steam_gears_done"
      - "money 600"
      - "eco 15"
      - "techcore blueprint grant %player% ERA_1:fuel_generator_placement"
      - "sound steamworks:quest.complete"
      - "title &aQUEST COMPLETE|&6Cogwork 101"
      - "say &dEngineer: &7It turns. Take it - the Fuel Generator blueprint. Steam needs a hearth, not a campfire."

  steam_boiler:
    title: "&6The Boiler Room"
    subtitle: "Engineer - Steamworks course III"
    icon: LAVA_BUCKET
    npc-id: 125
    order: 65
    start: "qtag:steam_gears:steam_gears_done,!tag:steam_boiler_done"
    journal:
      - "Chapter III - Boiler: one Steam Boiler and two working gauges."
    stages:
      offer:
        type: talk
        label: "&aWhere do I build real steam?"
        lines:
          - "&dEngineer: &7Cogwheels are toys without pressure."
          - "&7Build a Steam Boiler, feed it from a water wheel"
          - "&7or a fire, and bring me proof it can count itself."
      boiler:
        type: deliver
        material: PAPER
        name: steam boiler
        amount: 1
        label: "&aDeliver the Steam Boiler"
        lines:
          - "&dEngineer: &7Copper around, iron within, one seam only."
          - "&7If it hisses, you failed. If it hums, you are here."
      gauges:
        type: deliver
        material: PAPER
        name: gauge
        amount: 2
        label: "&aBring two gauges"
        lines:
          - "&dEngineer: &7A machine you cannot READ is a bomb you"
          - "&7built yourself. One Speed Gauge, one Stress Gauge."
    rewards:
      - "tag+ steam_boiler_done"
      - "money 900"
      - "eco 20"
      - "techcore blueprint grant %player% ERA_1:compactor_placement"
      - "sound steamworks:quest.complete"
      - "title &aQUEST COMPLETE|&6The Boiler Room"
      - "say &dEngineer: &7Pressure with manners. Here - the Compactor blueprint. It eats scrap and gives ore. Fair trade."

  black_gold:
    title: "&6Black Gold"
    subtitle: "Engineer - Steamworks course IV"
    icon: BLACK_DYE
    npc-id: 125
    order: 66
    start: "qtag:steam_boiler:steam_boiler_done,!tag:black_gold_done"
    journal:
      - "Chapter IV - Oil: two crude canisters and one refined fuel."
    stages:
      offer:
        type: talk
        label: "&aWhat runs hotter than water?"
        lines:
          - "&dEngineer: &7Steam is patient. The Guild is not."
          - "&7Somewhere under this world lies a lake that burns."
          - "&8Find it with the Dowsing Rod - it hums over oil."
      crude:
        type: deliver
        material: PAPER
        name: crude
        amount: 2
        label: "&aPump up two crude canisters"
        lines:
          - "&dEngineer: &7Two Canisters of crude, sealed tight."
          - "&7It stains like sin and smells like money. Good."
      refined:
        type: deliver
        material: PAPER
        name: fuel canister
        amount: 1
        label: "&aRefine one canister to fuel"
        lines:
          - "&dEngineer: &7Crude through a Refinery comes out as Fuel."
          - "&7One clean canister - and do not drink it. Nobody."
    rewards:
      - "tag+ black_gold_done"
      - "money 1200"
      - "eco 25"
      - "techcore blueprint grant %player% ERA_1:extractor_placement"
      - "sound steamworks:quest.complete"
      - "title &aQUEST COMPLETE|&6Black Gold"
      - "say &dEngineer: &7The earth pays out. Take the Extractor blueprint - it pulls what the pumpjack missed."

  iron_road:
    title: "&6The Iron Road"
    subtitle: "Engineer - Steamworks course V"
    icon: MINECART
    npc-id: 125
    order: 67
    start: "qtag:black_gold:black_gold_done,!tag:iron_road_done"
    journal:
      - "Chapter V - Rail: a Signal, a Depot and fuel for the line."
    stages:
      offer:
        type: talk
        label: "&aThe machines are ready. Now what?"
        lines:
          - "&dEngineer: &7Now everything we built MOVES somewhere."
          - "&7The Guild lays iron roads - rails with wagons that"
          - "&7eat fuel instead of oats. Build me a working corner of one."
      parts:
        type: deliverall
        label: "&aDeliver signal and depot"
        items:
          - "PAPER 1 signal"
          - "PAPER 1 depot"
        lines:
          - "&dEngineer: &7One Signal, one Depot. The wagons obey the"
          - "&7light and sleep at the depot. That is the whole trick."
      fuel:
        type: deliver
        material: PAPER
        name: fuel canister
        amount: 2
        label: "&aBring two canisters of fuel"
        lines:
          - "&dEngineer: &7A locomotive starts cold and stays temperamental."
          - "&7Two Fuel Canisters - the line breathes on them."
    rewards:
      - "tag+ iron_road_done"
      - "money 1500"
      - "eco 30"
      - "techcore blueprint grant %player% ERA_2:rotary_generator_placement"
      - "sound steamworks:quest.complete"
      - "title &aIRON ROAD PIONEER|&6You move the Guild now"
      - "say &dEngineer: &7Course complete - you built, measured, pumped AND connected. Era Two opens: the Rotary Generator blueprint. Mind what it powers."

