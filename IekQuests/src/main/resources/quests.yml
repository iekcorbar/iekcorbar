  backpack_one:
    title: "&2The First Backpack"
    subtitle: "Elias Packwright - earned, not gifted"
    icon: LEATHER
    npc-ids: "90,91,92"
    order: 40
    journal:
      - "Level 1: explore 4 landmarks, stitch canvas (Mara), build frame (Brann),"
      - "survive the wild, then answer Elias three questions."
      - "Reward: canvas_backpack via the Satchel plugin."
    stages:
      intro:
        type: talk
        label: "&aAccept the first trial"
        lines:
          - "&fElias: &7You travel light, friend. Too light."
          - "&7A real adventurer needs a proper backpack."
          - "&8Mine are earned, not gifted. Are you willing to work for your first one?"
        choices:
          - label: "&aI want to earn my first backpack."
            goto: explore_forest
          - label: "&7Maybe another time."
      explore_forest:
        type: walk
        label: "&eTravel to the Forest Shrine"
        location: "2678;100;-98;iekcorbarSeason2"
        radius: 40
        flat: true
        lines:
          - "&fElias: &7A backpack is for someone who has seen the world."
          - "&7First: find the &6Forest Shrine&7 - a quiet wood shrine."
          - "&8X 2678, Z -98 - the compass points the way."
      explore_river:
        type: walk
        label: "&eTravel to the River Bend"
        location: "3162;100;-182;iekcorbarSeason2"
        radius: 60
        flat: true
        lines:
          - "&fElias: &7A backpack is for someone who has seen the world."
          - "&7First: find the &6River Bend&7 - where the water turns."
          - "&8X 3162, Z -182 - the compass points the way."
      explore_plains:
        type: walk
        label: "&eTravel to the Open Plains"
        location: "3159;100;-1369;iekcorbarSeason2"
        radius: 30
        flat: true
        lines:
          - "&fElias: &7A backpack is for someone who has seen the world."
          - "&7First: find the &6Open Plains&7 - wide grass under open sky."
          - "&8X 3159, Z -1369 - the compass points the way."
      explore_mountain:
        type: walk
        label: "&eTravel to the Old Mountain Pass"
        location: "2793;100;-182;iekcorbarSeason2"
        radius: 40
        flat: true
        lines:
          - "&fElias: &7A backpack is for someone who has seen the world."
          - "&7First: find the &6Old Mountain Pass&7 - the old pass over the ridge."
          - "&8X 2793, Z -182 - the compass points the way."
      canvas:
        type: deliverall
        label: "&aHand in the canvas materials"
        items:
          - "LEATHER 24"
          - "STRING 32"
          - "WHITE_WOOL 16"
        lines:
          - "&fMara: &7Elias sent you? Then we need travelling canvas."
          - "&7Bring me &624 Leather&7, &632 String&7 and &616 White Wool&7."
          - "&8It does not need to be pretty. It needs to hold."
      frame:
        type: deliverall
        label: "&aHand in the frame materials"
        items:
          - "IRON_INGOT 12"
          - "COPPER_INGOT 16"
          - "CHEST 1"
        lines:
          - "&fBrann: &7A backpack without a frame is just a sad sack."
          - "&7Bring me &612 Iron Ingots&7, &616 Copper Ingots&7 and &61 Chest&7."
          - "&8I will make it reliable. No unnecessary steam pistons. Probably."
      hunt_vindicator:
        type: kill
        label: "&cHunt 5 Vindicators"
        amount: 5
        mob: VINDICATOR
        goto: hunt_witch
        lines:
          - "&fElias: &7Anyone can gather supplies. A backpack belongs to someone"
          - "&7who can survive the wild. Start with &65 Vindicators&7."
      hunt_witch:
        type: kill
        label: "&cHunt 5 Witches"
        amount: 5
        mob: WITCH
        goto: hunt_skeleton
        lines:
          - "&7Next: &65 Witches&7. Each kill shows your progress."
      hunt_skeleton:
        type: kill
        label: "&cHunt 10 Skeletons"
        amount: 10
        mob: SKELETON
        goto: final
        lines:
          - "&7Last: &610 Skeletons&7. Then come back to me."
      final:
        type: deliverall
        label: "&aHand in the final fittings"
        goto: q1
        items:
          - "LEATHER 16"
          - "STRING 16"
          - "IRON_INGOT 8"
          - "GOLD_INGOT 2"
        lines:
          - "&fElias: &7You have proven your courage. Now we finish the work."
          - "&7Final fittings: &616 Leather&7, &616 String&7, &68 Iron Ingots&7"
          - "&7and &62 Gold Ingots&7."
      q1:
        type: menu
        lines:
          - "&fElias: &7Before I finish it, answer me honestly."
          - "&7A backpack reflects the kind of adventurer carrying it."
          - "&8What kind of traveller are you?"
        choices:
          - label: "&eI explore every corner of the world."
            goto: q2
            do:
              - "tag- path_wealth"
              - "tag- path_courage"
              - "tag+ path_explorer"
          - label: "&6I seek treasure and riches."
            goto: q2
            do:
              - "tag- path_explorer"
              - "tag- path_courage"
              - "tag+ path_wealth"
          - label: "&cI fight whatever stands before me."
            goto: q2
            do:
              - "tag- path_explorer"
              - "tag- path_wealth"
              - "tag+ path_courage"
      q2:
        type: menu
        lines:
          - "&fElias: &8And when the road becomes dangerous, what keeps you alive?"
        choices:
          - label: "&aPreparation is everything."
            goto: q3
            do:
              - "tag- mind_instinct"
              - "tag- mind_teamwork"
              - "tag+ mind_prepared"
          - label: "&eI trust my instincts."
            goto: q3
            do:
              - "tag- mind_prepared"
              - "tag- mind_teamwork"
              - "tag+ mind_instinct"
          - label: "&bI rely on my friends."
            goto: q3
            do:
              - "tag- mind_prepared"
              - "tag- mind_instinct"
              - "tag+ mind_teamwork"
      q3:
        type: menu
        lines:
          - "&fElias: &8Last question. What do you believe gives an adventurer true power?"
        choices:
          - label: "&dKnowledge is power."
            goto: craft
            do:
              - "tag- power_strength"
              - "tag- power_hope"
              - "tag+ power_knowledge"
          - label: "&cStrength is power."
            goto: craft
            do:
              - "tag- power_knowledge"
              - "tag- power_hope"
              - "tag+ power_strength"
          - label: "&eHope is power."
            goto: craft
            do:
              - "tag- power_knowledge"
              - "tag- power_strength"
              - "tag+ power_hope"
      craft:
        type: talk
        label: "&aLet Elias sew the backpack"
        lines:
          - "&fElias: &7You brought everything. Everything is ready."
          - "&7Let me craft something worthy of your journey."
        rewards:
          - "satchel give canvas_backpack %player%"
          - "tag+ bp_done"
          - "title &aBACKPACK COMPLETE|&7Your first backpack is yours"
          - "sound steamworks:quest.complete"
    rewards: []

  backpack_two:
    title: "&6The Traveller's Mirror"
    subtitle: "Elias Packwright - three trials, three answers"
    icon: BOOK
    npc-id: 90
    order: 41
    start: "qtag:backpack_one:bp_done"
    journal:
      - "Level 2: one trial per answer you gave in the first backpack quest."
      - "Castle routes, big hand-ins, five personal questions."
      - "Reward: copper_backpack via the Satchel plugin."
    stages:
      intro:
        type: talk
        label: "&aBegin the Level 2 trials"
        lines:
          - "&fElias: &7You have already earned your first backpack."
          - "&7Your three answers will now become three trials."
          - "&8Complete them and I will craft a Level 2 Backpack."
        choices:
          - label: "&aI am ready for the trials."
            goto: branch1
          - label: "&7Maybe another time."
      branch1:
        type: menu
        lines:
          - "&fElias: &7Your first trial follows the path you chose."
        choices:
          - label: "&eThe explorer's path: climb the Ancient Castle."
            goto: castle_tower
            cond: "qtag:backpack_one:path_explorer"
          - label: "&6The seeker's path: open the hidden chest."
            goto: castle_chest
            cond: "qtag:backpack_one:path_wealth"
          - label: "&cThe fighter's path: face what sleeps below."
            goto: castle_warden
            cond: "qtag:backpack_one:path_courage"
      castle_tower:
        type: walk
        label: "&eReach the lower tower"
        location: "-725;98;-516;iekcorbarSeason2"
        radius: 12
        goto: castle_hall
        lines:
          - "&fElias: &7Travel to the Ancient Castle near X -792, Y 65, Z -501."
          - "&7Reach its &blower tower&7 first. The height of each stop matters."
      castle_hall:
        type: walk
        label: "&eClimb to the upper hall"
        location: "-737;132;-513;iekcorbarSeason2"
        radius: 12
        goto: castle_summit
        lines:
          - "&7Good. Now the &bupper hall&7 - higher up the same stone."
      castle_summit:
        type: walk
        label: "&eStand at the summit"
        location: "-758;171;-525;iekcorbarSeason2"
        radius: 12
        goto: branch2
        lines:
          - "&7And finally the &bsummit&7. From up there you can read the whole land."
      castle_chest:
        type: walk
        label: "&eOpen the empty chest"
        location: "-791;119;-595;iekcorbarSeason2"
        radius: 8
        goto: branch2
        lines:
          - "&fElias: &7Find the empty chest high in the Ancient Castle."
          - "&8X -791, Y 119, Z -595 - and open it."
          - "&7The treasure was never its contents, but your ability to reach it."
      castle_warden:
        type: kill
        label: "&cDefeat a Warden"
        amount: 1
        mob: WARDEN
        goto: branch2
        lines:
          - "&fElias: &7You chose the path of battle."
          - "&7Defeat a &cWarden&7 while you are inside the castle region."
          - "&8The dark listens. Bring armour and a friend if you can."
      branch2:
        type: menu
        lines:
          - "&fElias: &7The second trial follows what keeps you alive."
        choices:
          - label: "&aThe prepared mind: hand in supplies."
            goto: t2_prepared
            cond: "qtag:backpack_one:mind_prepared"
          - label: "&eThe instinctive mind: hunt what punishes slow decisions."
            goto: t2_enderman
            cond: "qtag:backpack_one:mind_instinct"
          - label: "&bThe team mind: provision a small group."
            goto: t2_teamwork
            cond: "qtag:backpack_one:mind_teamwork"
      t2_prepared:
        type: deliverall
        label: "&aHand in the prepared supplies"
        goto: branch3
        items:
          - "IRON_INGOT 32"
          - "STRING 32"
          - "CHEST 2"
        lines:
          - "&fElias: &7You believe preparation keeps you alive."
          - "&7Bring me &632 Iron Ingots&7, &632 String&7 and &62 Chests&7."
      t2_enderman:
        type: kill
        label: "&cDefeat 8 Endermen"
        amount: 8
        mob: ENDERMAN
        goto: t2_spider
        lines:
          - "&fElias: &7You trust your instincts."
          - "&7Defeat &68 Endermen&7 and &612 Cave Spiders&7 -"
          - "&7enemies that punish slow decisions."
      t2_spider:
        type: kill
        label: "&cDefeat 12 Cave Spiders"
        amount: 12
        mob: CAVE_SPIDER
        goto: branch3
      t2_teamwork:
        type: deliverall
        label: "&aHand in the group provisions"
        goto: branch3
        items:
          - "BREAD 32"
          - "GOLDEN_APPLE 4"
        lines:
          - "&fElias: &7You rely on companions."
          - "&7Bring &632 Bread&7 and &64 Golden Apples&7,"
          - "&7enough to keep a small group standing."
      branch3:
        type: menu
        lines:
          - "&fElias: &7The last trial follows what you believe gives true power."
        choices:
          - label: "&dKnowledge: books and memory made solid."
            goto: t3_knowledge
            cond: "qtag:backpack_one:power_knowledge"
          - label: "&cStrength: materials that will not bend."
            goto: t3_strength
            cond: "qtag:backpack_one:power_strength"
          - label: "&eHope: light taken from a hostile place."
            goto: t3_hope
            cond: "qtag:backpack_one:power_hope"
      t3_knowledge:
        type: deliverall
        label: "&aHand in the knowledge materials"
        goto: q4
        items:
          - "BOOK 24"
          - "AMETHYST_SHARD 16"
        lines:
          - "&fElias: &7You named knowledge as true power."
          - "&7Bring me &624 Books&7 and &616 Amethyst Shards&7."
      t3_strength:
        type: deliverall
        label: "&aHand in the strength materials"
        goto: q4
        items:
          - "OBSIDIAN 16"
          - "IRON_INGOT 32"
        lines:
          - "&fElias: &7You named strength as true power."
          - "&7Bring me &616 Obsidian&7 and &632 Iron Ingots&7."
      t3_hope:
        type: deliverall
        label: "&aHand in the hope materials"
        goto: q4
        items:
          - "GLOWSTONE_DUST 32"
          - "GHAST_TEAR 2"
        lines:
          - "&fElias: &7You named hope as true power."
          - "&7Bring me &632 Glowstone Dust&7 and &2 Ghast Tears&7,"
          - "&7light taken from a hostile place."
      q4:
        type: menu
        lines:
          - "&fElias: &8When duty conflicts with mercy, which guides you?"
        choices:
          - label: "&aDuty must come first."
            goto: q5
          - label: "&dMercy and compassion must guide me."
            goto: q5
          - label: "&eNo rule should replace personal freedom."
            goto: q5
      q5:
        type: menu
        lines:
          - "&fElias: &8You discover an ancient artifact that could change many lives. What should be done with it?"
        choices:
          - label: "&aPreserve it and study it carefully."
            goto: q6
          - label: "&dUse its power to improve lives."
            goto: q6
          - label: "&cDestroy it before its power corrupts anyone."
            goto: q6
      q6:
        type: menu
        lines:
          - "&fElias: &8When a group loses its way, what role do you take?"
        choices:
          - label: "&aI step forward and lead."
            goto: q7
          - label: "&dI support whoever is best suited to lead."
            goto: q7
          - label: "&eI leave the group and find my own way."
            goto: q7
      q7:
        type: menu
        lines:
          - "&fElias: &8When your carefully chosen path ends in failure, what do you do?"
        choices:
          - label: "&aI try again until I succeed."
            goto: q8
          - label: "&dI change my plan and adapt."
            goto: q8
          - label: "&eI accept the failure and learn from it."
            goto: q8
      q8:
        type: menu
        lines:
          - "&fElias: &8Last question. What legacy would you most want your journey to leave behind?"
        choices:
          - label: "&6I want my name and deeds to be remembered."
            goto: reward
          - label: "&aI want others to be safer because I existed."
            goto: reward
          - label: "&dI want others to have the freedom to choose their own path."
            goto: reward
      reward:
        type: talk
        label: "&aCraft the Level 2 Backpack"
        lines:
          - "&fElias: &7All three trials reflect the traveller you chose to become."
          - "&7Everything is ready."
          - "&8Let me craft a backpack worthy of that choice."
        rewards:
          - "satchel give copper_backpack %player%"
          - "tag+ bp_done"
          - "title &2LEVEL 2 BACKPACK|&7Copper and choices"
          - "sound steamworks:quest.complete"
    rewards: []

  backpack_three:
    title: "&dThe City Below"
    subtitle: "Orion the Adventurer - the final backpack"
    icon: DIAMOND
    npc-ids: "90,97"
    order: 42
    start: "qtag:backpack_one:bp_done,qtag:backpack_two:bp_done"
    journal:
      - "Descend at X 2874, Y 67, Z -589. Answer Orion five honest questions."
      - "After the first Level 3: Orion's supply requests come back as contracts"
      - "on this panel - deliver any set for another iron_backpack."
      - "Reputation with Orion: none. He pays in backpacks."
    stages:
      intro:
        type: menu
        lines:
          - "&fElias: &7You have mastered both backpack trials."
          - "&7I cannot craft the final one - but I can tell you how to seek it."
          - "&8The entrance to the city below is beneath the capital. Arm yourself."
        choices:
          - label: "&dI want the final backpack."
            goto: explain
          - label: "&aAsk Orion about trade."
            cond: "qtag:backpack_one:bp_done,!qtag:backpack_two:bp_done"
            do:
              - "chat hi 1"
          - label: "&aAsk Orion about trade."
            cond: "qtag:backpack_two:bp_done,!qtag:backpack_three:bp_done"
            do:
              - "chat hi 2"
          - label: "&aAsk Orion to see everything."
            cond: "qtag:backpack_three:bp_done"
            do:
              - "chat hi 3"
      explain:
        type: talk
        label: "&aDescend into the city below"
        goto: descend
        lines:
          - "&fElias: &7Long ago, the passages beneath the city were built as a bunker."
          - "&7Terrible creatures claimed them. Now only the finest adventurers descend."
          - "&7Somewhere inside is &6Orion&7 - he alone can grant the final backpack."
          - "&7Everything clear? Then go."
      descend:
        type: walk
        label: "&eEnter the city below"
        location: "2874;67;-589;iekcorbarSeason2"
        radius: 20
        goto: orion
        lines:
          - "&6The City Below&7 - the entrance is at:"
          - "&bX 2874, Y 67, Z -589&7."
          - "&8Arm yourself and prepare before you descend."
      orion:
        type: talk
        label: "&aAsk your questions"
        goto: oq1
        lines:
          - "&fOrion: &7So Elias sent someone into the darkness at last."
          - "&7These tunnels devour the unprepared. You reached me -"
          - "&7that already says more than most promises."
          - "&8Before I give you the final backpack, answer five questions honestly."
      oq1:
        type: menu
        lines:
          - "&fOrion: &8Why do you enter places that sensible people fear?"
        choices:
          - label: "&aI want to discover what others never found."
            goto: oq2
          - label: "&6I seek treasure worth the risk."
            goto: oq2
          - label: "&dI go where others need protection."
            goto: oq2
      oq2:
        type: menu
        lines:
          - "&fOrion: &8A companion falls behind while danger closes in. What do you do?"
        choices:
          - label: "&aI turn back and rescue them immediately."
            goto: oq3
          - label: "&dI create a plan that saves them without losing everyone."
            goto: oq3
          - label: "&cI continue. The mission cannot fail for one person."
            goto: oq3
      oq3:
        type: menu
        lines:
          - "&fOrion: &8You find a forbidden source of power. What should happen to it?"
        choices:
          - label: "&aSeal it where nobody can reach it."
            goto: oq4
          - label: "&dStudy it until its purpose is understood."
            goto: oq4
          - label: "&cUse it. Power is wasted when left untouched."
            goto: oq4
      oq4:
        type: menu
        lines:
          - "&fOrion: &8When a group faces uncertainty, which place do you take?"
        choices:
          - label: "&aI step forward and lead."
            goto: oq5
          - label: "&dI support the person best suited to lead."
            goto: oq5
          - label: "&eI trust my own path and move alone."
            goto: oq5
      oq5:
        type: menu
        lines:
          - "&fOrion: &8Last question. What should remain after your journey ends?"
        choices:
          - label: "&6A name that people will remember."
            goto: reward
          - label: "&aA safer world for those who follow."
            goto: reward
          - label: "&dThe freedom for others to choose their own path."
            goto: reward
      reward:
        type: talk
        label: "&aReceive the Level 3 Backpack"
        lines:
          - "&fOrion: &7Honest answers and a long walk in the dark."
          - "&7The final backpack is yours. Wear it well."
        rewards:
          - "satchel give iron_backpack %player%"
          - "tag+ bp_done"
          - "title &dLEVEL 3 BACKPACK|&7Orion keeps his word"
          - "sound steamworks:quest.complete"
    rewards: []
