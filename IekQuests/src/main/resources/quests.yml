            say: "&7You do not belong here. &8The Fisherman Master is waiting for someone else."
            cond: "npc:51"
      go_farmer:
        type: menu
        lines:
          - "&fThe Farmer Master waits on the floating island."
          - "&7Click the right master to register - or switch your path here."
          - "&8Wrong master? They will send you on."
        choices:
          - label: "&aRegister with the Farmer Master"
            goto: fin_farmer
            cond: "npc:50,!tag:reg"
            do:
              - "joinjob farmer"
              - "lp user %player% parent add rank_1"
              - "tag+ reg"
              - "tag+ job_farmer"
              - "title &aCITIZEN|&7You now belong to the farmers"
              - "sound steamworks:quest.complete"
          - label: "&eSwitch: leave the Fishermans for the Farmers"
