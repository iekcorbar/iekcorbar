          - label: "&aChange my race. &8(free, first time)"
            cond: "!tag:cleric_race_used"
            do: ["valhallaraces:races reset race %player%", "tag+ cleric_race_used",
                 "say &7The gods reshape your bloodline - choose anew!"]
