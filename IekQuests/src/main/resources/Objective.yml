# IekQuests Objective definitions.
# Each uncommented top-level key is a unique objective ID.
# PlayerTag prerequisites use AND logic. Prefix a player tag with "!" to require absence.
# Every ServerTag must be assigned globally. All Objective tasks use AND logic.
# Objective progress is stored by player UUID in data.yml and is retained across reloads.
# Completion tags are player tags and are applied once after every task is complete.
# has-item is a live inventory check and must be used with AvailabilityTag. The tag is
# assigned while all prerequisites and has-item tasks pass, and removed when they do not.
# AvailabilityTag objectives refresh after inventory clicks/pickups, every 20 ticks, and before
# a dialogue response uses executeobjective. Reserve each AvailabilityTag for one watcher.
# Manual: true objectives do not complete automatically. A response must invoke them with
# executeobjective; only Manual objectives containing deliver tasks are valid.
# addjournal and removejournal assign or remove Journal entry IDs when the objective completes.
# deliver requires and consumes the requested item quantity exactly once at final completion.
# Item values may be Bukkit materials (for example WOODEN_SWORD) or IekItems IDs (item:custom_id).
#
# Task types:
# kill: target (EntityType), amount.
# deliver / craft / fish / smelt / use-item / has-item: item or target, amount.
# has-item is a live, non-consuming inventory requirement and needs AvailabilityTag.
# break-block / place-block: target (Material), amount.
# reach: x, y, z, world, radius.
# open-container: x, y, z, world, optional target CHEST, TRAPPED_CHEST, or BARREL.
# interact-block: x, y, z, world, optional target Material and action (RIGHT_CLICK_BLOCK by default).
# inventory-click: numeric slot, optional inventory (player-crafting or player), amount (click count), click.
# In the player's 2x2 crafting inventory, result slot is 0 and input slots are 1 through 4.
# Slot 4 is a crafting input; it is not the result slot. Use inventory: player-crafting for E-screen crafting slots.
# enchant: optional target Material, optional enchantment key, amount (successful enchant operations).
# use-item trigger may be consume or interact. interact counts main-hand item interactions.
# Optional EliteMobs/MMOCore/Jobs/Valhalla/WorldGuard objectives need verified integrations; none are assumed here.
# This example is commented out so a new installation does not activate sample gameplay.
#
# objective_example:
#   PlayerTag:
#     - has_started_objective
#     - "!objective_already_done"
#   ServerTag:
#     - objective_system_enabled
#   Objective:
#     - type: kill
#       target: SLIME
#       amount: 4
#     - type: deliver
#       item: WOODEN_SWORD
#       amount: 3
#   OncompleteRemoveTag:
#     - has_started_objective
#   OncompleteAssignTag:
#     - objective_already_done
#   addjournal:
#     - objective_example
#   removejournal: []
#
# Example inventory gate and manual delivery objective. Define both player tags first.
# brakka_delivery_available:
#   PlayerTag:
#     - brakka_quest_active
#     - "!brakka_delivery_complete"
#   ServerTag: []
#   Objective:
#     - type: has-item
#       item: IRON_INGOT
#       amount: 6
#   AvailabilityTag: brakka_delivery_ready
#   OncompleteRemoveTag: []
#   OncompleteAssignTag: []
#   addjournal: []
#   removejournal: []
#
# brakka_delivery_submit:
#   PlayerTag:
#     - brakka_delivery_ready
#   ServerTag: []
#   Manual: true
#   Objective:
#     - type: deliver
#       item: IRON_INGOT
#       amount: 6
#   OncompleteRemoveTag:
#     - brakka_delivery_ready
#   OncompleteAssignTag:
#     - brakka_delivery_complete
#   addjournal: []
#   removejournal: []
#
# In the response entry in responses.yml, set:
# executeobjective: brakka_delivery_submit
# The objective is rechecked and items are consumed only when that response is selected.
#
# Additional task examples (uncomment and place inside an objective's Objective list):
