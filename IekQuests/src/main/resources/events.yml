# IekQuests event configuration.
# Each section contains named event entries. All matching entries run in declaration order.
# prerequisiteTag uses AND logic; prefix a tag with "!" to require it to be absent.
# commands run in order. A trailing "-s" suppresses IekQuests command feedback where supported.
# setplayertag assigns known player tags after prerequisites pass.
# addjournal and removejournal assign or remove Journal entry IDs for the triggering player.
# dialogues starts the listed dialogue IDs in order. on-leave does not support dialogues.
#
# Event-specific filters:
# on-world-change: world (destination), optional from-world (source).
# on-advancement: advancement (NamespacedKey, for example minecraft:story/mine_diamond).
# on-quest-accept / on-quest-complete: quest-id.
# on-level-up: level, or min-level and/or max-level (vanilla Minecraft XP level).
# on-region-enter / on-region-leave: region (WorldGuard region ID; requires WorldGuard).
# on-objective-complete: objective-id (an existing Objective.yml ID). Runs after objective state, tags, and Journal effects are saved.
# on-join, on-first-join, on-leave, and on-respawn need no event-specific filter.
# on-join runs after each successful player connection; on-first-join runs only on the server's first join.
# on-leave runs while the player is disconnecting; it cannot open dialogues.
# on-respawn runs after the player respawns. on-world-change runs after the destination world changes.
# on-advancement runs when the player completes the matching advancement.
# on-quest-accept and on-quest-complete run when IekQuests starts or completes the matching quest.
# on-objective-complete runs after the objective has completed and its own tag and Journal effects have been applied.
# on-level-up uses the vanilla Minecraft XP level; it does not represent MMOCore or another external RPG level.
# Region event sections run only when the compatible WorldGuard event API is installed and available.
#
# Every section is a mapping from an entry ID to its configuration. Use {} when empty.
# Event entries may also contain sequences: [sequence_id] to start definitions from Sequences.yml.
# Objective completion example:
# on-objective-complete:
#   tutorial_craft_done:
#     objective-id: tutorial_craft_sticks
#     prerequisiteTag: []
#     commands: []
#     setplayertag: []
#     addjournal: []
#     removejournal: []
#     dialogues: []
#     sequences: []

on-join:
  welcome_back:
    prerequisiteTag: []
    commands:
      - "server: say Welcome back! -s"
    setplayertag: []
    addjournal: []
    removejournal: []
    dialogues: []
    sequences: []

on-first-join: {}
on-leave: {}
on-respawn: {}
on-world-change: {}
on-advancement: {}
on-quest-accept: {}
on-quest-complete: {}
on-level-up: {}
on-region-enter: {}
on-region-leave: {}
on-objective-complete: {}
