name: IekQuests
version: '${project.version}'
main: com.iekcorbar.quests.IekQuestsPlugin
api-version: '26.2'
description: Own quest engine - conversations, goals, rewards, compass and a click GUI.
author: iekcorbar
softdepend: [Citizens, Vault, AfkCinema, Gouw, Hihou, IekcorbarSiteSync, Kitchen, Kura, Relics, Sakagura, Satchel, Steamworks, SteamworksAdditions, SteamworksPower, Wildlife, Zukan]

commands:
  questbook:
    description: Open the quest menu (or admin operations)
    usage: /questbook [reload|reset <player> [quest]]
    aliases: [questsui, iquests]
  questwizard:
    description: In-game wizard to build a new quest (and NPC) into the config
    usage: /questwizard [delete <quest-id>]
    permission: iekquests.admin
    permission-message: The quest wizard is for staff only.
    aliases: [qwiz]
  iekrestart:
    description: Announce a server restart with a title and countdown, then stop and restart via the VPS watcher
    usage: /iekrestart <minutes 1-60 | seconds 61-3600 | now | cancel>
    permission: iekquests.admin
    permission-message: Only staff can schedule restarts.
    aliases: [iekre, restartnow]

permissions:
  # ---- player permissions
  iekquests.use:
    description: Open the quest book and do quests
    default: true
  iekquests.repeat:
    description: Do repeatable quest contracts
    default: true

  # ---- staff permissions (granular)
  iekquests.wizard:
    description: Use the in-game quest wizard to create and delete quests
    default: op
  iekquests.reload:
    description: Reload the quest config
    default: op
  iekquests.reset:
    description: Reset a player's quest progress
    default: op
  iekquests.give:
    description: Give quest items to players
    default: op
  iekquests.edit:
    description: Edit existing quests via the wizard
    default: op
  iekquests.npc:
    description: Create and manage quest NPCs
    default: op
  iekquests.info:
    description: View quest statistics and debug info
    default: op

  # ---- admin (everything)
  iekquests.admin:
    description: Full admin - wizard, reload, reset, give, edit, npc, info
    default: op

