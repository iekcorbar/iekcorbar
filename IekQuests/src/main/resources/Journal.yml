# IekQuests Journal entries.
# Each top-level key is a unique Journal entry ID and maps to one player objective page.
# Titolo is optional. When omitted, the entry ID is used as the visible title.
# descrizione contains one or more lines shown below the title in the player's Journal book.
# Player assignments are stored by UUID in data.yml and are managed by events, objectives,
# dialogues, or the /iekquest journal add|remove administration command.
# The player command /journal opens a written book containing only that player's assigned entries.
# Keep entry IDs stable after assigning them to players; renaming an ID requires updating references.
#
# quest_example:
#   Titolo:
#     - Example quest
#   descrizione:
#     - Find the lost compass.
#     - Return it to the surveyor near the western gate.
