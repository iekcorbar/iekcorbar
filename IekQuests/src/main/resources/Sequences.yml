# IekQuests reusable delayed sequences.
# Sequence IDs are reusable and can be started from dialogues, responses, and event entries.
# Delays are measured from sequence start and accept non-negative ms, s, or m values.
# Steps must be ordered by increasing delay; equal delays run in YAML declaration order.
# Player tag prerequisites use AND logic; prefix a tag with "!" to require absence.
# Prerequisites are checked before every step. A failed check or player disconnect cancels remaining steps.
# Pending steps are transient: they are canceled on disconnect, plugin reload, or plugin disable and are not persisted.
# Dialogue steps are queued when the player already has an open dialogue.
# Supported step fields: commands, add-player-tags, remove-player-tags, addjournal, removejournal, rewards, dialogues.

# Example:
# tutorial_system_messages:
#   prerequisiteTag:
#     - tutorial_expanded_systems_step
#   steps:
#     - after: 4s
#       commands:
#         - "server: tell %playername% Read the Adventurer's Guide for details about fishing."
#     - after: 8s
#       commands:
#         - "server: tell %playername% The guide also explains agriculture and brewing."
