    action-shift-right: "player:journal"
    quest: "tutorial:jobs_clicked"
  warp:
    material: CARTOGRAPHY_TABLE
    slot: 3
    name: "&eWarp"
    lore:
      - "&7Right-Click waypoints Menu."
      - "&7"
      - "&7Left-Click Home."
      - "&7"
      - "&7Shift+Right-Click warp to the guild."
      - "&7"
    action: "player:mmocore waypoints open %player%"
    action-left: "player:homes"
    action-right: "player:mmocore waypoints open %player%"
    action-shift-right: "player:em adventurersguild"
  gouw:
    material: NETHERITE_HOE
    slot: 4
    name: "&eGouw Menu"
    lore:
      - "&7Click to open your claims (gouw) menu."
      - "&7"
    action: "player:gouw menu"
