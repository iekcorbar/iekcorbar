# IekQuests config

inventory-items:
  profile:
    material: PLAYER_HEAD
    slot: 0
    name: "&eProfile"
    skull: true
    lore:
      - "&7Click for view your profile."
      - "&7"
    action: "player:profile"
    quest: "tutorial:profile_clicked"
  crafting:
    material: SMITHING_TABLE
    slot: 1
    name: "&eCrafting Table Portable"
    lore:
      - "&7Click to open your crafting table!"
