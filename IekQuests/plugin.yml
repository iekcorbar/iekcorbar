name: IekQuests
version: '${project.version}'
main: com.iekcorbar.quests.IekQuestsPlugin
api-version: '26.2'
description: Own quest engine - conversations, goals, rewards, compass and a click GUI.
author: iekcorbar
softdepend: [Citizens, Vault, WorldGuard, AfkCinema, Gouw, Hihou, IekcorbarSiteSync, Kitchen, Kura, Relics, Sakagura, Satchel, Steamworks, SteamworksAdditions, SteamworksPower, Wildlife, Zukan]

commands:
  questbook:
    description: Open the quest menu (or admin operations)
    usage: /questbook [mode [gui|chat]|reload|check [player]|track|reset <player> [quest]]
    aliases: [questsui, iquests]
  iekdialogue:
    description: Administer and validate the NPC dialogue graph
    usage: /iekdialogue <help|list|validate|show|delete|npc|tag|cooldown|test|events|sequences|reload>
  iekobjective:
    description: Administer and validate tag-gated objectives
    usage: /iekobjective <help|list|show|validate|reload|progress|reset|create|set|task|delete>
  iekquest:
    description: Start configured events and manage player Journal entries
    usage: /iekquest reload quest | /iekquest event start <player> <event-id> | /iekquest journal <add|remove> <player> <entry-id>
  journal:
    description: Open the player's IekQuests Journal book
    usage: /journal
    permission: iekquests.use
  questwizard:
    description: In-game GUI editor for quests and the NPC dialogue graph
    usage: /questwizard [delete <quest-id>]
    aliases: [qwiz]
  iekitem:
    description: IekItems - list, give, create and delete custom items (items.yml)
    usage: /iekitem <list|get|give|create|delete|info|reload>
    permission: iekquests.items
    permission-message: IekItems is for staff only.
    aliases: [iitem, ii]
  iekrestart:
    description: Announce a server restart with a title and countdown, then stop and restart via the VPS watcher
    usage: /iekrestart <minutes 1-60 | seconds 61-3600 | now | cancel>
    permission: iekquests.admin
    permission-message: Only staff can schedule restarts.
    aliases: [iekre, restartnow]

permissions:
  # ---- player permissions
  iekquests.use:
    description: Open the quest book and do quests
    default: true
  iekquests.repeat:
    description: Do repeatable quest contracts
    default: true

  # ---- staff permissions (granular)
  iekquests.dialogue:
    description: Create and edit NPC dialogues, responses, NPC bindings and tag definitions
    default: op
  iekquests.objective:
    description: Administer Objective.yml definitions and player objective progress
    default: op
  iekquests.wizard:
    description: Use the in-game quest wizard to create and delete quests
    default: op
  iekquests.reload:
    description: Reload the quest config
    default: op
  iekquests.reset:
    description: Reset a player's quest progress
    default: op
  iekquests.give:
    description: Give quest items to players
    default: op
  iekquests.edit:
    description: Edit existing quests via the wizard
    default: op
  iekquests.npc:
    description: Create and manage quest NPCs
    default: op
  iekquests.items:
    description: Use /iekitem (create, give, delete custom items)
    default: op
  iekquests.info:
    description: View quest statistics and debug info
    default: op

  # ---- admin (everything)
  iekquests.admin:
    description: Full admin - wizard, reload, reset, give, edit, npc, info
    default: op

