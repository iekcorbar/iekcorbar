# IekItems - custom items (IekQuests 0.7). Reload: /iekitem reload
#
# /iekitem create <id>   saves the item in your hand here (name, lore, enchants, model)
# /iekitem give <player> <id> [n]     /iekitem get <id> [n]
#
# In quests:
#   reward:    "item <id> [n]"
#   deliver:   material: item:<id>        (matches only THIS item, not look-alikes)
#   contract:  material: item:<id>
#
# Fields (all optional except material):
#   material, name (&-colors), lore (list), enchants (name: level, e.g. sharpness: 3),
#   glow (true), unbreakable (true), item-model ("namespace:path" from the resourcepack),
#   attributes (list: "<attribute> <value> [add_number|add_scalar|multiply_scalar_1] [slot]"
#               e.g. "attack_damage 7 add_number mainhand"; slots: mainhand offhand head chest legs feet any),
#   flags (list of ItemFlag, e.g. HIDE_ATTRIBUTES, HIDE_ENCHANTS),
#   use (list of reward actions run on right-click, same syntax as quest rewards),
#   consume (true = one item is used up), use-cooldown (seconds, default 1),
#   use-permission, use-denied (message)

items:
  example_blade:
    material: IRON_SWORD
    name: "&bExample Blade"
    lore:
      - "&7An example from items.yml."
    enchants:
      sharpness: 2
    attributes:
      - "attack_damage 7 add_number mainhand"
    flags: [HIDE_ATTRIBUTES]
  example_potion_of_thanks:
    material: HONEY_BOTTLE
    name: "&eBottle of Thanks"
    lore:
      - "&7Right-click to cheer up."
    glow: true
    consume: true
    use:
      - "say &eThank you!"
      - "effect REGENERATION 10 0"
