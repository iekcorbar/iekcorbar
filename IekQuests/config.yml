# IekQuests config

# ---- Quest mode: "gui" windows or "chat" = clickable questbook messages.
# Players switch with /questbook mode (or the button in the quest window).
# A quest can force one with `mode: gui|chat` (default `player` = player choice).
default-mode: gui

# ---- NPC dialogue uses a centered Paper Dialog. Text and responses stay in quest data.
dialogue:
  lines-per-page: 5
  title: "&eDialogue"
  text-page: "&7Text"
  responses-page: "&7Responses"
  previous-text: "&e↑ Previous text"
  next-text: "&e↓ More text"
  previous-options: "&7◀ Earlier answers"
  next-options: "&7Later answers ▶"
  close: "&cClose conversation"
  ready-text: "&7Ready when you are."
  complete-text: "&aThe quest is complete!"
  empty-text: "&7There is nothing more to say right now."
  empty-responses: "&7There are no available responses."
  no-eligible-dialogue: "&7There is nothing to discuss right now."
  dialogue-unavailable: "&7That dialogue is no longer available."
  start: "&aYes, I want to begin"
  refuse: "&cNo, not now"
  restart: "&aStart the quest again"
  errors:
    unavailable: "&7That option is no longer available."
    requirements: "&cYou do not meet the requirements for this quest."

# ---- travel action: "travel <destination|x;y;z;world> [cost=N] [warmup=S]"
# Unlike `teleport` (staff only), players may use `travel`: they must stand still during warmup.
travel:
  enabled: true
  warmup-seconds: 3
  cooldown-seconds: 0
  destinations:
    # spawn: "0;80;0;world"
    # guild: "2902;88;-408;iekcorbarSeason2"

# ---- IekItems model browser: folders (relative to the server root) whose .zip packs are scanned
# for item models. Default: the ResourcePackManager mixer.
# pack-dirs:
#   - plugins/ResourcePackManager/mixer
