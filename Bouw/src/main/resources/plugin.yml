name: Bouw
version: '${project.version}'
main: com.iekcorbar.bouw.BouwPlugin
api-version: '26.2'
softdepend: [Gouw, Zukan]
description: New building blocks (doors, fences...) as placeable props, with a creative menu.
author: iekcorbar

commands:
  bouw:
    description: Bouw commands
    usage: /bouw [menu|list|give|giveall]
    aliases: [bw]

permissions:
  bouw.creative:
    description: Open the creative menu (/bouw)
    default: op
  bouw.admin:
    description: Give Bouw pieces
    default: op
