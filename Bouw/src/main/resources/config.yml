# Bouw - building pieces.

props:
  # Left-clicks needed to take a piece back in survival.
  break-hits: 2

blocks:
  # The block lines (stairs, slabs, walls, doors...) are vanilla blocks covered by our models.
  # An item display is shown turned 180 degrees about Y; if stairs or doors face the wrong way in game
  # (back to front), change this to 0 and run /bouw reload.
  cover-flip-degrees: 180
  cover-scale: 1.002
  # How often (ticks) pieces near players are checked for a changed state (door opened, button pressed...).
  poll-ticks: 6
