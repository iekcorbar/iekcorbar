name: Satchel
version: '${project.version}'
main: com.iekcorbar.satchel.SatchelPlugin
api-version: '26.2'
description: Backpacks in six tiers with upgrade slots - pickup, magnet, feeding and everlasting.
author: iekcorbar
softdepend: [AfkCinema, Gouw, Hihou, IekcorbarSiteSync, Kitchen, Kura, Relics, Sakagura, Steamworks, SteamworksAdditions, SteamworksPower, Wildlife]
# No softdepend on Zukan: Satchel only REGISTERS its ZukanData supplier (ServicesManager) and never
# calls into Zukan, while Zukan soft-depends on US so its catalog is complete when it enables.
# Listing both sides made a load-order cycle that MythicLib warned about ([Satchel, Zukan, Satchel]).

commands:
  satchel:
    description: Satchel backpack commands
    usage: /satchel <help|give|giveall|list|reload|importbackpacks>
    aliases: [backpack]

permissions:
  satchel.use:
    description: Use backpacks
    default: true
  satchel.admin:
    description: Give items, reload the config
    default: op

