####################################################################################################
# VotingPlugin - VoteShop (Shop.yml) - iekcorbar edition (2026-10-23)
#
# Players get 1 vote point per vote (Config.yml: PointsOnVote: 1) -> max 3 points a day
# (3 vote sites). Prices below are in vote points; /vote shop or the Vote Shop button.
#
# Three categories:
#   Lore Library     - custom lore books (IekcorbarSiteSync: /ibook give)
#   TechCore Workshop- TechCore items      (TechCore:        /tech item give <player> <TYPE:ID> [amount])
#   Supplies         - vanilla items
#
# ADDING A LORE BOOK: copy the 'guild_chronicle_1' block under Categories > LoreLibrary > Shop,
#   rename the key + Identifier_Name, and change the book id in the command
#   (the id is the .txt file name in plugins/IekcorbarSiteSync/books/, see /ibook list).
# ADDING A TECHCORE ITEM: copy a block under Categories > TechCore > Shop and change the
#   TYPE:ID in the command (TYPE = folder/category, ID = item key, e.g. MATERIAL:STEEL_INGOT;
#   use tab-complete on /tech item give to see them) and the ItemModel (techcore:<id lowercase>).
#
# Chest titles sit on a light-grey background -> dark colours (&8 &4).
# After editing: /av reload
####################################################################################################

VoteShop:
  Enabled: true
  Name: '&8⚙ &4&lVote Shop &8⚙'
  BackButton: true
  HideLimitedReached: true
  LimitReached: '&7You already bought this.'
  RequireConfirmation: true
  Disabled: '&cThe Vote Shop is closed right now.'
  ReopenGUIOnPurchase: false
  BackButtonItem:
    Material: BARRIER
    Amount: 1
    Name: '&c◀ Back'
    Slot: -2 # last slot

# ---------------------------------------------------------------------------------------------
# Main page: three category buttons
# ---------------------------------------------------------------------------------------------
Shop:
  LoreLibrary:
    Category: 'LoreLibrary'
    DisplayItem:
      Material: BOOKSHELF
      Amount: 1
      Name: '&6&lLore Library'
      Lore:
        - '&7Rare lore books from the archives.'
        - '&7Read them to unlock &eLore advancements&7.'
        - ''
        - '&a▶ Open'
    Permission: ''
    HideOnNoPermission: true

  TechCore:
    Category: 'TechCore'
    DisplayItem:
      Material: PISTON
      Amount: 1
      Name: '&6&lTechCore Workshop'
      Lore:
        - '&7Parts and tools for your machines.'
        - ''
        - '&a▶ Open'
    Permission: ''
    HideOnNoPermission: true

  Supplies:
    Category: 'Supplies'
    DisplayItem:
      Material: BARREL
      Amount: 1
      Name: '&6&lSupplies'
      Lore:
        - '&7Useful everyday items.'
        - ''
        - '&a▶ Open'
    Permission: ''
    HideOnNoPermission: true

Categories:

  # -------------------------------------------------------------------------------------------
  # Lore Library - each book can be bought once (Limit: 1)
  # -------------------------------------------------------------------------------------------
  LoreLibrary:
    Name: '&8⚙ &4Lore Library'
    BackButton: true
