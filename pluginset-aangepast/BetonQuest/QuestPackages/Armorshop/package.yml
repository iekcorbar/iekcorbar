  brakka_life_book_reward: command give %player% minecraft:written_book[written_book_content={title:"The
    Stonewall Ledger",author:"Brakka Stonewall",pages:['{"text":"The Stonewall Ledger\n\nI
    was raised where the mountain roads narrowed and every caravan needed guards.
    My first armor was made from scavenged iron and stubbornness."}','{"text":"Armor
    is not a wall. It is a promise to move when the wearer moves, hold when the enemy
    strikes, and never become a prison."}','{"text":"Leather whispers before it tears.
    Iron complains. Copper bends. Diamond refuses. Netherite simply endures."}','{"text":"The
    finest armor returns dented and empty because its owner came home alive. That
    is the only legend worth forging."}']}] 1
