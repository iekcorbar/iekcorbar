npc_holograms:
  brakka_available:
    lines:
    - '&d&l❗'
    npcs: '95'
    conditions: '!brakka_daily_cooldown_v2,!brakka_has_active_quest_v2'
    follow: true
    check_interval: 20
    max_range: 25
  brakka_active:
    lines:
    - '&8&l❓'
    - '&7Quest in progress'
    npcs: '95'
    conditions: brakka_has_active_quest_v2
    follow: true
    check_interval: 20
    max_range: 25
npc_conversations:
  '95': brakka_conv
conversations:
  brakka_conv:
    quester: Armor Merchant Brakka Stonewall
    first: brakka_start_close,brakka_start_friendly,brakka_start
    stop: true
    NPC_options:
      brakka_start_close:
        text: Back again, eh? Good. I prefer customers who survive long enough to
          return. \n\nDo not lean on the armor displays. Half of them are sharper
          than they look, and the other half are loaded. \n\nWhat does my best client
          need today?
        conditions: brakka_friendship_61
        pointers: pl_open_shop_2,pl_talk_little,pl_about_brakka,pl_just_hi
      brakka_start_friendly:
        text: Welcome back. I remember your face, and more importantly, I remember
          that you pay attention. \n\nKeep your hands clear of the forge tools unless
          you want fewer fingers. \n\nWhat can Brakka Stonewall do for you?
        conditions: brakka_friendship_31,!brakka_friendship_61
        pointers: pl_open_shop_1,pl_talk_little,pl_about_brakka,pl_just_hi
      brakka_start:
        text: Welcome, traveler. \n\nBlades, spears, mechanisms, reinforced grips...
          if it can end a fight quickly, I probably sell it. \n\nSpeak clearly. What
          do you need?
        conditions: '!brakka_friendship_31'
        pointers: pl_open_shop,pl_talk_little,pl_about_brakka,pl_just_hi
      brakka_shop:
        text: A fine choice. \n\nLet me open the armor displays.
        actions: brakka_open_shop
        pointers: pl_end_conversation
      brakka_shop_1:
        text: A fine choice. \n\nLet me open the armor displays.
        actions: brakka_open_shop_1
        pointers: pl_end_conversation
      brakka_shop_2:
        text: A fine choice. \n\nLet me open the armor displays.
        actions: brakka_open_shop_2
        pointers: pl_end_conversation
      brakka_talk_available:
        text: You want work? Good. I need materials, not excuses. \n\nBring me what
          I ask for and I will pay. Maybe I will even remember your name.
        conditions: '!brakka_daily_cooldown_v2,!brakka_has_active_quest_v2'
        pointers: pl_accept_random_quest,pl_refuse_random_quest
      brakka_talk_cooldown:
        text: We already had a deal recently. \n\nA forge needs time to heat, cool,
          and curse properly. Come back later.
        conditions: brakka_daily_cooldown_v2,!brakka_has_active_quest_v2
        pointers: pl_end_conversation
      brakka_talk_active:
        text: You are already carrying one of my contracts. \n\nEither bring the materials
          or stop blocking the counter.
        conditions: brakka_has_active_quest_v2
        pointers: pl_turn_in_materials,pl_end_conversation
      brakka_turnin_q1_ready:
        text: Strong enough. An armor stand with a crooked frame ruins every fitting.
        conditions: brakka_q1_active,brakka_q1_has_items
        actions: brakka_q1_complete
        pointers: pl_end_conversation
      brakka_turnin_q1_missing:
        text: Not enough. I asked for 24 Sticks.
        conditions: brakka_q1_active,!brakka_q1_has_items
        pointers: pl_end_conversation
      brakka_turnin_q2_ready:
        text: Good leather. Strong enough for straps, padding, and reinforced joints.
        conditions: brakka_q2_active,brakka_q2_has_items
        actions: brakka_q2_complete
        pointers: pl_end_conversation
      brakka_turnin_q2_missing:
        text: Not enough. I asked for 16 Leather.
        conditions: brakka_q2_active,!brakka_q2_has_items
        pointers: pl_end_conversation
      brakka_turnin_q3_ready:
        text: Strong fibers. Good. Armor fails first where its bindings are weak.
        conditions: brakka_q3_active,brakka_q3_has_items
        actions: brakka_q3_complete
        pointers: pl_end_conversation
      brakka_turnin_q3_missing:
        text: Not enough. I asked for 12 String.
        conditions: brakka_q3_active,!brakka_q3_has_items
        pointers: pl_end_conversation
      brakka_turnin_q4_ready:
        text: Good coal. Dark, dry, and angry enough for the furnace.
        conditions: brakka_q4_active,brakka_q4_has_items
        actions: brakka_q4_complete
        pointers: pl_end_conversation
      brakka_turnin_q4_missing:
        text: Not enough. I asked for 16 Coal.
        conditions: brakka_q4_active,!brakka_q4_has_items
        pointers: pl_end_conversation
      brakka_turnin_q5_ready:
        text: Iron. Simple. Reliable. Most soldiers survive because of this metal.
        conditions: brakka_q5_active,brakka_q5_has_items
        actions: brakka_q5_complete
        pointers: pl_end_conversation
      brakka_turnin_q5_missing:
        text: Not enough. I asked for 10 Iron Ingots.
        conditions: brakka_q5_active,!brakka_q5_has_items
        pointers: pl_end_conversation
      brakka_turnin_q6_ready:
        text: Copper bends without breaking. Perfect for fittings and articulated
          joints.
        conditions: brakka_q6_active,brakka_q6_has_items
        actions: brakka_q6_complete
        pointers: pl_end_conversation
      brakka_turnin_q6_missing:
        text: Not enough. I asked for 12 Copper Ingots.
        conditions: brakka_q6_active,!brakka_q6_has_items
        pointers: pl_end_conversation
      brakka_turnin_q7_ready:
        text: Gold for ceremonial trim. Wasteful, but profitable.
        conditions: brakka_q7_active,brakka_q7_has_items
        actions: brakka_q7_complete
        pointers: pl_end_conversation
      brakka_turnin_q7_missing:
        text: Not enough. I asked for 6 Gold Ingots.
        conditions: brakka_q7_active,!brakka_q7_has_items
        pointers: pl_end_conversation
      brakka_turnin_q8_ready:
        text: Redstone. Good. Now I can finish the locking plates and release mechanisms.
        conditions: brakka_q8_active,brakka_q8_has_items
        actions: brakka_q8_complete
        pointers: pl_end_conversation
      brakka_turnin_q8_missing:
        text: Not enough. I asked for 6 Redstone Dust.
        conditions: brakka_q8_active,!brakka_q8_has_items
        pointers: pl_end_conversation
      brakka_turnin_q9_ready:
        text: Good flint. Sharp enough to expose weak leather and careless stitching.
        conditions: brakka_q9_active,brakka_q9_has_items
        actions: brakka_q9_complete
        pointers: pl_end_conversation
      brakka_turnin_q9_missing:
        text: Not enough. I asked for 10 Flint.
        conditions: brakka_q9_active,!brakka_q9_has_items
        pointers: pl_end_conversation
      brakka_turnin_q10_ready:
        text: Good. Raw iron gives me enough freedom to shape the plate properly.
        conditions: brakka_q10_active,brakka_q10_has_items
        actions: brakka_q10_complete
        pointers: pl_end_conversation
      brakka_turnin_q10_missing:
        text: Not enough. I asked for 48 Raw Iron.
        conditions: brakka_q10_active,!brakka_q10_has_items
        pointers: pl_end_conversation
      brakka_turnin_q11_ready:
        text: A diamond. Expensive, stubborn, and perfect for elite reinforcement.
        conditions: brakka_q11_active,brakka_q11_has_items
        actions: brakka_q11_complete
        pointers: pl_end_conversation
      brakka_turnin_q11_missing:
        text: Not enough. I asked for 1 Diamond.
        conditions: brakka_q11_active,!brakka_q11_has_items
        pointers: pl_end_conversation
      brakka_turnin_q12_ready:
        text: Netherite scrap. Now this is the kind of protection worthy of a legend.
        conditions: brakka_q12_active,brakka_q12_has_items
        actions: brakka_q12_complete
        pointers: pl_end_conversation
      brakka_turnin_q12_missing:
        text: Not enough. I asked for 1 Netherite Scrap.
        conditions: brakka_q12_active,!brakka_q12_has_items
        pointers: pl_end_conversation
      brakka_about:
        text: Me? \n\nI learned armor before I learned manners. The first lesson lasted.
          The second did not. \n\nI buy raw materials, shape reliable protection,
          and sell it to people who understand that surviving a battle is better than
          looking heroic in one. \n\nA helmet must protect without blinding you. A
          chestplate must breathe. Greaves must bend. Boots must grip. \n\nEverything
          else is decoration, and decoration does not stop steel.
        pointers: pl_more_story,pl_end_conversation
      brakka_story_1:
        text: Once, a noble ordered armor covered in spikes. I removed half of them,
          improved the joints, and saved him from being trapped inside his own carriage.
        conditions: brakka_current_story_1
        actions: brakka_story_1_mark_heard,brakka_story_clear_selection,brakka_life_book_reward_check
        pointers: pl_end_conversation
      brakka_story_2:
        text: My first master said every suit of armor remembers the hammer that shaped
          it. Mine remembered impatience, burned gloves, and very accurate rivets.
        conditions: brakka_current_story_2
        actions: brakka_story_2_mark_heard,brakka_story_clear_selection,brakka_life_book_reward_check
        pointers: pl_end_conversation
      brakka_story_3:
        text: A mercenary once demanded armor that made no sound. I told him silence
          costs more than steel. He paid without arguing.
        conditions: brakka_current_story_3
        actions: brakka_story_3_mark_heard,brakka_story_clear_selection,brakka_life_book_reward_check
        pointers: pl_end_conversation
      brakka_story_4:
        text: I tested a breastplate against a charging boar. The plate survived.
          The fence behind me did not.
        conditions: brakka_current_story_4
        actions: brakka_story_4_mark_heard,brakka_story_clear_selection,brakka_life_book_reward_check
        pointers: pl_end_conversation
      brakka_story_5:
        text: The prettiest armor I ever made cracked within a month. The ugliest
          set is still protecting a city guard after ten years. Remember that.
        conditions: brakka_current_story_5
        actions: brakka_story_5_mark_heard,brakka_story_clear_selection,brakka_life_book_reward_check
        pointers: pl_end_conversation
      brakka_story_6:
        text: A strong buckle matters more than gold trim. Gold impresses fools. A
          buckle keeps the plate closed when fear arrives.
        conditions: brakka_current_story_6
        actions: brakka_story_6_mark_heard,brakka_story_clear_selection,brakka_life_book_reward_check
        pointers: pl_end_conversation
      brakka_story_7:
        text: I once built a suit with hidden redstone releases so its owner could
          escape underwater. He paid double after needing it on the first voyage.
        conditions: brakka_current_story_7
        actions: brakka_story_7_mark_heard,brakka_story_clear_selection,brakka_life_book_reward_check
        pointers: pl_end_conversation
      brakka_story_8:
        text: Some customers ask for legendary armor. I ask whether they have legendary
          coin and legendary patience. Most legends end there.
        conditions: brakka_current_story_8
        actions: brakka_story_8_mark_heard,brakka_story_clear_selection,brakka_life_book_reward_check
        pointers: pl_end_conversation
      brakka_accept:
        text: Good. Let us see what the forge demands today.
        actions: brakka_assign_random_daily_quest,brakka_start_daily_cooldown_v2
        pointers: pl_show_assigned_quest
      brakka_assigned_q1:
        text: Bring me 24 Sticks. A blade begins with grip, balance, and boring old
          wood. Return when you have them.
        conditions: brakka_q1_active
        pointers: pl_end_conversation
      brakka_assigned_q2:
        text: Bring me 16 Leather. Good grips need leather that will not slip in blood
          or rain. Return when you have them.
        conditions: brakka_q2_active
        pointers: pl_end_conversation
      brakka_assigned_q3:
        text: Bring me 12 String. Bowstrings snap when cheap hands make them. Bring
          me proper cord. Return when you have them.
        conditions: brakka_q3_active
        pointers: pl_end_conversation
      brakka_assigned_q4:
        text: Bring me 16 Coal. My forge is hungry, and hungry forges make better
          steel. Return when you have them.
        conditions: brakka_q4_active
        pointers: pl_end_conversation
      brakka_assigned_q5:
        text: Bring me 10 Iron Ingots. Iron is the backbone of every honest suit of
          armor. Return when you have them.
        conditions: brakka_q5_active
        pointers: pl_end_conversation
      brakka_assigned_q6:
        text: Bring me 12 Copper Ingots. Copper is useful for fittings, rivets, and
          clever little mechanisms. Return when you have them.
        conditions: brakka_q6_active
        pointers: pl_end_conversation
      brakka_assigned_q7:
        text: Bring me 6 Gold Ingots. Gold does not make a blade stronger, but nobles
          pay for shine. Return when you have them.
        conditions: brakka_q7_active
        pointers: pl_end_conversation
      brakka_assigned_q8:
        text: Bring me 6 Redstone Dust. Some weapons need a spark before they become
          dangerous. Return when you have them.
        conditions: brakka_q8_active
        pointers: pl_end_conversation
      brakka_assigned_q9:
        text: Bring me 10 Flint. Flint is useful for testing leather, padding, and
          weak seams. Return when you have them.
        conditions: brakka_q9_active
        pointers: pl_end_conversation
      brakka_assigned_q10:
        text: Bring me 48 Raw Iron. Fresh ore gives me enough material to forge and
          reinforce new armor. Return when you have it.
        conditions: brakka_q10_active
        pointers: pl_end_conversation
      brakka_assigned_q11:
        text: Bring me 1 Diamond. Diamond reinforcement can turn good armor into something
          exceptional. Return when you have them.
        conditions: brakka_q11_active
        pointers: pl_end_conversation
      brakka_assigned_q12:
        text: Bring me 1 Netherite Scrap. Bring me Netherite Scrap. Some weapons are
          forged for legends, not guards. Return when you have them.
        conditions: brakka_q12_active
        pointers: pl_end_conversation
      brakka_refuse:
        text: Then stop breathing on my counter. Come back when you are useful.
        pointers: pl_end_conversation
      brakka_goodbye:
        text: Keep your armor dry, your straps tight, and your back away from strangers.
        pointers: pl_end_conversation
