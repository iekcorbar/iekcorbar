npc_conversations:
  '78': petra_conv
conversations:
  petra_conv:
    quester: Gemologist Petra
    first: petra_start_close,petra_start_friendly,petra_start
    stop: true
    NPC_options:
      petra_start_close:
        text: Ah! There you are. I was wondering when my favorite helper would return.
          \n\nCareful near the fusion chamber, dear friend. I would rather not lose
          you to an unstable crystal. \n\nTell me, what can Petra do for you today?
        conditions: petra_friendship_61
        pointers: pl_open_shop_2,pl_talk_little,pl_about_petra,pl_just_hi
      petra_start_friendly:
        text: Welcome back. It is good to see a familiar face among all these merchants
          and impatient fools. \n\nMind your step near the gems, yes? Some are delicate...
          and some are dramatic. \n\nWhat can Petra do for you today?
        conditions: petra_friendship_31,!petra_friendship_61
        pointers: pl_open_shop_1,pl_talk_little,pl_about_petra,pl_just_hi
      petra_start:
        text: Ah, welcome, traveler. \n\nCareful where you step... some gems are worth
          more than a house. \n\nOthers explode if handled by fools. \n\nWhat can
          Petra do for you today?
        conditions: '!petra_friendship_31'
        pointers: pl_open_shop,pl_talk_little,pl_about_petra,pl_just_hi
      petra_shop:
        text: Of course. \n\nLet me open my finest collection.
        actions: petra_open_shop
        pointers: pl_end_conversation
      petra_shop_1:
        text: Of course. \n\nLet me open my finest collection.
        actions: petra_open_shop_1
        pointers: pl_end_conversation
      petra_shop_2:
        text: Of course. \n\nLet me open my finest collection.
        actions: petra_open_shop_2
        pointers: pl_end_conversation
      petra_talk_available:
        text: Hm... you want to talk? \n\nGood. Most people only want to buy. \n\nActually,
          I may have a small job for you. \n\nBring me some materials, and I will
          make it worth your time.
        conditions: '!petra_daily_cooldown,!petra_has_active_quest'
        pointers: pl_accept_random_quest,pl_refuse_random_quest
      petra_talk_cooldown:
        text: We already made a deal recently. \n\nGemstones require patience. \n\nCome
          back later, and perhaps I will have another request for you.
        conditions: petra_daily_cooldown,!petra_has_active_quest
        pointers: pl_end_conversation
      petra_talk_active:
        text: You already have a task from me.\n\nIf you brought the materials, hand
          them over. If not, finish the work first.
        conditions: petra_has_active_quest
        pointers: pl_turn_in_materials,pl_end_conversation
      petra_turnin_q1_ready:
        text: Coal. Good. This still remembers ancient forests.
        conditions: petra_q1_active,petra_q1_has_items
        actions: petra_q1_complete
        pointers: pl_end_conversation
      petra_turnin_q1_missing:
        text: Not enough. I asked for 16 Coal. Return when you actually have them.
        conditions: petra_q1_active,!petra_q1_has_items
        pointers: pl_end_conversation
      petra_turnin_q2_ready:
        text: Raw Copper. Flexible, warm, obedient.
        conditions: petra_q2_active,petra_q2_has_items
        actions: petra_q2_complete
        pointers: pl_end_conversation
      petra_turnin_q2_missing:
        text: Not enough. I asked for 12 Raw Copper.
        conditions: petra_q2_active,!petra_q2_has_items
        pointers: pl_end_conversation
      petra_turnin_q3_ready:
        text: Raw Iron. Stubborn material. I like stubborn materials.
        conditions: petra_q3_active,petra_q3_has_items
        actions: petra_q3_complete
        pointers: pl_end_conversation
      petra_turnin_q3_missing:
        text: Not enough. I asked for 10 Raw Iron.
        conditions: petra_q3_active,!petra_q3_has_items
        pointers: pl_end_conversation
      petra_turnin_q4_ready:
        text: Raw Gold. Gold always thinks it is more important than it is.
        conditions: petra_q4_active,petra_q4_has_items
        actions: petra_q4_complete
        pointers: pl_end_conversation
      petra_turnin_q4_missing:
        text: Not enough. I asked for 8 Raw Gold.
        conditions: petra_q4_active,!petra_q4_has_items
        pointers: pl_end_conversation
      petra_turnin_q5_ready:
        text: Amethyst Shards. Listen carefully. They are still singing.
        conditions: petra_q5_active,petra_q5_has_items
        actions: petra_q5_complete
        pointers: pl_end_conversation
      petra_turnin_q5_missing:
        text: Not enough. I asked for 6 Amethyst Shards.
        conditions: petra_q5_active,!petra_q5_has_items
        pointers: pl_end_conversation
      petra_turnin_q6_ready:
        text: Lapis Lazuli. A quiet blue flame in stone form.
        conditions: petra_q6_active,petra_q6_has_items
        actions: petra_q6_complete
        pointers: pl_end_conversation
      petra_turnin_q6_missing:
        text: Not enough. I asked for 4 Lapis Lazuli.
        conditions: petra_q6_active,!petra_q6_has_items
        pointers: pl_end_conversation
      petra_turnin_q7_ready:
        text: Redstone Dust. Keep it away from open flame and idiots.
        conditions: petra_q7_active,petra_q7_has_items
        actions: petra_q7_complete
        pointers: pl_end_conversation
      petra_turnin_q7_missing:
        text: Not enough. I asked for 4 Redstone Dust.
        conditions: petra_q7_active,!petra_q7_has_items
        pointers: pl_end_conversation
      petra_turnin_q8_ready:
        text: Quartz. Honest, sharp, clear, and terribly fragile.
        conditions: petra_q8_active,petra_q8_has_items
        actions: petra_q8_complete
        pointers: pl_end_conversation
      petra_turnin_q8_missing:
        text: Not enough. I asked for 3 Quartz.
        conditions: petra_q8_active,!petra_q8_has_items
        pointers: pl_end_conversation
      petra_turnin_q9_ready:
        text: Emeralds. Merchants see money. I see potential.
        conditions: petra_q9_active,petra_q9_has_items
        actions: petra_q9_complete
        pointers: pl_end_conversation
      petra_turnin_q9_missing:
        text: Not enough. I asked for 2 Emeralds.
        conditions: petra_q9_active,!petra_q9_has_items
        pointers: pl_end_conversation
      petra_turnin_q10_ready:
        text: A diamond. Good. Try not to look too proud.
        conditions: petra_q10_active,petra_q10_has_items
        actions: petra_q10_complete
        pointers: pl_end_conversation
      petra_turnin_q10_missing:
        text: Not enough. I asked for 1 Diamond.
        conditions: petra_q10_active,!petra_q10_has_items
        pointers: pl_end_conversation
      petra_turnin_q11_ready:
        text: Glowstone Dust. Light reduced to a useful powder.
        conditions: petra_q11_active,petra_q11_has_items
        actions: petra_q11_complete
        pointers: pl_end_conversation
      petra_turnin_q11_missing:
        text: Not enough. I asked for 8 Glowstone Dust.
        conditions: petra_q11_active,!petra_q11_has_items
        pointers: pl_end_conversation
      petra_turnin_q12_ready:
        text: Prismarine Crystals. The sea has strange patience.
        conditions: petra_q12_active,petra_q12_has_items
        actions: petra_q12_complete
        pointers: pl_end_conversation
      petra_turnin_q12_missing:
        text: Not enough. I asked for 4 Prismarine Crystals.
        conditions: petra_q12_active,!petra_q12_has_items
        pointers: pl_end_conversation
      petra_about:
        text: Me? \n\nI was born among steam pipes, brass engines, and greedy merchants
          who thought gems were just decorations. \n\nBut gems are not decorations.
          \n\nThey are memory. Pressure. Fire. Time. \n\nI learned how to create artificial
          gems by combining rare materials, purified dust, and calibrated steam pressure.
          \n\nThen, after many accidents, broken machines, and one very angry nobleman,
          I discovered something special. \n\nTwo gems of the same level can be fused
          into a stronger one. \n\nOf course... the process is delicate. \n\nAnd expensive.
        pointers: pl_more_story,pl_end_conversation
      petra_story_1:
        text: Once, I tried to fuse two rubies during a thunderstorm. \n\nThe result
          was beautiful. \n\nIt also burned my eyebrows for three weeks.
        conditions: petra_current_story_1
        actions: petra_story_1_mark_heard,petra_life_book_reward_check,petra_story_clear_selection
        pointers: pl_end_conversation
      petra_story_2:
        text: A noble once asked me to create a gem that could prove his courage.
          \n\nI gave him a mirror-polished crystal. \n\nHe never came back.
        conditions: petra_current_story_2
        actions: petra_story_2_mark_heard,petra_life_book_reward_check,petra_story_clear_selection
        pointers: pl_end_conversation
      petra_story_3:
        text: I once found a sapphire inside the boiler of an abandoned machine. \n\nNo
          one knows how it got there. \n\nSometimes I think the machine grew it.
        conditions: petra_current_story_3
        actions: petra_story_3_mark_heard,petra_life_book_reward_check,petra_story_clear_selection
        pointers: pl_end_conversation
      petra_story_4:
        text: My first successful fusion created a gem so bright that every lamp in
          my workshop went dark. \n\nFor a moment, the gem was the only light in the
          room.
        conditions: petra_current_story_4
        actions: petra_story_4_mark_heard,petra_life_book_reward_check,petra_story_clear_selection
        pointers: pl_end_conversation
      petra_story_5:
        text: I had a teacher once. \n\nHe said gems do not become stronger by avoiding
          pressure. \n\nI think about that often.
        conditions: petra_current_story_5
        actions: petra_story_5_mark_heard,petra_life_book_reward_check,petra_story_clear_selection
        pointers: pl_end_conversation
      petra_story_6:
        text: One customer tried to eat an emerald because he thought it was candied
          fruit. \n\nHe survived. \n\nThe emerald did not.
        conditions: petra_current_story_6
        actions: petra_story_6_mark_heard,petra_life_book_reward_check,petra_story_clear_selection
        pointers: pl_end_conversation
      petra_story_7:
        text: Some gems sing when the pressure is perfect. \n\nNot loudly. \n\nJust
          enough to make you wonder if the earth is still dreaming.
        conditions: petra_current_story_7
        actions: petra_story_7_mark_heard,petra_life_book_reward_check,petra_story_clear_selection
        pointers: pl_end_conversation
      petra_story_8:
        text: I once traded a flawless topaz for a broken compass. \n\nTerrible trade,
          everyone said. \n\nBut that compass led me to my first fusion chamber.
        conditions: petra_current_story_8
        actions: petra_story_8_mark_heard,petra_life_book_reward_check,petra_story_clear_selection
        pointers: pl_end_conversation
      petra_accept:
        text: Excellent. Let us see what fate requires today.
        actions: petra_assign_random_daily_quest,petra_start_daily_cooldown
        pointers: pl_show_assigned_quest
      petra_assigned_q1:
        text: Bring me 16 Coal. Even the simplest gem needs pressure and carbon. Return
          to me when you have them.
        conditions: petra_q1_active
        pointers: pl_end_conversation
      petra_assigned_q2:
        text: Bring me 12 Raw Copper. Copper remembers the first machines. Return
          to me when you have them.
        conditions: petra_q2_active
        pointers: pl_end_conversation
      petra_assigned_q3:
        text: Bring me 10 Raw Iron. I need metal with honest weight. Return to me
          when you have it.
        conditions: petra_q3_active
        pointers: pl_end_conversation
      petra_assigned_q4:
        text: Bring me 8 Raw Gold. Gold bends easily, but it remembers power. Return
          to me when you have it.
        conditions: petra_q4_active
        pointers: pl_end_conversation
      petra_assigned_q5:
        text: Bring me 6 Amethyst Shards. They hum beautifully under pressure. Return
          to me when you have them.
        conditions: petra_q5_active
        pointers: pl_end_conversation
      petra_assigned_q6:
        text: Bring me 4 Lapis Lazuli. Blue stones are excellent for stable fusion.
          Return to me when you have them.
        conditions: petra_q6_active
        pointers: pl_end_conversation
      petra_assigned_q7:
        text: Bring me 4 Redstone Dust. Controlled instability is still instability.
          Return to me when you have it.
        conditions: petra_q7_active
        pointers: pl_end_conversation
      petra_assigned_q8:
        text: Bring me 3 Quartz. Clean structure, clean fusion. Return to me when
          you have it.
        conditions: petra_q8_active
        pointers: pl_end_conversation
      petra_assigned_q9:
        text: Bring me 2 Emeralds. Do not ask why. Just do not chip them. Return to
          me when you have them.
        conditions: petra_q9_active
        pointers: pl_end_conversation
      petra_assigned_q10:
        text: Bring me 1 Diamond. Some stones deserve respect before they deserve
          use. Return to me when you have it.
        conditions: petra_q10_active
        pointers: pl_end_conversation
      petra_assigned_q11:
        text: Bring me 8 Glowstone Dust. Light trapped in powder. Wonderful. Return
          to me when you have it.
        conditions: petra_q11_active
        pointers: pl_end_conversation
      petra_assigned_q12:
        text: Bring me 4 Prismarine Crystals. Sea-born crystals behave strangely in
          steam chambers. Return to me when you have them.
        conditions: petra_q12_active
        pointers: pl_end_conversation
      petra_refuse:
        text: Fair enough. \n\nNot everyone has the patience to work with stones.
        pointers: pl_end_conversation
      petra_goodbye:
        text: Then may your path be bright, traveler. \n\nAnd may you never step on
          an unstable crystal.
        pointers: pl_end_conversation
