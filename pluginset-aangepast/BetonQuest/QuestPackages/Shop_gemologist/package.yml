package:
  enabled: true
  version: 3.2.0-QUEST-2 # Don't change this! The plugin's automatic quest updater handles it.
npcs:
  '78': citizens 78
items:
  petra_coal: simple coal
  petra_raw_copper: simple raw_copper
  petra_raw_iron: simple raw_iron
  petra_raw_gold: simple raw_gold
  petra_amethyst_shard: simple amethyst_shard
  petra_lapis: simple lapis_lazuli
  petra_redstone: simple redstone
  petra_quartz: simple quartz
  petra_emerald: simple emerald
  petra_diamond: simple diamond
  petra_glowstone_dust: simple glowstone_dust
  petra_prismarine_crystal: simple prismarine_crystals
  petra_journal: simple WRITTEN_BOOK "author:@[minimessage]Petra Gemstone" "title:@[minimessage]Uncolored
    Gem" "text:@[minimessage]=== Chapter I - A<br>Child of Stone ===<br><br>I was
    born in a small<br>mining settlement<br>nestled among gray<br>hills and endless
    rock.<br>Most children spent<br>their days playing in<br>the streets, but I<br>spent
    mine exploring<br>abandoned tunnels<br>and searching for<br>unusual stones.|The
    miners often<br>laughed at me. To<br>them, a stone was<br>worth only the metal<br>hidden
    inside it. To me,<br>every stone carried a<br>story.<br><br>One evening, an old<br>traveler
    arrived at<br>our village. around<br>the fire, he spoke of<br>a legendary treasure|known
    as the<br>Uncolored Gem.<br><br>Unlike emeralds,<br>rubies, or diamonds,<br>this
    gem possessed no<br>color at all. Yet<br>legends claimed it<br>contained every
    color<br>that ever existed.<br>It was said that<br>whoever discovered<br>it would
    understand<br>the hidden language|of the world itself.<br><br>That night I could
    not<br>sleep.<br><br>I decided that one day<br>I would find it.|=== Chapter II
    - The<br>Sea of Sand ===<br><br>My journey began in<br>the Great Desert of<br>Khar.<br>For
    months I crossed<br>dunes taller than<br>castle walls. I followed<br>forgotten
    maps,<br>explored buried<br>temples, and searched<br>ancient tombs<br>swallowed
    by the sand.|I found many<br>treasures.<br><br>Golden idols.<br>Ancient coins.<br>Jewels
    worth small<br>fortunes.<br><br>But never the<br>Uncolored Gem.<br>One day I discovered<br>a
    ruined shrine buried<br>beneath a<br>storm-carved cliff.|Deep inside, I found<br>an
    inscription<br><br>\"The Gem cannot be<br>possessed by those<br>who seek wealth.\"<br><br>At
    the time, I thought it<br>was merely a warning.<br><br>Years later, I<br>understood
    it was a<br>lesson.|=== Chapter III - The<br>Emerald Jungle ===<br><br>My search
    led me<br>beyond the desert<br>into the Emerald<br>Jungle.<br><br>There the trees
    grew<br>so tall that their<br>crowns hid the sky<br>itself.|The jungle was filled<br>with
    dangers.<br><br>Venomous creatures.<br>Ancient traps.<br>Ruins older than<br>recorded
    history.<br><br>In the heart of the<br>jungle I discovered a<br>forgotten city<br>overgrown
    by roots<br>and vines.|Inside a collapsed<br>observatory I found<br>another clue.<br><br>A
    mural depicted<br>travelers from many<br>lands carrying<br>different gems toward<br>a
    single light.<br><br>Beneath the mural<br>were written the<br>words:|\"The Gem
    belongs to<br>all paths and none.\"<br><br>Again I failed to<br>understand.<br><br>Still,
    I continued<br>onward.|=== Chapter IV - The<br>City Beneath the Earth<br>===<br><br>Many
    years later I<br>discovered a hidden<br>city beneath the<br>mountains.<br><br>Its
    halls were carved<br>entirely from crystal.|There I met scholars,<br>explorers,
    and<br>treasure hunters who<br>had also spent their<br>lives searching for<br>the
    Uncolored Gem.<br><br>Together we studied<br>countless records.<br><br>Every legend
    ended<br>the same way.|The Gem was always<br>found.<br><br>And always lost.<br><br>No
    map could reveal<br>its location.<br><br>No king could possess<br>it.<br><br>No
    empire could keep<br>it.|For the first time,<br>doubt entered my<br>heart.<br><br>Perhaps
    the Gem was<br>only a myth.|=== Chapter V - The<br>Ruins at the Edge of<br>the
    World ===<br><br>Old and weary, I<br>followed one final clue<br>to ruins standing
    upon<br>cliffs overlooking an<br>endless sea.<br><br>There, within a<br>circular
    chamber<br>open to the stars,|I discovered a<br>pedestal.<br><br>Upon it rested
    a<br>single crystal.<br><br>It was clear as glass.<br><br>Colorless.<br><br>Ordinary.<br><br>Or
    so it seemed.|When moonlight<br>touched its surface,<br>every color imaginable<br>appeared
    within it for<br>a brief moment.<br><br>The crystal was<br>beautiful.<br><br>Yet
    I knew immediately<br>it was not the<br>treasure I had<br>sought.|It was only
    a symbol.<br><br>And at last I<br>understood.|=== Chapter VI - The<br>Meaning
    of the Gem<br>===<br><br>The Uncolored Gem<br>was never a stone.<br><br>It was
    the journey<br>itself.<br><br>Every desert<br>crossed.<br>Every jungle<br>explored.|Every
    ruin uncovered.<br>Every friend met<br>along the way.<br><br>The Gem contained<br>every
    color because<br>it was made from<br>every experience<br>gathered during a<br>lifetime
    of exploration.|Yet I possessed<br>something far more<br>valuable.<br>Knowledge.<br>Memories.<br>Stories.<br>And
    now, dear reader,<br>one final story has<br>been added.|Yours.<br><br>If you hold
    this book<br>in your hands, then<br>you listened when<br>others did not.<br><br>Perhaps
    one day you<br>too will discover your<br>own Uncolored Gem."
