  tutorial_profession_instruction_message: 'notify "&6Tutorial &8» &7Your final starting specialization determines which resource-gathering activities your character performs most efficiently. Speak with the &bClass Assignor &7and make your final choice." io:chat'
  tutorial_schedule_profession_crafting_reminder: 'folder tutorial_profession_crafting_reminder delay:3 conditions:tutorial_profession_step_active'
  tutorial_profession_crafting_reminder: 'notify "&6Production Reminder &8» &7If a crafting recipe is locked, it means you do not yet have enough experience in that production discipline. Train the relevant production skill to unlock more advanced crafts." io:chat'

  tutorial_confirm_miner: 'folder tutorial_command_choose_miner,tutorial_add_choosed_profession_tag,tutorial_schedule_profession_selection_finish conditions:tutorial_can_choose_profession'
  tutorial_confirm_farmer_fisherman: 'folder tutorial_command_choose_farmer_fisherman,tutorial_add_choosed_profession_tag,tutorial_schedule_profession_selection_finish conditions:tutorial_can_choose_profession'
  tutorial_confirm_terraformer: 'folder tutorial_command_choose_terraformer,tutorial_add_choosed_profession_tag,tutorial_schedule_profession_selection_finish conditions:tutorial_can_choose_profession'
  tutorial_command_choose_miner: 'command valhallaraces:races set class %player% miner'
  tutorial_command_choose_farmer_fisherman: 'command valhallaraces:races set class %player% farmer'
  tutorial_command_choose_terraformer: 'command valhallaraces:races set class %player% terraformer'
  tutorial_add_choosed_profession_tag: 'tag add Choosed_profession'
