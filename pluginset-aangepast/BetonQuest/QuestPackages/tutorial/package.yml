  tutorial_remove_specialization_journal: 'journal delete tutorial_choose_specialization'
  tutorial_specialization_title: 'notify "&6Chapter IX\n&dProduction Specialization" io:title fadeIn:0 stay:60 fadeOut:0'
  tutorial_specialization_instruction_message: 'notify "&6Tutorial &8» &7Your second specialization focuses on crafting and production. Speak with the &bClass Assignor &7again and choose the discipline that best fits your plans." io:chat'

  tutorial_confirm_alchemist: 'folder tutorial_command_choose_alchemist,tutorial_add_choosed_specialization_tag,tutorial_schedule_specialization_selection_finish conditions:tutorial_can_choose_specialization'
  tutorial_confirm_enchanter: 'folder tutorial_command_choose_enchanter,tutorial_add_choosed_specialization_tag,tutorial_schedule_specialization_selection_finish conditions:tutorial_can_choose_specialization'
  tutorial_confirm_blacksmith: 'folder tutorial_command_choose_blacksmith,tutorial_add_choosed_specialization_tag,tutorial_schedule_specialization_selection_finish conditions:tutorial_can_choose_specialization'
  tutorial_command_choose_alchemist: 'command valhallaraces:races set class %player% alchemist'
  tutorial_command_choose_enchanter: 'command valhallaraces:races set class %player% enchanter'
  tutorial_command_choose_blacksmith: 'command valhallaraces:races set class %player% blacksmith'
  tutorial_add_choosed_specialization_tag: 'tag add Choosed_specialization'
  tutorial_schedule_specialization_selection_finish: 'folder tutorial_finish_specialization_selection delay:2 conditions:tutorial_specialization_chosen'
  tutorial_finish_specialization_selection: 'folder tutorial_remove_specialization_journal,tutorial_remove_specialization_step_tag,tutorial_specialization_selected_message,tutorial_start_profession_selection'
  tutorial_specialization_selected_message: 'notify "&6Quest Updated &8» &a✔ &7Your production specialization has been chosen. Return to the &bClass Assignor &7one final time for your gathering specialization." io:chat'

  # --------------------------------------------------------------------------
  # STEP 10 / CHAPTER X - Gathering Specialization
  # NPC 128 - Class Assignor
  # --------------------------------------------------------------------------
  tutorial_start_profession_selection: 'folder tutorial_add_profession_step_tag,tutorial_add_profession_journal,tutorial_profession_title,tutorial_profession_instruction_message,tutorial_schedule_profession_crafting_reminder'
