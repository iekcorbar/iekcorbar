  # TUTORIAL COMPLETION
  # --------------------------------------------------------------------------
  tutorial_complete: 'folder tutorial_add_finished_tag,tutorial_final_cleanup,tutorial_return_to_spawn,tutorial_give_starter_items,tutorial_complete_title,tutorial_complete_message,tutorial_starter_items_message,tutorial_adventurers_guild_message'
  tutorial_add_finished_tag: 'tag add tutorial_finished'

  # Return the player to the server spawn before granting the starter equipment.
  tutorial_return_to_spawn: 'command cmi spawn %player%'

  # Starter equipment granted at the end of the tutorial.
  # MMOItems commands are executed by the console, therefore %player% is explicit.
  tutorial_give_starter_items: 'folder tutorial_give_leather_boots,tutorial_give_leather_chestplate,tutorial_give_leather_helmet,tutorial_give_leather_leggings,tutorial_give_bamboo_stream_rod,tutorial_give_autosmelt_pickaxe'
  tutorial_give_leather_boots: 'command mi give ARMOR SHOPARMOR_BOOTS_LEATHER %player%'
  tutorial_give_leather_chestplate: 'command mi give ARMOR SHOPARMOR_CHESTPLATE_LEATHER %player%'
  tutorial_give_leather_helmet: 'command mi give ARMOR SHOPARMOR_HELMET_LEATHER %player%'
  tutorial_give_leather_leggings: 'command mi give ARMOR SHOPARMOR_LEGGINGS_LEATHER %player%'
