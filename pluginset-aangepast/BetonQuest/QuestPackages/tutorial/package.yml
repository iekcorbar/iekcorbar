conversations:
  tutorial_conv:
    quester: '&6Tutorial'
    first: tutorial_restart_finished,tutorial_restart_active,tutorial_start_silent
    stop: true
    NPC_options:
      tutorial_restart_finished:
        text: 'You have already completed the tutorial. Would you like to restart it from the beginning? Your previous Tutorial progress will be cleared before you return to the tutorial area.'
        conditions: 'tutorial_finished'
        pointers: tutorial_player_restart_yes,tutorial_player_restart_no
      tutorial_restart_active:
        text: 'You already have the tutorial in progress. Would you like to restart it from the beginning? Your current Tutorial progress will be cleared before you return to the tutorial area.'
        conditions: 'tutorial_started,!tutorial_finished'
        pointers: tutorial_player_restart_yes,tutorial_player_restart_no
      tutorial_start_silent:
        text: ' '
        conditions: '!tutorial_started'
        actions: tutorial_start
    player_options:
      tutorial_player_restart_yes:
        text: 'Yes, restart the tutorial.'
        actions: tutorial_restart_confirmed
      tutorial_player_restart_no:
        text: 'No, keep my current progress.'

  tutorial_dialogue_conv:
    quester: 'Dialogue tutorial'
    first: tutorial_dialogue_intro
    stop: true
    NPC_options:
      tutorial_dialogue_intro:
        text: |-
          You can interact with the citizens of Iekobar. Use W and S to scroll through the chat when a message is particularly long. You can also use W and S to select one of the available answers, then press <space> to confirm it.

          Be careful during quests and missions: the choices you make will remain part of your character and may lead you to quests created specifically for players who made the same decisions as you.

          Finally, remember that the lore and history of this world will advance according to your choices.

          If everything is clear, answer me.
        conditions: 'tutorial_step_1_completed,!tutorial_dialogue_completed'
        pointers: tutorial_player_all_clear
      tutorial_dialogue_choose_topic:
        text: 'What would you like to start with? A tutorial about professions, attributes, or commands?'
        pointers: tutorial_player_professions,tutorial_player_attributes,tutorial_player_commands
      tutorial_dialogue_wrong_choice:
        text: 'Wrong choice. In truth, this was a false choice: I decide where you begin, and first we will look at the commands together.'
        pointers: tutorial_player_close_wrong
      tutorial_dialogue_wise_choice:
        text: 'A wise choice. I would have started with the commands too.'
        pointers: tutorial_player_close_wise
    player_options:
      tutorial_player_all_clear:
        text: 'Everything is clear.'
        pointers: tutorial_dialogue_choose_topic
      tutorial_player_professions:
        text: 'I want to start with professions.'
        pointers: tutorial_dialogue_wrong_choice
      tutorial_player_attributes:
        text: 'I want to start with attributes.'
        pointers: tutorial_dialogue_wrong_choice
      tutorial_player_commands:
        text: 'I want to start with commands.'
        pointers: tutorial_dialogue_wise_choice
      tutorial_player_close_wrong:
        text: 'Close conversation'
        actions: tutorial_finish_dialogue
      tutorial_player_close_wise:
        text: 'Close conversation'
        actions: tutorial_finish_dialogue


  tutorial_race_assignor_conv:
    quester: '&bRace Assignor'
    first: tutorial_race_already_chosen,tutorial_race_intro,tutorial_race_not_ready
    stop: true
    NPC_options:
      tutorial_race_already_chosen:
        text: 'Your race has already been chosen. That decision is now part of your character.'
        conditions: 'tutorial_race_chosen'

      tutorial_race_not_ready:
        text: 'Your path is not ready for this choice yet. Complete the previous parts of the tutorial, then return to me.'
        conditions: '!tutorial_race_step_active,!tutorial_race_chosen'

      tutorial_race_intro:
        text: |-
          Your race represents the biological and cultural nature of your character. Every race has its own strengths and weaknesses, and your choice directly influences several statistics.

          Choose a race below to learn about it. You will not be assigned a race until you explicitly confirm your choice.
        conditions: 'tutorial_can_choose_race'
        pointers: tutorial_player_race_gearborn,tutorial_player_race_cinderbeard,tutorial_player_race_clockmoth,tutorial_player_race_rustborn

      tutorial_race_gearborn_description:
        text: |-
          Gearborn

          The Gearborn are steam-augmented people whose bodies combine flesh and machinery.

          Strengths: Engineering, Smithing and Mechanics, improved explosion resistance, additional armor and increased maximum health.

          Weaknesses: their heavier mechanical bodies reduce movement and swimming speed.

          They are especially suited to technology, industry and crafting.
        pointers: tutorial_player_race_back,tutorial_player_choose_gearborn

      tutorial_race_cinderbeard_description:
        text: |-
          Cinderbeard

          The Cinderbeards are a forge-born people accustomed to underground industry, heat and physical labor.

          Strengths: Smithing and Mining, greater fire resistance, increased melee damage and natural armor.

          Weaknesses: their compact, heavy bodies make them slower on land and particularly poor swimmers.

          They are especially suited to mining, forging and close-range combat.
        pointers: tutorial_player_race_back,tutorial_player_choose_cinderbeard

      tutorial_race_clockmoth_description:
        text: |-
          Clockmoth

          Clockmoths combine lightweight bodies with small clockwork wings and a natural affinity for aether and magic.

          Strengths: Magic and Light Weapons, increased movement speed, improved jumping and resistance to fall damage.

          Weaknesses: reduced maximum health and greater vulnerability to melee attacks.

          They are especially suited to mobile, magical and light-combat characters.
        pointers: tutorial_player_race_back,tutorial_player_choose_clockmoth

      tutorial_race_rustborn_description:
        text: |-
          Rustborn

          The Rustborn are survivors shaped by industrial decay, toxic environments and years of exposure to metal and machinery.

          Strengths: Mining, Heavy Weapons, Poison Resistance, Melee Resistance and Armor.

          Weaknesses: their durability comes at the expense of mobility and attack speed.

          They are especially suited to slow, resilient and heavily armored characters.
        pointers: tutorial_player_race_back,tutorial_player_choose_rustborn

      tutorial_race_confirmed:
        text: 'Then it is decided. Your choice has been recorded.'

    player_options:
      tutorial_player_race_gearborn:
        text: 'Gearborn'
        pointers: tutorial_race_gearborn_description
      tutorial_player_race_cinderbeard:
        text: 'Cinderbeard'
        pointers: tutorial_race_cinderbeard_description
      tutorial_player_race_clockmoth:
        text: 'Clockmoth'
        pointers: tutorial_race_clockmoth_description
      tutorial_player_race_rustborn:
        text: 'Rustborn'
        pointers: tutorial_race_rustborn_description
      tutorial_player_race_back:
        text: 'Back to the race menu.'
        pointers: tutorial_race_intro

      tutorial_player_choose_gearborn:
        text: 'I choose this race.'
        actions: tutorial_confirm_gearborn
        pointers: tutorial_race_confirmed
      tutorial_player_choose_cinderbeard:
        text: 'I choose this race.'
        actions: tutorial_confirm_cinderbeard
        pointers: tutorial_race_confirmed
      tutorial_player_choose_clockmoth:
        text: 'I choose this race.'
        actions: tutorial_confirm_clockmoth
        pointers: tutorial_race_confirmed
      tutorial_player_choose_rustborn:
        text: 'I choose this race.'
        actions: tutorial_confirm_rustborn
        pointers: tutorial_race_confirmed



  tutorial_class_assignor_conv:
    quester: '&bClass Assignor'
    first: tutorial_class_assignor_complete,tutorial_profession_intro,tutorial_specialization_intro,tutorial_class_intro,tutorial_class_assignor_not_ready
    stop: true
    NPC_options:
      tutorial_class_assignor_complete:
        text: 'Your starting combat, production and gathering specializations have already been chosen.'
        conditions: 'tutorial_all_starting_choices_done'

      tutorial_class_assignor_not_ready:
        text: 'You are not ready for these choices yet. First complete the previous tutorial steps and choose your race.'
        conditions: '!tutorial_class_step_active,!tutorial_specialization_step_active,!tutorial_profession_step_active,!tutorial_all_starting_choices_done'

      # Chapter VIII - Primary Class
      tutorial_class_intro:
        text: |-
          Chapter VIII — Primary Class

          After selecting your race, you will choose your main combat specialization.

          There are currently three Primary Classes. Choose one below to read its characteristics. The class will not be assigned until you explicitly confirm it.
        conditions: 'tutorial_can_choose_class'
        pointers: tutorial_player_class_warrior,tutorial_player_class_barbarian,tutorial_player_class_ranger

      tutorial_class_warrior_description:
        text: |-
          Warrior

          The Warrior focuses on balanced melee combat and protection.

          Bonuses:
          +10\% Armor effectiveness
          +5\% Melee Damage

          This is a reliable choice for players who want to fight at close range while maintaining good protection.
        pointers: tutorial_player_class_back,tutorial_player_choose_warrior

      tutorial_class_barbarian_description:
        text: |-
          Barbarian

          The Barbarian favors brute strength and aggressive melee combat.

          Bonuses:
          +20\% Knockback Resistance
          +10\% Melee Damage

          Compared with the Warrior, the Barbarian sacrifices the emphasis on armor in favor of greater offensive power and stability during combat.
        pointers: tutorial_player_class_back,tutorial_player_choose_barbarian

      tutorial_class_ranger_description:
        text: |-
          Ranger

          The Ranger specializes in fighting enemies from a distance.

          Bonuses:
          +2 Accuracy
          +10\% Ranged Damage

          This specialization favors bows and other ranged approaches, allowing you to engage enemies while avoiding direct confrontation.
        pointers: tutorial_player_class_back,tutorial_player_choose_ranger

      tutorial_class_confirmed:
        text: 'Your primary combat class has been recorded. Return to me after this conversation to choose your production specialization.'

      # Chapter IX - Production Specialization
      tutorial_specialization_intro:
        text: |-
          Chapter IX — Production Specialization

          Your second specialization focuses primarily on crafting and production.

          Choose one below to read its characteristics. The specialization will not be assigned until you explicitly confirm it.
        conditions: 'tutorial_can_choose_specialization'
        pointers: tutorial_player_specialization_alchemist,tutorial_player_specialization_enchanter,tutorial_player_specialization_blacksmith

      tutorial_specialization_alchemist_description:
        text: |-
          Alchemist

          The Alchemist specializes in potions, chemical processes and supportive preparations.

          Bonuses:
          +25 Potion Quality
          +50\% Brewing Speed

          An excellent specialization for players who expect potions and alchemical production to become an important part of their progression.
        pointers: tutorial_player_specialization_back,tutorial_player_choose_alchemist

      tutorial_specialization_enchanter_description:
        text: |-
          Enchanter

          The Enchanter specializes in magical enhancement and item enchanting.

          Bonuses:
          +25 Enchanting Quality
          +20\% Enchanting Experience

          This specialization favors players who want to develop magical equipment and improve their enchanting capabilities.
        pointers: tutorial_player_specialization_back,tutorial_player_choose_enchanter

      tutorial_specialization_blacksmith_description:
        text: |-
          Blacksmith

          The Blacksmith specializes in metalworking, equipment and durable tools.

          Bonuses:
          +25 Smithing Quality
          -20\% Durability Taken

          This makes Blacksmith particularly useful for players interested in equipment production and long-term use of tools and weapons.
        pointers: tutorial_player_specialization_back,tutorial_player_choose_blacksmith

      tutorial_specialization_confirmed:
        text: 'Your production specialization has been recorded. Return to me once more to choose your final gathering specialization.'

      # Chapter X - Gathering Specialization
      tutorial_profession_intro:
        text: |-
          Chapter X — Gathering Specialization

          Your final starting specialization determines which resource-gathering activities your character performs most efficiently.

          Remember: if a crafting recipe is locked, it means you do not yet have enough experience in that production discipline. Continue training the relevant production skill to unlock more advanced crafts.

          Choose one gathering specialization below to inspect it before confirming your decision.
        conditions: 'tutorial_can_choose_profession'
        pointers: tutorial_player_profession_miner,tutorial_player_profession_farmer_fisherman,tutorial_player_profession_terraformer

      tutorial_profession_miner_description:
        text: |-
          Miner

          The Miner specializes in extracting resources from beneath the world.

          Bonuses:
          +30\% Mining Speed
          +10\% Mining Drops

          Mining is particularly important for players interested in resources, crafting and industrial progression.
        pointers: tutorial_player_profession_back,tutorial_player_choose_miner

      tutorial_profession_farmer_fisherman_description:
        text: |-
          Farmer-Fisherman

          The Farmer-Fisherman specializes in food production and gathering resources from both land and water.

          Bonuses:
          +3 Fishing Luck
          +30\% Farming Drops
          +20\% Fishing Speed

          This specialization provides advantages across two gathering activities and is ideal for players interested in sustainable resource production.
        pointers: tutorial_player_profession_back,tutorial_player_choose_farmer_fisherman

      tutorial_profession_terraformer_description:
        text: |-
          Terraformer

          The Terraformer specializes in manipulating and gathering the natural resources of the world.

          Bonuses:
          +50\% Woodcutting Drops
          +30\% Woodcutting Speed
          +30\% Digging Speed

          It is particularly useful for builders, resource gatherers and players who regularly reshape large areas of terrain.
        pointers: tutorial_player_profession_back,tutorial_player_choose_terraformer

      tutorial_profession_confirmed:
        text: 'Your final starting specialization has been recorded. Your character setup is complete.'

    player_options:
      # Chapter VIII
      tutorial_player_class_warrior:
        text: 'Warrior'
        pointers: tutorial_class_warrior_description
      tutorial_player_class_barbarian:
        text: 'Barbarian'
        pointers: tutorial_class_barbarian_description
      tutorial_player_class_ranger:
        text: 'Ranger'
        pointers: tutorial_class_ranger_description
      tutorial_player_class_back:
        text: 'Back to the class menu.'
        pointers: tutorial_class_intro
      tutorial_player_choose_warrior:
        text: 'I choose this class.'
        actions: tutorial_confirm_warrior
        pointers: tutorial_class_confirmed
      tutorial_player_choose_barbarian:
        text: 'I choose this class.'
        actions: tutorial_confirm_barbarian
        pointers: tutorial_class_confirmed
      tutorial_player_choose_ranger:
        text: 'I choose this class.'
        actions: tutorial_confirm_ranger
        pointers: tutorial_class_confirmed

      # Chapter IX
      tutorial_player_specialization_alchemist:
        text: 'Alchemist'
        pointers: tutorial_specialization_alchemist_description
      tutorial_player_specialization_enchanter:
        text: 'Enchanter'
        pointers: tutorial_specialization_enchanter_description
      tutorial_player_specialization_blacksmith:
        text: 'Blacksmith'
        pointers: tutorial_specialization_blacksmith_description
      tutorial_player_specialization_back:
        text: 'Back to the specialization menu.'
        pointers: tutorial_specialization_intro
      tutorial_player_choose_alchemist:
        text: 'I choose this specialization.'
        actions: tutorial_confirm_alchemist
        pointers: tutorial_specialization_confirmed
      tutorial_player_choose_enchanter:
        text: 'I choose this specialization.'
        actions: tutorial_confirm_enchanter
        pointers: tutorial_specialization_confirmed
      tutorial_player_choose_blacksmith:
        text: 'I choose this specialization.'
        actions: tutorial_confirm_blacksmith
        pointers: tutorial_specialization_confirmed

      # Chapter X
      tutorial_player_profession_miner:
        text: 'Miner'
        pointers: tutorial_profession_miner_description
      tutorial_player_profession_farmer_fisherman:
        text: 'Farmer-Fisherman'
        pointers: tutorial_profession_farmer_fisherman_description
      tutorial_player_profession_terraformer:
        text: 'Terraformer'
        pointers: tutorial_profession_terraformer_description
      tutorial_player_profession_back:
        text: 'Back to the gathering menu.'
        pointers: tutorial_profession_intro
      tutorial_player_choose_miner:
        text: 'I choose this specialization.'
        actions: tutorial_confirm_miner
        pointers: tutorial_profession_confirmed
      tutorial_player_choose_farmer_fisherman:
        text: 'I choose this specialization.'
        actions: tutorial_confirm_farmer_fisherman
        pointers: tutorial_profession_confirmed
      tutorial_player_choose_terraformer:
        text: 'I choose this specialization.'
        actions: tutorial_confirm_terraformer
        pointers: tutorial_profession_confirmed

