  tutorial_give_autosmelt_pickaxe: 'command mi give TOOL AUTOSMELT_PICKAXE %player%'

  tutorial_complete_title: 'notify "&6Quest Complete\n&dTutorial" io:title fadeIn:0 stay:60 fadeOut:0'
  tutorial_complete_message: 'notify "&6Quest Complete &8» &a✔ &7You have completed the basic systems tutorial." io:chat'
