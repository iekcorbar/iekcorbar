package:
  enabled: true
  version: 3.2.0-QUEST-2 # Don't change this! The plugin's automatic quest updater handles it.

# ============================================================================
# TUTORIAL QUEST
# NPCs:
# - Citizens ID 122 - &6Tutorial
# - Citizens ID 123 - Dialogue tutorial
# - Citizens ID 127 - Race Assignor
# - Citizens ID 128 - Class Assignor
# World: iekcorbarSeason2
#
# External ItemJoin hooks used by this package:
# - tutorial_inventory_item_clicked      -> portable crafting table item
# - tutorial_profile_item_clicked        -> Profile item
# - tutorial_jobs_menu_item_clicked      -> Jobs Quest menu item
# ============================================================================

npcs:
  '122': citizens 122
  '123': citizens 123
  '127': citizens 127
  '128': citizens 128

npc_conversations:
  '122': tutorial_conv
  '123': tutorial_dialogue_conv
  '127': tutorial_race_assignor_conv
  '128': tutorial_class_assignor_conv

items:
  tutorial_stick: simple stick

conditions:
  tutorial_started: tag start_tutorial
  tutorial_step_1_completed: tag tutorial_step_1_completed
  tutorial_dialogue_completed: tag tutorial_dialogue_completed
  tutorial_waiting_for_inventory: tag tutorial_waiting_for_inventory
  tutorial_inventory_step_active: tag tutorial_inventory_step
  tutorial_menu_tour_step_active: tag tutorial_menu_tour_step
  tutorial_profile_step_active: tag tutorial_profile_step
  tutorial_profile_clicked: tag tutorial_profile_clicked
  tutorial_crafting_step_active: tag tutorial_crafting_step
  tutorial_to_valhalla_step_active: tag tutorial_to_valhalla_step
  tutorial_valhalla_profile_step_active: tag tutorial_valhalla_profile_step
  tutorial_valhalla_step_active: tag tutorial_valhalla_step
  tutorial_jobs_step_active: tag tutorial_jobs_step
  tutorial_to_elitemobs_step_active: tag tutorial_to_elitemobs_step
  tutorial_elitemobs_step_active: tag tutorial_elitemobs_step
  tutorial_expanded_systems_step_active: tag tutorial_expanded_systems_step
  tutorial_race_step_active: tag tutorial_race_step
  tutorial_race_chosen: tag Choosed_race
  tutorial_can_choose_race: and tutorial_race_step_active,!tutorial_race_chosen

  tutorial_class_step_active: tag tutorial_class_step
  tutorial_class_chosen: tag Choosed_class
  tutorial_can_choose_class: and tutorial_class_step_active,!tutorial_class_chosen

  tutorial_specialization_step_active: tag tutorial_specialization_step
  tutorial_specialization_chosen: tag Choosed_specialization
  tutorial_can_choose_specialization: and tutorial_specialization_step_active,!tutorial_specialization_chosen

  tutorial_profession_step_active: tag tutorial_profession_step
  tutorial_profession_chosen: tag Choosed_profession
  tutorial_can_choose_profession: and tutorial_profession_step_active,!tutorial_profession_chosen
  tutorial_all_starting_choices_done: and tutorial_race_chosen,tutorial_class_chosen,tutorial_specialization_chosen,tutorial_profession_chosen

  tutorial_finished: tag tutorial_finished
  tutorial_hide_dialogue_npc: or !tutorial_step_1_completed,tutorial_dialogue_completed

# NPC 123 is hidden separately for each player. It becomes visible after
# completing Step 1 and is hidden again after completing its conversation.
hide_npcs:
  '123': tutorial_hide_dialogue_npc

actions:
  # --------------------------------------------------------------------------
  # AUTOMATIC LOGIN ROUTER
  # --------------------------------------------------------------------------
  # `tutorial_login` is a persistent login objective. On every login it runs
  # this router after a short delay so the player/world are fully available.
  # Order matters: resume is checked before first-start, preventing a brand-new
  # player from being handled twice after `tutorial_start` adds start_tutorial.
  tutorial_handle_login: 'folder tutorial_login_resume_existing,tutorial_login_start_new delay:1'
  tutorial_login_resume_existing: 'teleport 2815;164;-472;iekcorbarSeason2 conditions:tutorial_started,!tutorial_finished'
  tutorial_login_start_new: 'folder tutorial_start conditions:!tutorial_started'

  # --------------------------------------------------------------------------
  # STEP 1 - Start the tutorial and reach the building
  # --------------------------------------------------------------------------
  tutorial_start: 'folder tutorial_add_start_tag,tutorial_start_message,tutorial_add_reach_building_journal,tutorial_start_reach_building,tutorial_teleport_start'
  tutorial_add_start_tag: 'tag add start_tutorial'
  tutorial_teleport_start: 'teleport 2815;164;-472;iekcorbarSeason2'
  tutorial_start_message: 'notify "&6Tutorial Started &8» &7The tutorial begins. Reach the &bbuilding&7." io:chat'
  tutorial_add_reach_building_journal: 'journal add tutorial_reach_building'
  tutorial_start_reach_building: 'objective start tutorial_reach_building'

  # Restart flow used by NPC 122 when the tutorial is already active or completed.
  # The package filter `tutorial>` removes every tag, journal entry and active
  # objective belonging to this Tutorial package before a clean restart.
  tutorial_restart_confirmed: 'folder tutorial_restart_reset_commands,tutorial_restart_schedule_start'
  tutorial_restart_reset_commands: 'command bq tag %player% del tutorial>|bq journal %player% del tutorial>|bq objective %player% del tutorial>'
  tutorial_restart_schedule_start: 'folder tutorial_start delay:1'

  # Step 1 completion.
  tutorial_complete_step_1: 'folder tutorial_remove_reach_building_journal,tutorial_add_step_1_completed_tag,tutorial_update_npc_visibility,tutorial_step_1_completed_message,tutorial_talk_to_dialogue_message'
  tutorial_remove_reach_building_journal: 'journal delete tutorial_reach_building'
  tutorial_add_step_1_completed_tag: 'tag add tutorial_step_1_completed'
  tutorial_step_1_completed_message: 'notify "&6Quest Updated &8» &a✔ &7You reached the &bbuilding&7." io:chat'
  tutorial_talk_to_dialogue_message: 'notify "&6Tutorial &8» &7Talk to &bDialogue tutorial&7." io:chat'
  tutorial_update_npc_visibility: 'updatevisibility'

  # --------------------------------------------------------------------------
  # STEP 2 - Dialogue tutorial and player inventory
  # --------------------------------------------------------------------------
  # Delayed by 2 seconds because these chat messages follow an NPC conversation.
  tutorial_finish_dialogue: 'folder tutorial_add_dialogue_completed_tag,tutorial_add_waiting_inventory_tag,tutorial_add_inventory_step_tag,tutorial_add_open_inventory_journal,tutorial_update_npc_visibility,tutorial_inventory_instruction,tutorial_schedule_portable_crafting_message delay:2'
  tutorial_add_dialogue_completed_tag: 'tag add tutorial_dialogue_completed'
  tutorial_add_waiting_inventory_tag: 'tag add tutorial_waiting_for_inventory'
  tutorial_add_inventory_step_tag: 'tag add tutorial_inventory_step'
  tutorial_add_open_inventory_journal: 'journal add tutorial_open_inventory'
  tutorial_inventory_instruction: 'notify "&6Tutorial &8» &7The main game commands are collected in your inventory menu. Press &bE &7to open it." io:chat'
  tutorial_schedule_portable_crafting_message: 'folder tutorial_portable_crafting_message delay:5 conditions:tutorial_inventory_step_active'
  tutorial_portable_crafting_message: 'notify "&6Tutorial &8» &7Click the &dPortable Crafting Table &7in the top-left of the crafting grid. This gives you access to crafting wherever you are." io:chat'

  # ItemJoin calls this action when the player clicks the configured portable crafting item.
  tutorial_inventory_item_clicked: 'folder tutorial_complete_inventory_step conditions:tutorial_inventory_step_active'
  tutorial_complete_inventory_step: 'folder tutorial_remove_inventory_journal,tutorial_remove_waiting_inventory_tag,tutorial_remove_inventory_step_tag,tutorial_add_menu_tour_step_tag,tutorial_inventory_step_completed_message,tutorial_jobs_menu_message,tutorial_schedule_warp_menu_message'
  tutorial_remove_inventory_journal: 'journal delete tutorial_open_inventory'
  tutorial_remove_waiting_inventory_tag: 'tag delete tutorial_waiting_for_inventory'
  tutorial_remove_inventory_step_tag: 'tag delete tutorial_inventory_step'
  tutorial_add_menu_tour_step_tag: 'tag add tutorial_menu_tour_step'
  tutorial_remove_menu_tour_step_tag: 'tag delete tutorial_menu_tour_step'
  tutorial_inventory_step_completed_message: 'notify "&6Quest Updated &8» &a✔ &7You found the &dPortable Crafting Table&7. Close this screen and open your inventory menu again." io:chat'
  tutorial_jobs_menu_message: 'notify "&6Tutorial &8» &7In the top-right corner is the &dJobs Quest menu&7. You do not have a profession yet, but once you obtain one this menu will show its daily quests." io:chat'

  # Timed introduction to the other Inventory/E menus.
  tutorial_schedule_warp_menu_message: 'folder tutorial_warp_menu_message,tutorial_schedule_lands_menu_message delay:3 conditions:tutorial_menu_tour_step_active'
  tutorial_warp_menu_message: 'notify "&6Tutorial &8» &7In the bottom-left corner is the &dWarp menu&7. Right-click for available waypoints, left-click for your Homes, and shift-right-click to teleport to the &bAdventurers Guild&7. Do not go there yet; finish the tutorial first." io:chat'
  tutorial_schedule_lands_menu_message: 'folder tutorial_lands_menu_message,tutorial_schedule_profile_menu_message delay:3 conditions:tutorial_menu_tour_step_active'
  tutorial_lands_menu_message: 'notify "&6Tutorial &8» &7In the bottom-right corner is your &dLands menu&7. It lets you claim chunks and manage your land." io:chat'
  tutorial_schedule_profile_menu_message: 'folder tutorial_profile_menu_message,tutorial_remove_menu_tour_step_tag,tutorial_add_profile_step_tag,tutorial_add_profile_journal,tutorial_schedule_click_profile_message delay:2 conditions:tutorial_menu_tour_step_active'
  tutorial_profile_menu_message: 'notify "&6Tutorial &8» &7Finally, the most important menu: your &dProfile&7. Your head in the crafting result slot opens it. We will use it again later when we discuss ValhallaMMO." io:chat'
  tutorial_add_profile_step_tag: 'tag add tutorial_profile_step'
  tutorial_add_profile_journal: 'journal add tutorial_click_profile'
  tutorial_schedule_click_profile_message: 'folder tutorial_click_profile_message delay:1 conditions:tutorial_profile_step_active'
  tutorial_click_profile_message: 'notify "&6Tutorial &8» &7Click the &dProfile menu&7." io:chat'

  # ItemJoin calls this same action every time the Profile item is clicked.
  # The two conditioned branches let us use it once in Chapter II and again in Chapter IV.
  tutorial_profile_item_clicked: 'folder tutorial_complete_profile_step,tutorial_open_valhalla_profile'

  tutorial_complete_profile_step: 'folder tutorial_remove_profile_journal,tutorial_remove_profile_step_tag,tutorial_add_profile_clicked_tag,tutorial_start_crafting conditions:tutorial_profile_step_active'
  tutorial_remove_profile_journal: 'journal delete tutorial_click_profile'
  tutorial_remove_profile_step_tag: 'tag delete tutorial_profile_step'
  tutorial_add_profile_clicked_tag: 'tag add tutorial_profile_clicked'

  # --------------------------------------------------------------------------
  # STEP 3 / CHAPTER III - Crafting
  # --------------------------------------------------------------------------
  tutorial_start_crafting: 'folder tutorial_add_crafting_step_tag,tutorial_add_crafting_journal,tutorial_give_crafting_materials,tutorial_start_craft_objective,tutorial_crafting_title,tutorial_crafting_message'
  tutorial_add_crafting_step_tag: 'tag add tutorial_crafting_step'
  tutorial_add_crafting_journal: 'journal add tutorial_crafting'
  tutorial_give_crafting_materials: 'command minecraft:give %player% minecraft:oak_planks 2'
  tutorial_start_craft_objective: 'objective start tutorial_craft_sticks'
  tutorial_crafting_title: 'notify "&6Chapter III\n&dCrafting" io:title fadeIn:0 stay:60 fadeOut:0'
  tutorial_crafting_message: 'notify "&6Tutorial &8» &7Close the Profile, open your &dPortable Crafting Table&7, and turn the &d2 Oak Planks &7I gave you into &d4 Sticks&7." io:chat'

  tutorial_complete_craft_step: 'folder tutorial_remove_crafting_journal,tutorial_add_to_valhalla_step_tag,tutorial_crafting_completed_message,tutorial_schedule_valhalla_start'
  tutorial_remove_crafting_journal: 'journal delete tutorial_crafting'
  tutorial_remove_crafting_step_tag: 'tag delete tutorial_crafting_step'
  tutorial_add_to_valhalla_step_tag: 'tag add tutorial_to_valhalla_step'
  tutorial_remove_to_valhalla_step_tag: 'tag delete tutorial_to_valhalla_step'
  tutorial_crafting_completed_message: 'notify "&6Quest Updated &8» &a✔ &7Crafting complete. Recipes are not only a way to create items: many server systems can also use crafting as part of your progression." io:chat'
  tutorial_schedule_valhalla_start: 'folder tutorial_start_valhalla_profile_step delay:2 conditions:tutorial_to_valhalla_step_active'

  # --------------------------------------------------------------------------
  # STEP 4 / CHAPTER IV - ValhallaMMO
  # --------------------------------------------------------------------------
  # First make the player reopen the Profile so the explanation has visual context.
  tutorial_start_valhalla_profile_step: 'folder tutorial_remove_crafting_step_tag,tutorial_remove_to_valhalla_step_tag,tutorial_add_valhalla_profile_step_tag,tutorial_add_valhalla_profile_journal,tutorial_valhalla_title,tutorial_valhalla_open_profile_message'
  tutorial_add_valhalla_profile_step_tag: 'tag add tutorial_valhalla_profile_step'
  tutorial_add_valhalla_profile_journal: 'journal add tutorial_valhalla_profile'
  tutorial_valhalla_title: 'notify "&6Chapter IV\n&dValhallaMMO" io:title fadeIn:0 stay:60 fadeOut:0'
  tutorial_valhalla_open_profile_message: 'notify "&6Tutorial &8» &7Press &bE&7, then open your &dProfile &7again. This is where your character progression begins to make sense." io:chat'

  tutorial_open_valhalla_profile: 'folder tutorial_remove_valhalla_profile_journal,tutorial_remove_valhalla_profile_step_tag,tutorial_add_valhalla_step_tag,tutorial_add_valhalla_journal,tutorial_valhalla_message_1,tutorial_schedule_valhalla_message_2 conditions:tutorial_valhalla_profile_step_active'
  tutorial_remove_valhalla_profile_journal: 'journal delete tutorial_valhalla_profile'
  tutorial_remove_valhalla_profile_step_tag: 'tag delete tutorial_valhalla_profile_step'
  tutorial_add_valhalla_step_tag: 'tag add tutorial_valhalla_step'
  tutorial_add_valhalla_journal: 'journal add tutorial_valhalla'

  tutorial_valhalla_message_1: 'notify "&6ValhallaMMO &8» &7Valhalla is your personal skill progression. Gathering, crafting and combat skills grow separately as you perform the activities connected to them." io:chat'
  tutorial_schedule_valhalla_message_2: 'folder tutorial_valhalla_message_2,tutorial_schedule_valhalla_message_3 delay:4 conditions:tutorial_valhalla_step_active'
  tutorial_valhalla_message_2: 'notify "&6ValhallaMMO &8» &7Each skill has its own levels and a skill tree. Progress unlocks perks and bonuses, so two players can develop very different strengths even when they use similar equipment." io:chat'
  tutorial_schedule_valhalla_message_3: 'folder tutorial_valhalla_message_3,tutorial_schedule_valhalla_message_4 delay:4 conditions:tutorial_valhalla_step_active'
  tutorial_valhalla_message_3: 'notify "&6ValhallaMMO &8» &7On this server, Mining, Woodcutting, Digging, Farming, Smithing, Enchanting, Alchemy, Archery, light and heavy weapons, and light and heavy armor are active Valhalla skills. Valhalla Fishing is disabled here. &dPower &7is always active." io:chat'
  tutorial_schedule_valhalla_message_4: 'folder tutorial_valhalla_message_4,tutorial_schedule_valhalla_finish delay:4 conditions:tutorial_valhalla_step_active'
  tutorial_valhalla_message_4: 'notify "&6ValhallaMMO &8» &7Your Valhalla skills are not the same thing as your Job. Valhalla describes what your character has learned; Jobs describe the profession that pays and assigns work to you." io:chat'
  tutorial_schedule_valhalla_finish: 'folder tutorial_finish_valhalla_step delay:4 conditions:tutorial_valhalla_step_active'
  tutorial_finish_valhalla_step: 'folder tutorial_remove_valhalla_journal,tutorial_remove_valhalla_step_tag,tutorial_start_jobs_step'
  tutorial_remove_valhalla_journal: 'journal delete tutorial_valhalla'
  tutorial_remove_valhalla_step_tag: 'tag delete tutorial_valhalla_step'

  # --------------------------------------------------------------------------
  # STEP 5 / CHAPTER V - Jobs
  # --------------------------------------------------------------------------
  tutorial_start_jobs_step: 'folder tutorial_add_jobs_step_tag,tutorial_add_jobs_journal,tutorial_jobs_title,tutorial_jobs_message_1,tutorial_schedule_jobs_message_2'
  tutorial_add_jobs_step_tag: 'tag add tutorial_jobs_step'
  tutorial_add_jobs_journal: 'journal add tutorial_jobs'
  tutorial_jobs_title: 'notify "&6Chapter V\n&dJobs" io:title fadeIn:0 stay:60 fadeOut:0'
  tutorial_jobs_message_1: 'notify "&6Jobs &8» &7A Job is your profession. Its progression is separate from ValhallaMMO and rewards you for doing the activities that belong to that profession." io:chat'
  tutorial_schedule_jobs_message_2: 'folder tutorial_jobs_message_2,tutorial_schedule_jobs_message_3 delay:4 conditions:tutorial_jobs_step_active'
  tutorial_jobs_message_2: 'notify "&6Jobs &8» &7Working in your profession grants Job experience and, depending on the activity, can also grant money and Job points. Higher Job levels unlock more profession-specific content." io:chat'
  tutorial_schedule_jobs_message_3: 'folder tutorial_jobs_message_3 delay:4 conditions:tutorial_jobs_step_active'
  tutorial_jobs_message_3: 'notify "&6Jobs &8» &7Active Jobs also receive daily quests. Open your inventory with &bE &7and click the &dJobs Quest menu &7in the top-right corner now." io:chat'

  # ItemJoin must call this action when the top-right Jobs Quest item is clicked.
  tutorial_jobs_menu_item_clicked: 'folder tutorial_complete_jobs_step conditions:tutorial_jobs_step_active'
  tutorial_complete_jobs_step: 'folder tutorial_remove_jobs_journal,tutorial_remove_jobs_step_tag,tutorial_add_to_elitemobs_step_tag,tutorial_jobs_completed_message,tutorial_schedule_elitemobs_start'
  tutorial_remove_jobs_journal: 'journal delete tutorial_jobs'
  tutorial_remove_jobs_step_tag: 'tag delete tutorial_jobs_step'
  tutorial_add_to_elitemobs_step_tag: 'tag add tutorial_to_elitemobs_step'
  tutorial_remove_to_elitemobs_step_tag: 'tag delete tutorial_to_elitemobs_step'
  tutorial_jobs_completed_message: 'notify "&6Quest Updated &8» &a✔ &7Jobs menu opened. Once you obtain a profession, return here often to check its daily objectives." io:chat'
  tutorial_schedule_elitemobs_start: 'folder tutorial_start_elitemobs_step delay:2 conditions:tutorial_to_elitemobs_step_active'

  # --------------------------------------------------------------------------
  # STEP 6 / CHAPTER VI - EliteMobs
  # --------------------------------------------------------------------------
  tutorial_start_elitemobs_step: 'folder tutorial_remove_to_elitemobs_step_tag,tutorial_add_elitemobs_step_tag,tutorial_add_elitemobs_journal,tutorial_elitemobs_title,tutorial_elitemobs_message_1,tutorial_schedule_elitemobs_message_2'
  tutorial_add_elitemobs_step_tag: 'tag add tutorial_elitemobs_step'
  tutorial_add_elitemobs_journal: 'journal add tutorial_elitemobs'
  tutorial_remove_elitemobs_journal: 'journal delete tutorial_elitemobs'
  tutorial_remove_elitemobs_step_tag: 'tag delete tutorial_elitemobs_step'
  tutorial_elitemobs_title: 'notify "&6Chapter VI\n&dEliteMobs" io:title fadeIn:0 stay:60 fadeOut:0'
  tutorial_elitemobs_message_1: 'notify "&6EliteMobs &8» &7The hostile creatures of Iek Corbar are not simple vanilla targets. EliteMobs can give familiar enemies stronger combat behavior and special powers." io:chat'
  tutorial_schedule_elitemobs_message_2: 'folder tutorial_elitemobs_message_2,tutorial_schedule_elitemobs_message_3 delay:4 conditions:tutorial_elitemobs_step_active'
  tutorial_elitemobs_message_2: 'notify "&6EliteMobs &8» &7Natural elites use player-aware scaled combat on this server. Their danger is balanced around the player, so simply travelling farther from spawn is not what makes them stronger; your equipment and build still matter." io:chat'
  tutorial_schedule_elitemobs_message_3: 'folder tutorial_elitemobs_message_3,tutorial_schedule_elitemobs_message_4 delay:4 conditions:tutorial_elitemobs_step_active'
  tutorial_elitemobs_message_3: 'notify "&6EliteMobs &8» &7Watch the nameplate, health display and powers before committing to a fight. A familiar creature may behave very differently from its vanilla version." io:chat'
  tutorial_schedule_elitemobs_message_4: 'folder tutorial_elitemobs_message_4,tutorial_schedule_elitemobs_message_5 delay:4 conditions:tutorial_elitemobs_step_active'
  tutorial_elitemobs_message_4: 'notify "&6EliteMobs &8» &7For scaled natural elites, &d「⚔」 &7marks the standard threat symbol while &c☠ &7warns of a higher-threat enemy. Dungeon and regional bosses use separate encounter balancing." io:chat'
  tutorial_schedule_elitemobs_message_5: 'folder tutorial_elitemobs_message_5,tutorial_schedule_expanded_systems_start delay:4 conditions:tutorial_elitemobs_step_active'
  tutorial_elitemobs_message_5: 'notify "&6EliteMobs &8» &7Observe first, then fight. Learning an enemy''s powers is often more important than attacking it as quickly as possible." io:chat'
  tutorial_schedule_expanded_systems_start: 'folder tutorial_start_expanded_systems delay:4 conditions:tutorial_elitemobs_step_active'

  # --------------------------------------------------------------------------
  # STEP 7 / CHAPTER VII - Expanded Gameplay Systems
  # --------------------------------------------------------------------------
  tutorial_start_expanded_systems: 'folder tutorial_remove_elitemobs_journal,tutorial_remove_elitemobs_step_tag,tutorial_add_expanded_systems_step_tag,tutorial_add_expanded_systems_journal,tutorial_expanded_systems_title,tutorial_expanded_intro,tutorial_schedule_fishing_1'
  tutorial_add_expanded_systems_step_tag: 'tag add tutorial_expanded_systems_step'
  tutorial_add_expanded_systems_journal: 'journal add tutorial_expanded_systems'
  tutorial_remove_expanded_systems_journal: 'journal delete tutorial_expanded_systems'
  tutorial_remove_expanded_systems_step_tag: 'tag delete tutorial_expanded_systems_step'
  tutorial_expanded_systems_title: 'notify "&6Chapter VII\n&dExpanded Gameplay Systems" io:title fadeIn:0 stay:60 fadeOut:0'
  tutorial_expanded_intro: 'notify "&6Tutorial &8» &7The systems you have learned so far are only the foundation. Many ordinary Minecraft activities have been expanded into complete progression systems on Iek Corbar." io:chat'

  # Custom Fishing
  tutorial_schedule_fishing_1: 'folder tutorial_fishing_1,tutorial_schedule_fishing_2 delay:4 conditions:tutorial_expanded_systems_step_active'
  tutorial_fishing_1: 'notify "&6Custom Fishing &8» &7Fishing has been redesigned around more than &d150 custom fish&7. Different biomes contain different species, so exploration is part of becoming a successful fisherman." io:chat'
  tutorial_schedule_fishing_2: 'folder tutorial_fishing_2,tutorial_schedule_fishing_3 delay:4 conditions:tutorial_expanded_systems_step_active'
  tutorial_fishing_2: 'notify "&6Custom Fishing &8» &7When a fish resists, the &dTug &7mechanic begins. Repeatedly interact with your fishing rod until the catch is secured. Stop for too long and the fish can escape." io:chat'
  tutorial_schedule_fishing_3: 'folder tutorial_fishing_3,tutorial_schedule_fishing_4 delay:4 conditions:tutorial_expanded_systems_step_active'
  tutorial_fishing_3: 'notify "&6Custom Fishing &8» &7Fish rarity also changes resistance: &dBronze 4–7&7, &dSilver 8–12&7, &dGold 13–18&7, &dDiamond 19–27&7, &dPlatinum 28–38&7, and &dMythical 40–55 Tugs&7." io:chat'
  tutorial_schedule_fishing_4: 'folder tutorial_fishing_4,tutorial_schedule_fishing_5 delay:4 conditions:tutorial_expanded_systems_step_active'
  tutorial_fishing_4: 'notify "&6Fish Monger &8» &7Open the &dE-menu &7to find the Fish Monger. He evaluates the custom fish in your inventory according to the fish and its &dweight&7, then lets you choose whether to sell it or keep it." io:chat'
  tutorial_schedule_fishing_5: 'folder tutorial_fishing_5,tutorial_schedule_agriculture_1 delay:4 conditions:tutorial_expanded_systems_step_active'
  tutorial_fishing_5: 'notify "&6Fishing Tournaments &8» &7Approximately every &d30 minutes&7, one of &d10 tournament formats &7starts automatically. Use &b/fttop &7to check the leaderboard. In &dGolden Fish&7, normal qualifying fish give 1 point and the selected Golden Fish gives &d10 points&7." io:chat'

  # Custom Agriculture
  tutorial_schedule_agriculture_1: 'folder tutorial_agriculture_1,tutorial_schedule_agriculture_2 delay:4 conditions:tutorial_expanded_systems_step_active'
  tutorial_agriculture_1: 'notify "&6Custom Agriculture &8» &7Farming also extends beyond vanilla crops. Iek Corbar includes Apple, Blueberry, Cherry, Cranberry, Grape, Lemon, Lime, Orange, Peach, Raspberry and Strawberry plants." io:chat'
  tutorial_schedule_agriculture_2: 'folder tutorial_agriculture_2,tutorial_schedule_brewing_1 delay:4 conditions:tutorial_expanded_systems_step_active'
  tutorial_agriculture_2: 'notify "&6Custom Agriculture &8» &7Different crops mature at different speeds: berries take about 5 minutes, Grapes about 7, Cherry/Lemon/Lime about 15, while Apple/Orange/Peach take roughly one Minecraft day." io:chat'

  # Brewing
  tutorial_schedule_brewing_1: 'folder tutorial_brewing_1,tutorial_schedule_brewing_2 delay:4 conditions:tutorial_expanded_systems_step_active'
  tutorial_brewing_1: 'notify "&6Brewing &8» &7Brewing is more than a vanilla Brewing Stand. Drinks can depend on the ingredients, quantities, heat and brewing time. A typical brew begins in a water-filled cauldron over a valid heat source." io:chat'
  tutorial_schedule_brewing_2: 'folder tutorial_brewing_2,tutorial_schedule_pyromining_1 delay:4 conditions:tutorial_expanded_systems_step_active'
  tutorial_brewing_2: 'notify "&6Brewing &8» &7Some recipes can also be aged in barrels. Wood type and aging time may affect the result, and aging for too long can spoil a drink. One brewing year corresponds to one Minecraft day." io:chat'

  # Advanced Mining / PyroMining
  tutorial_schedule_pyromining_1: 'folder tutorial_pyromining_1,tutorial_schedule_pyromining_2 delay:4 conditions:tutorial_expanded_systems_step_active'
  tutorial_pyromining_1: 'notify "&6Advanced Mining &8» &7Mining has another progression layer beyond Jobs and your character skills. You can discover &dFluxes, Gemstones, Mysterious Dust &7and other resources that do not exist in vanilla Minecraft." io:chat'
  tutorial_schedule_pyromining_2: 'folder tutorial_pyromining_2,tutorial_schedule_pyromining_3 delay:4 conditions:tutorial_expanded_systems_step_active'
  tutorial_pyromining_2: 'notify "&6Advanced Mining &8» &7This mining system has its own currency, &dZeta&7, together with Mining Levels and a dedicated Skill Tree. These progress separately from both Valhalla and your Miner Job." io:chat'
  tutorial_schedule_pyromining_3: 'folder tutorial_pyromining_3,tutorial_schedule_pyromining_4 delay:4 conditions:tutorial_expanded_systems_step_active'
  tutorial_pyromining_3: 'notify "&6Advanced Mining &8» &7Mysterious Dust can be processed through the &dRefinery&7. Rune Dust can lead to Rune Guardians and Runes, connecting ordinary mining to special combat encounters and deeper progression." io:chat'
  tutorial_schedule_pyromining_4: 'folder tutorial_pyromining_4,tutorial_schedule_techcore_1 delay:4 conditions:tutorial_expanded_systems_step_active'
  tutorial_pyromining_4: 'notify "&6Advanced Mining &8» &7Rare Artifacts can lead toward Fossils and &dVessels&7, while the far end of the system contains dangerous &dOracles&7. You do not need to learn all of this now: begin by mining normally and investigate unfamiliar discoveries as they appear." io:chat'

  # TechCore
  tutorial_schedule_techcore_1: 'folder tutorial_techcore_1,tutorial_schedule_techcore_2 delay:4 conditions:tutorial_expanded_systems_step_active'
  tutorial_techcore_1: 'notify "&6TechCore &8» &7Iek Corbar also has an original industrial system built specifically for the server. TechCore lets you construct machines, production lines and automated factories." io:chat'
  tutorial_schedule_techcore_2: 'folder tutorial_techcore_2,tutorial_schedule_expanded_finish delay:4 conditions:tutorial_expanded_systems_step_active'
  tutorial_techcore_2: 'notify "&6TechCore &8» &7Industrial progression eventually moves you from manual work to automation. Its machines, energy and transport networks have their own dedicated progression, so they will be explained in a separate guide." io:chat'

  tutorial_schedule_expanded_finish: 'folder tutorial_finish_expanded_systems delay:4 conditions:tutorial_expanded_systems_step_active'
  tutorial_finish_expanded_systems: 'folder tutorial_remove_expanded_systems_journal,tutorial_expanded_finish_message,tutorial_schedule_race_selection_start'
  tutorial_expanded_finish_message: 'notify "&6Tutorial &8» &7Fishing, farming, brewing, mining and industry all have systems beyond vanilla Minecraft. When you find an unfamiliar fish, fruit, mineral, artifact or machine component, assume it may be the beginning of a new progression path." io:chat'
  tutorial_schedule_race_selection_start: 'folder tutorial_start_race_selection delay:4 conditions:tutorial_expanded_systems_step_active'

  # --------------------------------------------------------------------------
  # RACE SELECTION - prerequisite before Chapters VIII-X
  # --------------------------------------------------------------------------
  tutorial_start_race_selection: 'folder tutorial_remove_expanded_systems_step_tag,tutorial_add_race_step_tag,tutorial_add_race_journal,tutorial_race_title,tutorial_race_instruction_message'
  tutorial_add_race_step_tag: 'tag add tutorial_race_step'
  tutorial_remove_race_step_tag: 'tag delete tutorial_race_step'
  tutorial_add_race_journal: 'journal add tutorial_choose_race'
  tutorial_remove_race_journal: 'journal delete tutorial_choose_race'
  tutorial_race_title: 'notify "&6Character Creation\n&dChoose Your Race" io:title fadeIn:0 stay:60 fadeOut:0'
  tutorial_race_instruction_message: 'notify "&6Tutorial &8» &7Before choosing your specializations, speak with the &bRace Assignor &7and choose the race your character will belong to. Read each race carefully before confirming your choice." io:chat'

  # Each race uses the ValhallaRaces command directly; the BQ tag records tutorial progression.
  tutorial_confirm_gearborn: 'folder tutorial_command_choose_gearborn,tutorial_add_choosed_race_tag,tutorial_schedule_race_selection_finish conditions:tutorial_can_choose_race'
  tutorial_confirm_cinderbeard: 'folder tutorial_command_choose_cinderbeard,tutorial_add_choosed_race_tag,tutorial_schedule_race_selection_finish conditions:tutorial_can_choose_race'
  tutorial_confirm_clockmoth: 'folder tutorial_command_choose_clockmoth,tutorial_add_choosed_race_tag,tutorial_schedule_race_selection_finish conditions:tutorial_can_choose_race'
  tutorial_confirm_rustborn: 'folder tutorial_command_choose_rustborn,tutorial_add_choosed_race_tag,tutorial_schedule_race_selection_finish conditions:tutorial_can_choose_race'

  tutorial_command_choose_gearborn: 'command valhallaraces:races set race %player% gearborn'
  tutorial_command_choose_cinderbeard: 'command valhallaraces:races set race %player% cinderbeard'
  tutorial_command_choose_clockmoth: 'command valhallaraces:races set race %player% clockmoth'
  tutorial_command_choose_rustborn: 'command valhallaraces:races set race %player% rustborn'
  tutorial_add_choosed_race_tag: 'tag add Choosed_race'

  # Delayed because these messages happen after the NPC conversation closes.
  tutorial_schedule_race_selection_finish: 'folder tutorial_finish_race_selection delay:2 conditions:tutorial_race_chosen'
  tutorial_finish_race_selection: 'folder tutorial_remove_race_journal,tutorial_remove_race_step_tag,tutorial_race_selected_message,tutorial_start_class_selection'
  tutorial_race_selected_message: 'notify "&6Quest Updated &8» &a✔ &7Your race has been chosen. Now speak with the &bClass Assignor &7to define your starting specializations." io:chat'

  # --------------------------------------------------------------------------
  # STEP 8 / CHAPTER VIII - Primary Class
  # NPC 128 - Class Assignor
  # --------------------------------------------------------------------------
  tutorial_start_class_selection: 'folder tutorial_add_class_step_tag,tutorial_add_class_journal,tutorial_class_title,tutorial_class_instruction_message'
  tutorial_add_class_step_tag: 'tag add tutorial_class_step'
  tutorial_remove_class_step_tag: 'tag delete tutorial_class_step'
  tutorial_add_class_journal: 'journal add tutorial_choose_class'
  tutorial_remove_class_journal: 'journal delete tutorial_choose_class'
  tutorial_class_title: 'notify "&6Chapter VIII\n&dPrimary Class" io:title fadeIn:0 stay:60 fadeOut:0'
  tutorial_class_instruction_message: 'notify "&6Tutorial &8» &7After selecting your race, speak with the &bClass Assignor &7and choose your main combat specialization." io:chat'

  tutorial_confirm_warrior: 'folder tutorial_command_choose_warrior,tutorial_add_choosed_class_tag,tutorial_schedule_class_selection_finish conditions:tutorial_can_choose_class'
  tutorial_confirm_barbarian: 'folder tutorial_command_choose_barbarian,tutorial_add_choosed_class_tag,tutorial_schedule_class_selection_finish conditions:tutorial_can_choose_class'
  tutorial_confirm_ranger: 'folder tutorial_command_choose_ranger,tutorial_add_choosed_class_tag,tutorial_schedule_class_selection_finish conditions:tutorial_can_choose_class'
  tutorial_command_choose_warrior: 'command valhallaraces:races set class %player% warrior'
  tutorial_command_choose_barbarian: 'command valhallaraces:races set class %player% barbarian'
  tutorial_command_choose_ranger: 'command valhallaraces:races set class %player% ranger'
  tutorial_add_choosed_class_tag: 'tag add Choosed_class'
  tutorial_schedule_class_selection_finish: 'folder tutorial_finish_class_selection delay:2 conditions:tutorial_class_chosen'
  tutorial_finish_class_selection: 'folder tutorial_remove_class_journal,tutorial_remove_class_step_tag,tutorial_class_selected_message,tutorial_start_specialization_selection'
  tutorial_class_selected_message: 'notify "&6Quest Updated &8» &a✔ &7Your primary combat class has been chosen. Return to the &bClass Assignor &7for your production specialization." io:chat'

  # --------------------------------------------------------------------------
  # STEP 9 / CHAPTER IX - Production Specialization
  # NPC 128 - Class Assignor
  # --------------------------------------------------------------------------
  tutorial_start_specialization_selection: 'folder tutorial_add_specialization_step_tag,tutorial_add_specialization_journal,tutorial_specialization_title,tutorial_specialization_instruction_message'
