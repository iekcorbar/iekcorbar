        conditions: rodmerchant_q10_active,!rodmerchant_q10_has_items
        pointers: pl_end_conversation
      rodmerchant_turnin_q11_ready:
        text: Perch in excellent condition. Calm waters teach patience.
        conditions: rodmerchant_q11_active,rodmerchant_q11_has_items
        actions: rodmerchant_q11_complete
        pointers: pl_end_conversation
      rodmerchant_turnin_q11_missing:
        text: Not enough. I asked you for 5 Perch. You can fish them in River, Plains,
          Forest, Birch Forest, Flower Forest, Meadow, or Sunflower Plains.
        conditions: rodmerchant_q11_active,!rodmerchant_q11_has_items
        pointers: pl_end_conversation
      rodmerchant_turnin_q12_ready:
        text: Perfect Greengill. Swamps reward those who know how to wait.
        conditions: rodmerchant_q12_active,rodmerchant_q12_has_items
        actions: rodmerchant_q12_complete
        pointers: pl_end_conversation
      rodmerchant_turnin_q12_missing:
        text: Not enough. I asked you for 4 Greengill. You can fish them in Swamp
          or Mangrove Swamp.
        conditions: rodmerchant_q12_active,!rodmerchant_q12_has_items
        pointers: pl_end_conversation
      rodmerchant_about:
        text: I build and sell fishing rods. Not simple sticks with string, but instruments
          for reading the water. \n\nA good rod feels the current, holds the weight,
          and forgives a mistake only if the fisher learns quickly. \n\nIf you truly
          want to fish, you must respect water, time, and silence.
        pointers: pl_more_story,pl_end_conversation
      rodmerchant_story_1:
        text: Once, I fished for three hours without catching anything. Then I realized
          the fish was watching me.
        conditions: rodmerchant_current_story_1
        actions: rodmerchant_story_1_mark_heard,rodmerchant_story_clear_selection
        pointers: pl_end_conversation
      rodmerchant_story_2:
        text: A rod that is too stiff breaks. One that is too soft cannot command
          the line. The same is true for people.
        conditions: rodmerchant_current_story_2
        actions: rodmerchant_story_2_mark_heard,rodmerchant_story_clear_selection
        pointers: pl_end_conversation
      rodmerchant_story_3:
        text: The best hook I ever sold came back with a sea monster tooth still attached.
        conditions: rodmerchant_current_story_3
        actions: rodmerchant_story_3_mark_heard,rodmerchant_story_clear_selection
        pointers: pl_end_conversation
      rodmerchant_story_4:
        text: A customer wanted a golden rod. I sold him patience and good line. He
          caught more fish than the noble beside him.
        conditions: rodmerchant_current_story_4
        actions: rodmerchant_story_4_mark_heard,rodmerchant_story_clear_selection
        pointers: pl_end_conversation
      rodmerchant_story_5:
        text: 'When the water is calm, do not trust it: it often means something is
          moving underneath.'
        conditions: rodmerchant_current_story_5
        actions: rodmerchant_story_5_mark_heard,rodmerchant_story_clear_selection
        pointers: pl_end_conversation
      rodmerchant_story_6:
        text: Noisy reels scare small fish. Silent ones attract big trouble.
        conditions: rodmerchant_current_story_6
        actions: rodmerchant_story_6_mark_heard,rodmerchant_story_clear_selection
        pointers: pl_end_conversation
      rodmerchant_story_7:
        text: I once saw a line cut an apprentice's fingers. Since then, I teach the
          knot before the fishing.
        conditions: rodmerchant_current_story_7
        actions: rodmerchant_story_7_mark_heard,rodmerchant_story_clear_selection
        pointers: pl_end_conversation
      rodmerchant_story_8:
        text: Legendary rods are not born legendary. They become legendary when the
          fisher refuses to give up.
        conditions: rodmerchant_current_story_8
        actions: rodmerchant_story_8_mark_heard,rodmerchant_story_clear_selection
        pointers: pl_end_conversation
      rodmerchant_accept:
        text: Good. Let us see what I need today.
