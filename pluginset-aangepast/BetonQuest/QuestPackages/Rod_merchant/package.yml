conversations:
  rodmerchant_conv:
    quester: Fishing Rod Merchant
    first: rodmerchant_start_close,rodmerchant_start_friendly,rodmerchant_start
    stop: true
    NPC_options:
      rodmerchant_start_close:
        text: Ah, my favorite fisher. The best rods are not sold to the impatient,
          but to those who know how to wait for the right bite. \n\nDo you want to
          buy, work, or hear a water tale?
        conditions: rodmerchant_friendship_61
        pointers: pl_open_shop_2,pl_talk_little,pl_about_rodmerchant,pl_just_hi
      rodmerchant_start_friendly:
        text: Welcome back. I just finished checking hooks, lines, and reels. \n\nTell
          me what you need.
        conditions: rodmerchant_friendship_31,!rodmerchant_friendship_61
        pointers: pl_open_shop_1,pl_talk_little,pl_about_rodmerchant,pl_just_hi
      rodmerchant_start:
        text: Welcome. I sell fishing rods, reinforced lines, and a few tools for
          those who are not afraid to wait by the water.
        conditions: '!rodmerchant_friendship_31'
        pointers: pl_open_shop,pl_talk_little,pl_about_rodmerchant,pl_just_hi
      rodmerchant_shop:
        text: Of course. I will open the rod counter for you.
        actions: rodmerchant_open_shop
        pointers: pl_end_conversation
      rodmerchant_shop_1:
        text: Of course. I will open the rod counter for you.
        actions: rodmerchant_open_shop_1
        pointers: pl_end_conversation
      rodmerchant_shop_2:
        text: Of course. I will open the reserved shelf for you.
        actions: rodmerchant_open_shop_2
        pointers: pl_end_conversation
      rodmerchant_talk_available:
        text: I need common fish to test rods, hooks, and lines. Every fish tells
          me something about a different biome. \n\nWill you accept a contract?
        conditions: '!rodmerchant_daily_cooldown_v2,!rodmerchant_has_active_quest_v2'
        pointers: pl_accept_random_quest,pl_refuse_random_quest
      rodmerchant_talk_cooldown:
        text: 'We have already done business recently. Come back later: even a good
          rod needs rest.'
        conditions: rodmerchant_daily_cooldown_v2,!rodmerchant_has_active_quest_v2
        pointers: pl_end_conversation
      rodmerchant_talk_active:
        text: You already have one of my contracts open. Bring the requested fish
          and we will settle the account.
        conditions: rodmerchant_has_active_quest_v2
        pointers: pl_turn_in_materials,pl_end_conversation
      rodmerchant_turnin_q1_ready:
        text: Excellent Tuna. Their meat says a lot about the current.
        conditions: rodmerchant_q1_active,rodmerchant_q1_has_items
        actions: rodmerchant_q1_complete
        pointers: pl_end_conversation
      rodmerchant_turnin_q1_missing:
        text: Not enough. I asked you for 4 Tuna. You can fish them in Ocean, Deep
          Ocean, Beach, or Stony Shore.
        conditions: rodmerchant_q1_active,!rodmerchant_q1_has_items
        pointers: pl_end_conversation
      rodmerchant_turnin_q2_ready:
        text: Fresh Shrimp. Perfect for testing small hooks and light lines.
        conditions: rodmerchant_q2_active,rodmerchant_q2_has_items
        actions: rodmerchant_q2_complete
        pointers: pl_end_conversation
      rodmerchant_turnin_q2_missing:
        text: Not enough. I asked you for 6 Shrimp. You can fish them in Ocean, Deep
          Ocean, Beach, or Stony Shore.
        conditions: rodmerchant_q2_active,!rodmerchant_q2_has_items
        pointers: pl_end_conversation
      rodmerchant_turnin_q3_ready:
        text: Beautiful Angelfish. Warm water and a careful hand, I see.
        conditions: rodmerchant_q3_active,rodmerchant_q3_has_items
        actions: rodmerchant_q3_complete
        pointers: pl_end_conversation
      rodmerchant_turnin_q3_missing:
        text: Not enough. I asked you for 3 Angelfish. You can fish them in Warm Ocean,
          Lukewarm Ocean, or Deep Lukewarm Ocean.
        conditions: rodmerchant_q3_active,!rodmerchant_q3_has_items
        pointers: pl_end_conversation
      rodmerchant_turnin_q4_ready:
        text: Sturdy Catfish. These help me calibrate river rods.
        conditions: rodmerchant_q4_active,rodmerchant_q4_has_items
        actions: rodmerchant_q4_complete
        pointers: pl_end_conversation
      rodmerchant_turnin_q4_missing:
        text: Not enough. I asked you for 4 Catfish. You can fish them in River, Plains,
          Forest, Birch Forest, Flower Forest, Meadow, or Sunflower Plains.
        conditions: rodmerchant_q4_active,!rodmerchant_q4_has_items
        pointers: pl_end_conversation
      rodmerchant_turnin_q5_ready:
        text: Fine Pike. If these do not snap the line, nothing will.
        conditions: rodmerchant_q5_active,rodmerchant_q5_has_items
        actions: rodmerchant_q5_complete
        pointers: pl_end_conversation
      rodmerchant_turnin_q5_missing:
