  shinobi_conv:
    quester: Jiraya
    first: shinobi_assign_initial,shinobi_assign_from_weaponsmith,shinobi_assign_from_armorsmith,shinobi_redirect_initial_weaponsmith,shinobi_redirect_initial_armorsmith,shinobi_redirect_change_weaponsmith,shinobi_redirect_change_armorsmith,shinobi_default1,shinobi_default2,shinobi_default3,shinobi_default4
    stop: true
    
    NPC_options:
      shinobi_assign_initial:
        text: |-
          &7You do not hear him arrive.

          When you turn… he is already there, sitting casually.

          &f"Yo."

          A grin.

          "So… you made the jump."

          "Most do not."

          "They think too much."

          "Or not enough."

          He stands up slowly.

          "Let me guess…"

          "You want power?"

          "Speed?"

          "Control?"

          He shrugs.

          "Wrong questions."

          "A Shinobi doesn’t chase strength."

          "He controls the moment."

          "Appears when needed…"

          "Disappears when not."

          "Wins before the fight even begins."

          He looks at you, more serious now.

          "From now on… you walk the Shinobi path."

          "Try to keep up."
        conditions: jr5_quest_available,!jr5_citizen_registered,chose_shinobi
        actions: become_shinobi
        pointers: pl_end_conversation_jr5
      
      shinobi_assign_from_weaponsmith:
        text: |-
          &7He watches you approach… like he already knew you would.

          &f"Ah… the loud type."

          "Swing first, think later."

          A small chuckle.

          "That works… until it doesn’t."

          "A Shinobi doesn’t win by force."

          "He wins by choosing when the fight happens."

          "Or if it happens at all."

          He steps closer.

          "If you stay… you’ll learn something dangerous."

          "How to end things… without being seen."
        conditions: jr5_quest_available,jr5_citizen_registered,is_weaponsmith,change_to_shinobi
        actions: switch_shinobi_from_weaponsmith
        pointers: pl_end_conversation_jr5
      
      shinobi_assign_from_armorsmith:
        text: |-
          &7He circles around you slowly.

          &f"Solid."

          "Steady."

          "You take the hit and keep standing."

          He nods.

          "Respectable."

          "But here’s the thing…"

          "If you never get hit… you don’t need armor."

          A grin.

          "A Shinobi doesn’t endure."

          "He avoids."

          "He redirects."

          "He’s gone before the strike lands."

          "If you stay… you’ll learn to stop being a target."
        conditions: jr5_quest_available,jr5_citizen_registered,is_armorsmith,change_to_shinobi
        actions: switch_shinobi_from_armorsmith
        pointers: pl_end_conversation_jr5
      
      shinobi_redirect_initial_weaponsmith:
        text: |-
          &7He doesn’t even look at you.

          &f"Too loud."

          "Too obvious."

          "You’re not ready for this."

          "Go break something instead."
        conditions: jr5_quest_available,!jr5_citizen_registered,chose_weaponsmith
        pointers: pl_end_conversation_jr5
      
      shinobi_redirect_initial_armorsmith:
        text: |-
          &7He sighs softly.

          &f"You stand there waiting to be hit…"

          "That’s not how this works."

          "Wrong path."

          "Go."
        conditions: jr5_quest_available,!jr5_citizen_registered,chose_armorsmith
        pointers: pl_end_conversation_jr5
      
      shinobi_redirect_change_weaponsmith:
        text: |-
          &7He smirks.

          &f"Back to smashing things?"

          "Try not to miss this time."

          "Go."
        conditions: jr5_quest_available,jr5_citizen_registered,change_to_weaponsmith
        pointers: pl_end_conversation_jr5
      
      shinobi_redirect_change_armorsmith:
        text: |-
          &7He shrugs.

          &f"Back to standing still and taking hits?"

          "Not my style… but hey."

          "Go."
        conditions: jr5_quest_available,jr5_citizen_registered,change_to_armorsmith
        pointers: pl_end_conversation_jr5
      
      shinobi_default1:
        text: |-
          &f"If they see you…"

          "You’re already late."
        conditions: shinobi_rand_1
        pointers: pl_end_conversation_jr5
      
      shinobi_default2:
        text: |-
          &f"Speed isn’t about moving fast."

          "It’s about moving at the right time."
        conditions: '!shinobi_rand_1,shinobi_rand_2'
        pointers: pl_end_conversation_jr5
      
      shinobi_default3:
        text: |-
          &f"The best fight…"

          "Is the one that never starts."
        conditions: '!shinobi_rand_1,!shinobi_rand_2,shinobi_rand_3'
        pointers: pl_end_conversation_jr5
      
      shinobi_default4:
        text: |-
          &f"You’re still thinking too much."

          "Relax."
        conditions: '!shinobi_rand_1,!shinobi_rand_2,!shinobi_rand_3'
        pointers: pl_end_conversation_jr5
    
    player_options:
      pl_end_conversation_jr5:
        text: End conversation
  
  armorsmith_conv:
    quester: armorsmith Master
    first: armorsmith_assign_initial,armorsmith_assign_from_weaponsmith,armorsmith_assign_from_shinobi,armorsmith_redirect_initial_weaponsmith,armorsmith_redirect_initial_shinobi,armorsmith_redirect_change_weaponsmith,armorsmith_redirect_change_shinobi,armorsmith_default1,armorsmith_default2,armorsmith_default3,armorsmith_default4
    stop: true
    
    NPC_options:
      armorsmith_assign_initial:
        text: |-
          &7The armorsmith stands before an anvil, holding a plate of dark metal.

          A heavy hammer falls.

          The metal bends… but does not break.

          &f"Good."

          He strikes again.

          "Still standing."

          He turns to you.

          "You are here to learn endurance."

          "Not comfort."

          "Not safety."

          "Armor is not meant to avoid the strike."

          "It is meant to survive it."

          "Every plate must carry pressure."

          "Every joint must accept force."

          "Every weakness becomes death."

          "From now on… you forge armor."

          "Learn to withstand what others fear."
        conditions: jr5_quest_available,!jr5_citizen_registered,chose_armorsmith
        actions: become_armorsmith
        pointers: pl_end_conversation_jr5
      
      armorsmith_assign_from_weaponsmith:
        text: |-
          &7The armorsmith looks at your hands.

          &f"You know how to strike."

          "Good."

          "Then you know what armor must survive."

          "A weapon asks one question."

          "Can it break?"

          "Armor answers."

          "No."

          "Here, you will stop chasing impact."

          "You will learn resistance."

          "If you stay… you will understand strength that does not need to move."
        conditions: jr5_quest_available,jr5_citizen_registered,is_weaponsmith,change_to_armorsmith
        actions: switch_armorsmith_from_weaponsmith
        pointers: pl_end_conversation_jr5
      
      armorsmith_assign_from_shinobi:
        text: |-
          &7The armorsmith studies you in silence.

          &f"You learned to avoid the strike."

          "Useful."

          "But avoidance is not endurance."

          "A shadow survives by not being touched."

          "Armor survives by being struck."

          "Here, you will not disappear."

          "You will stand."

          "You will receive the force."

          "And remain."
        conditions: jr5_quest_available,jr5_citizen_registered,is_shinobi,change_to_armorsmith
        actions: switch_armorsmith_from_shinobi
        pointers: pl_end_conversation_jr5
      
      armorsmith_redirect_initial_weaponsmith:
        text: |-
          &7The armorsmith does not look up.

          &f"You chose the blade."

          "Then go learn how to strike."

          "This forge teaches how to endure."
        conditions: jr5_quest_available,!jr5_citizen_registered,chose_weaponsmith
        pointers: pl_end_conversation_jr5
      
      armorsmith_redirect_initial_shinobi:
        text: |-
          &7The armorsmith lifts a heavy plate of metal.

          &f"You chose the shadow."

          "Then stop standing before the anvil."

          "This path is for those who do not vanish."
        conditions: jr5_quest_available,!jr5_citizen_registered,chose_shinobi
        pointers: pl_end_conversation_jr5
      
      armorsmith_redirect_change_weaponsmith:
        text: |-
          &7The armorsmith lowers his hammer.

          &f"Back to the blade."

          "Then stop thinking like a shield."

          "Go."
        conditions: jr5_quest_available,jr5_citizen_registered,change_to_weaponsmith
        pointers: pl_end_conversation_jr5
      
      armorsmith_redirect_change_shinobi:
        text: |-
          &7The armorsmith watches you calmly.

          &f"Back to the shadows."

          "Then leave the weight behind."

          "Go."
        conditions: jr5_quest_available,jr5_citizen_registered,change_to_shinobi
        pointers: pl_end_conversation_jr5
      
      armorsmith_default1:
        text: |-
          &f"Armor does not ask the strike to be gentle."

          "It prepares for it."
        conditions: armorsmith_rand_1
        pointers: pl_end_conversation_jr5
      
      armorsmith_default2:
        text: |-
          &f"If it bends and holds…"

          "It is stronger than what refuses to bend."
        conditions: '!armorsmith_rand_1,armorsmith_rand_2'
        pointers: pl_end_conversation_jr5
      
      armorsmith_default3:
        text: '&f"A weak joint kills faster than a weak plate."'
        conditions: '!armorsmith_rand_1,!armorsmith_rand_2,armorsmith_rand_3'
        pointers: pl_end_conversation_jr5
      
      armorsmith_default4:
        text: |-
          &f"Strength is not standing untouched."

          "Strength is standing after impact."
        conditions: '!armorsmith_rand_1,!armorsmith_rand_2,!armorsmith_rand_3'
        pointers: pl_end_conversation_jr5
    
    player_options:
      pl_end_conversation_jr5:
        text: End conversation
