conversations:
  elias_backpack_conv:
    quester: Elias Packwright
    first: elias_bp3_repeat_active,elias_bp3_completed_menu,elias_bp3_offer,elias_bp2_questions_5,elias_bp2_questions_4,elias_bp2_questions_3,elias_bp2_questions_2,elias_bp2_questions_1,elias_bp2_reward_repeat,elias_bp2_reward,elias_bp2_trial3_knowledge_ready,elias_bp2_trial3_strength_ready,elias_bp2_trial3_hope_ready,elias_bp2_trial3_knowledge,elias_bp2_trial3_strength,elias_bp2_trial3_hope,elias_bp2_trial2_prepared_ready,elias_bp2_trial2_teamwork_ready,elias_bp2_trial2_prepared,elias_bp2_trial2_instinct,elias_bp2_trial2_teamwork,elias_bp2_trial1_explorer,elias_bp2_trial1_wealth,elias_bp2_trial1_courage,elias_bp2_completed_menu,elias_bp2_offer,elias_questions_3,elias_questions_2,elias_questions_1,elias_final_ready_repeat,elias_final_ready_first,elias_final_missing,elias_after_combat,elias_combat_status,elias_after_frame,elias_after_canvas,elias_after_explore,elias_explore_status,elias_repeat_start,elias_start
    stop: true
    NPC_options:
      elias_bp3_offer:
        text: You have mastered both backpack trials. I cannot craft the final backpack,
          but I can tell you how to seek it. You may also repeat either of your previous
          journeys. What would you like to do?
        conditions: bp2_finished,!bp3_started,!bp3_finished,!bp_started,!bp2_started
        pointers: pl_bp3_accept,pl_bp2_repeat,pl_repeat,pl_decline
      elias_bp3_explanation:
        text: Long ago, the underground passages beneath the city were built as a
          secure bunker. Over time, terrible creatures claimed them, and now only
          the finest adventurers descend there in search of forgotten treasure. Somewhere
          inside is an adventurer named Orion. I do not know where he is, but he is
          the only one who can grant you the final backpack. The entrance is beneath
          the city. Arm yourself and prepare carefully before you descend. Is everything
          clear?
        pointers: pl_bp3_clear
      elias_bp3_completed_menu:
        text: You have completed every backpack journey. Orion can grant another Level
          3 Backpack, or you may repeat either of your earlier quests. What would
          you like to do?
        conditions: bp3_finished,!bp3_repeat_started,!bp_started,!bp2_started
        pointers: pl_bp3_repeat,pl_bp2_repeat,pl_repeat,pl_decline
      elias_bp3_repeat_active:
        text: Orion is waiting beneath the city. Speak with him to learn his request,
          or return with the materials he already named.
        conditions: bp3_finished,bp3_repeat_started
        pointers: pl_end
      elias_bp2_offer:
        text: You have already earned your first backpack. What would you like to
          do next?
        conditions: bp_finished,!bp_started,!bp2_started,!bp2_finished
        pointers: pl_bp2_accept,pl_repeat,pl_decline
      elias_bp2_completed_menu:
        text: You have mastered both backpack trials. Which journey would you like
          to repeat?
        conditions: bp_finished,bp2_finished,!bp_started,!bp2_started
        pointers: pl_bp2_repeat,pl_repeat,pl_decline
      elias_bp2_trial1_explorer:
        text: You called yourself an explorer. Travel to the Ancient Castle near X
          -792, Y 65, Z -501. Reach its lower tower, upper hall, and summit. The height
          of each destination matters.
        conditions: bp2_started,bp2_trial1_phase,bp_path_explorer
        pointers: pl_end
      elias_bp2_trial1_wealth:
        text: You said you seek treasure and riches. Travel to the Ancient Castle
          near X -792, Y 65, Z -501. Find the empty chest at X -791, Y 119, Z -595
          and open it.
        conditions: bp2_started,bp2_trial1_phase,bp_path_wealth,!bp2_has_wealth_items
        pointers: pl_end
      elias_bp2_trial1_wealth_ready:
        text: You found the hidden chest. The treasure was not its contents, but your
          ability to reach it. Your second trial can now begin.
        conditions: bp2_started,bp2_trial1_phase,bp_path_wealth,bp2_has_wealth_items,!bp2_started
        pointers: pl_end
      elias_bp2_trial1_courage:
        text: You chose the path of battle. Travel to the Ancient Castle and defeat
          a Warden while you are inside the castle region.
        conditions: bp2_started,bp2_trial1_phase,bp_path_courage
        pointers: pl_end
      elias_bp2_trial2_prepared:
        text: You believe preparation keeps you alive. Bring me 32 Iron Ingots, 32
          String and 2 Chests.
        conditions: bp2_started,bp2_trial2_phase,bp_mind_prepared,!bp2_has_prepared_items
        pointers: pl_end
      elias_bp2_trial2_prepared_ready:
        text: Every item has a purpose and every risk has been considered. Hand me
          the supplies and face your final trial.
        conditions: bp2_started,bp2_trial2_phase,bp_mind_prepared,bp2_has_prepared_items
        pointers: pl_bp2_prepared_done,pl_end
      elias_bp2_trial2_instinct:
        text: You trust your instincts. Defeat 8 Endermen and 12 Cave Spiders, enemies
          that punish slow decisions.
        conditions: bp2_started,bp2_trial2_phase,bp_mind_instinct
        pointers: pl_end
      elias_bp2_trial2_teamwork:
        text: You rely on companions. Bring 32 Bread and 4 Golden Apples, enough to
          keep a small group standing.
        conditions: bp2_started,bp2_trial2_phase,bp_mind_teamwork,!bp2_has_teamwork_items
        pointers: pl_end
      elias_bp2_trial2_teamwork_ready:
        text: These supplies could save more than one traveller. Leave them with me
          and begin the last trial.
        conditions: bp2_started,bp2_trial2_phase,bp_mind_teamwork,bp2_has_teamwork_items
        pointers: pl_bp2_teamwork_done,pl_end
      elias_bp2_trial3_knowledge:
        text: You named knowledge as true power. Bring me 24 Books and 16 Amethyst
          Shards.
        conditions: bp2_started,bp2_trial3_phase,bp_power_knowledge,!bp2_has_knowledge_items
        pointers: pl_end
      elias_bp2_trial3_knowledge_ready:
        text: Knowledge recorded and memory made solid. Give me the materials and
          I will finish your backpack.
        conditions: bp2_started,bp2_trial3_phase,bp_power_knowledge,bp2_has_knowledge_items
        pointers: pl_bp2_knowledge_done,pl_end
      elias_bp2_trial3_strength:
        text: You named strength as true power. Bring me 16 Obsidian and 32 Iron Ingots.
        conditions: bp2_started,bp2_trial3_phase,bp_power_strength,!bp2_has_strength_items
        pointers: pl_end
      elias_bp2_trial3_strength_ready:
        text: These materials will not bend easily. Give them to me and I will finish
          your backpack.
        conditions: bp2_started,bp2_trial3_phase,bp_power_strength,bp2_has_strength_items
        pointers: pl_bp2_strength_done,pl_end
      elias_bp2_trial3_hope:
        text: You named hope as true power. Bring me 32 Glowstone Dust and 2 Ghast
          Tears, light taken from a hostile place.
        conditions: bp2_started,bp2_trial3_phase,bp_power_hope,!bp2_has_hope_items
        pointers: pl_end
      elias_bp2_trial3_hope_ready:
        text: Even here, you found light. Give me the materials and I will finish
          your backpack.
        conditions: bp2_started,bp2_trial3_phase,bp_power_hope,bp2_has_hope_items
        pointers: pl_bp2_hope_done,pl_end
      elias_bp2_questions_1:
        text: Your trials are complete, but I want to understand the person who will
          carry this backpack. When duty conflicts with mercy, which guides you?
        conditions: bp2_started,bp2_questions_phase,!bp2_q4_duty,!bp2_q4_compassion,!bp2_q4_freedom
        pointers: pl_bp2_q4_duty,pl_bp2_q4_compassion,pl_bp2_q4_freedom
      elias_bp2_questions_2:
        text: You discover an ancient artifact that could change many lives. What
          should be done with it?
        conditions: bp2_started,bp2_questions_phase,bp2_q4_1_done,!bp2_q5_preserve,!bp2_q5_use,!bp2_q5_destroy
        pointers: pl_bp2_q5_preserve,pl_bp2_q5_use,pl_bp2_q5_destroy
      elias_bp2_questions_3:
        text: When a group loses its way, what role do you take?
        conditions: bp2_started,bp2_questions_phase,bp2_q4_1_done,bp2_q4_2_done,!bp2_q6_lead,!bp2_q6_support,!bp2_q6_alone
        pointers: pl_bp2_q6_lead,pl_bp2_q6_support,pl_bp2_q6_alone
      elias_bp2_questions_4:
        text: When your carefully chosen path ends in failure, what do you do?
        conditions: bp2_started,bp2_questions_phase,bp2_q4_1_done,bp2_q4_2_done,bp2_q4_3_done,!bp2_q7_retry,!bp2_q7_adapt,!bp2_q7_accept
        pointers: pl_bp2_q7_retry,pl_bp2_q7_adapt,pl_bp2_q7_accept
      elias_bp2_questions_5:
        text: Last question. What legacy would you most want your journey to leave
          behind?
        conditions: bp2_started,bp2_questions_phase,bp2_q4_1_done,bp2_q4_2_done,bp2_q4_3_done,bp2_q4_4_done,!bp2_q8_fame,!bp2_q8_protection,!bp2_q8_freedom
        pointers: pl_bp2_q8_fame,pl_bp2_q8_protection,pl_bp2_q8_freedom
      elias_bp2_reward_repeat:
        text: You have completed your three personal trials again. Everything is ready.
