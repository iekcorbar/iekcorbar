  backpack3_main:
    en: |-
      &6The City Below

      &7The city's underground passages were built as a secure bunker, but terrible creatures have claimed them.
      &7Only the finest adventurers descend in search of forgotten treasure.
      &7Enter at &bX: 2874, Y: 67, Z: -589&7, find &bOrion the Adventurer&7, and prepare well before going below.
