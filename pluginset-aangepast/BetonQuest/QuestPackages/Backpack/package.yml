        conditions: bp2_started,bp2_reward_ready,bp2_finished,bp2_repeat
        pointers: pl_bp2_reward
      elias_bp2_reward:
        text: All three trials reflect the traveller you chose to become. Everything
          is ready. Let me craft a backpack worthy of that choice.
        conditions: bp2_started,bp2_reward_ready,!bp2_finished,!bp2_repeat
        pointers: pl_bp2_reward
      elias_start:
        text: You travel light, friend. Too light. A real adventurer needs a proper
          backpack. Mine are earned, not gifted. Are you willing to work for your
          first one?
        conditions: '!bp_started,!bp_finished'
        pointers: pl_accept,pl_decline
      elias_repeat_start:
        text: I can craft another Level 1 Backpack if you are willing to repeat the
          first journey.
        conditions: bp_finished,!bp_started,!bp2_started
        pointers: pl_repeat,pl_decline
      elias_explore_status:
        text: You still have places left to discover. I will send the coordinates
          again after we finish speaking.
        conditions: bp_explore_phase,!bp_explore_done
        actions: bp_msg_explore_coords_delayed
        pointers: pl_end
      elias_after_explore:
        text: Excellent. You have seen enough of the world to understand why a good
          backpack matters. Now speak with Mara Threadneedle. She can stitch the travelling
          canvas.
        conditions: bp_explore_done,!bp_canvas_phase,!bp_canvas_done
        pointers: pl_start_canvas,pl_end
      elias_after_canvas:
        text: Good canvas. Now it needs a proper frame, or your backpack will fold
          like wet paper. Brann Gearlock can build it.
        conditions: bp_canvas_done,!bp_frame_phase,!bp_frame_done
        pointers: pl_start_frame,pl_end
      elias_after_frame:
        text: The frame is ready, but Brann is right about one thing. Anyone can gather
          supplies. A backpack belongs to someone who can survive the wild.
        conditions: bp_frame_done,!bp_combat_phase,!bp_combat_done
        pointers: pl_start_combat,pl_end
      elias_combat_status:
        text: Your trial is not complete yet. Defeat 5 Vindicators, 5 Witches, and
          10 Skeletons. Each kill will show your current progress.
        conditions: bp_combat_phase,!bp_combat_done
        pointers: pl_end
      elias_after_combat:
        text: You have proven your courage. Now we finish the work. I still need the
          final fittings before I can assemble your backpack.
        conditions: bp_combat_done,!bp_final_phase,!bp_questions_phase
        pointers: pl_start_final,pl_end
      elias_final_missing:
        text: Final assembly still needs 16 Leather, 16 String, 8 Iron Ingots, and
          2 Gold Ingots.
        conditions: bp_final_phase,!bp_has_final_items
        pointers: pl_end
      elias_final_ready_first:
        text: You brought everything. Everything is ready. Let me craft something
