        conditions: bp_final_phase,bp_has_final_items,!bp_repeat
        pointers: pl_final_first,pl_end
      elias_final_ready_repeat:
        text: You brought everything. Everything is ready. Let me craft something
          worthy of your journey.
        conditions: bp_final_phase,bp_has_final_items,bp_repeat
        pointers: pl_final_repeat,pl_end
      elias_questions_1:
        text: A backpack reflects the kind of adventurer carrying it. What kind of
          traveller are you?
        conditions: bp_questions_phase,!bp_path_explorer,!bp_path_wealth,!bp_path_courage
        pointers: pl_q1_explorer,pl_q1_wealth,pl_q1_courage
      elias_questions_2:
        text: And when the road becomes dangerous, what keeps you alive?
        conditions: bp_questions_phase,bp_q1_done,!bp_q2_done
        pointers: pl_q2_prepared,pl_q2_instinct,pl_q2_teamwork
      elias_questions_3:
        text: Last question. What do you believe gives an adventurer true power?
        conditions: bp_questions_phase,bp_q1_done,bp_q2_done,!bp_power_knowledge,!bp_power_strength,!bp_power_hope
        pointers: pl_q3_knowledge,pl_q3_strength,pl_q3_hope
