journal:
  backpack_main:
    en: |-
      &bA Pack for the Road

      &7Elias Packwright has agreed to craft your first backpack, but he will not hand it out for free.
      &7Explore the four marked landmarks, speak with Mara, speak with Brann, prove yourself, then return to Elias.
    en-US: |-
      &bA Pack for the Road

      &7Elias Packwright has agreed to craft your first backpack, but he will not hand it out for free.
      &7Explore the four marked landmarks, speak with Mara, speak with Brann, prove yourself, then return to Elias.
  backpack_explore:
    en: |-
      &bChapter I - First Steps

      &7Visit the four landmarks in any order:
      &aForest Shrine &7(X: 2714, Z: -118)
      &bRiver Bend &7(X: 3217, Z: -225)
      &2Open Plains &7(X: 3144, Z: -1359)
      &bOld Mountain Pass &7(X: 2778, Z: -217)
    en-US: |-
      &bChapter I - First Steps

      &7Visit the four landmarks in any order:
      &aForest Shrine &7(X: 2714, Z: -118)
      &bRiver Bend &7(X: 3217, Z: -225)
      &2Open Plains &7(X: 3144, Z: -1359)
      &bOld Mountain Pass &7(X: 2778, Z: -217)
  backpack_canvas:
    en: |-
      &bChapter II - Woven Strength

      &7Mara Threadneedle needs &b24 Leather&7, &b32 String&7 and &b16 White Wool&7.
    en-US: |-
      &bChapter II - Woven Strength

      &7Mara Threadneedle needs &b24 Leather&7, &b32 String&7 and &b16 White Wool&7.
  backpack_frame:
    en: |-
      &bChapter III - Iron Frame

      &7Brann Gearlock needs &b12 Iron Ingots&7, &b16 Copper Ingots&7 and &b1 Chest&7.
    en-US: |-
      &bChapter III - Iron Frame

      &7Brann Gearlock needs &b12 Iron Ingots&7, &b16 Copper Ingots&7 and &b1 Chest&7.
  backpack_combat:
    en: |-
      &bChapter IV - Trial of Courage

      &7Defeat &b5 Vindicators&7, &b5 Witches&7 and &b10 Skeletons&7.
    en-US: |-
      &bChapter IV - Trial of Courage

      &7Defeat &b5 Vindicators&7, &b5 Witches&7 and &b10 Skeletons&7.
  backpack_final:
    en: |-
      &bChapter V - Final Fittings

      &7Return to Elias with &b16 Leather&7, &b16 String&7, &b8 Iron Ingots&7 and &b2 Gold Ingots&7.
    en-US: |-
      &bChapter V - Final Fittings

      &7Return to Elias with &b16 Leather&7, &b16 String&7, &b8 Iron Ingots&7 and &b2 Gold Ingots&7.
  backpack2_main:
    en: |-
      &bA Pack Worth Improving
      &7Elias will upgrade your backpack only after three trials shaped by the answers you gave him.
    en-US: |-
      &bA Pack Worth Improving
      &7Elias will upgrade your backpack only after three trials shaped by the answers you gave him.
  backpack2_calling_explorer:
    en: |-
      &bTrial I - The Explorer
      &7Travel to the Ancient Castle near &bX: -792, Y: 65, Z: -501&7. Reach all three marked heights: &b-724, 97, -514 &b-737, 129, -514 &b-759, 169, -526
    en-US: |-
      &bTrial I - The Explorer
      &7Travel to the Ancient Castle near &bX: -792, Y: 65, Z: -501&7. Reach all three marked heights: &b-724, 97, -514 &b-737, 129, -514 &b-759, 169, -526
  backpack2_calling_wealth:
    en: |-
      &bTrial I - The Seeker
      &7Travel to the Ancient Castle near &bX: -792, Y: 65, Z: -501&7. Find and open the chest at &bX: -791, Y: 119, Z: -595&7.
    en-US: |-
      &bTrial I - The Seeker
      &7Travel to the Ancient Castle near &bX: -792, Y: 65, Z: -501&7. Find and open the chest at &bX: -791, Y: 119, Z: -595&7.
  backpack2_calling_courage:
    en: |-
      &bTrial I - The Fighter
      &7Travel to the Ancient Castle near &bX: -792, Y: 65, Z: -501&7. Enter the castle and defeat a &bWarden&7 while inside the region.
    en-US: |-
      &bTrial I - The Fighter
      &7Travel to the Ancient Castle near &bX: -792, Y: 65, Z: -501&7. Enter the castle and defeat a &bWarden&7 while inside the region.
  backpack2_method_prepared:
    en: |-
      &bTrial II - Preparation
      &7Bring Elias &b32 Iron Ingots&7, &b32 String&7 and &b2 Chests&7.
    en-US: |-
      &bTrial II - Preparation
