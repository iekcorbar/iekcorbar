conversations:
  teahouse_conv:
    quester: Tea House - Aiko
    first: teahouse_start
    stop: true
    NPC_options:
      teahouse_start:
        text: Welcome, traveler. The kettle is singing and the cups are warm. What
          would you like?
        pointers: pl_open_shop,pl_talk_little,pl_about,pl_just_hi
      teahouse_shop:
        text: Let me prepare the tea menu for you.
        actions: teahouse_open_shop
        pointers: pl_end_conversation
      teahouse_talk_available:
        text: I need simple ingredients for todays blends and sweets. Take one contract,
          bring the materials, and I will pay you.
        conditions: '!teahouse_daily_cooldown_v2,!teahouse_has_active_quest_v2'
        pointers: pl_accept_random_quest,pl_refuse_random_quest
      teahouse_talk_cooldown:
        text: I already gave you work recently. Come back later, when the shop needs
          more supplies.
        conditions: teahouse_daily_cooldown_v2,!teahouse_has_active_quest_v2
        pointers: pl_end_conversation
      teahouse_talk_active:
        text: You already have one of my contracts. Did you bring the materials?
        conditions: teahouse_has_active_quest_v2
        pointers: pl_turn_in_materials,pl_show_assigned_quest,pl_end_conversation
      teahouse_about:
        text: This tea house was built for tired feet and restless minds. Steam carries
          stories better than paper.
        pointers: pl_end_conversation
      teahouse_accept:
        text: Good. I will write the contract now.
        actions: teahouse_accept_random_daily_quest
        pointers: pl_end_conversation
      teahouse_refuse:
        text: No problem. The shop will still be here when you change your mind.
        pointers: pl_end_conversation
      teahouse_goodbye:
        text: Safe travels, and come back hungry.
        pointers: pl_end_conversation
      teahouse_assigned_q1:
        text: Bring me 12 Sugar. Sweetness keeps bitter tea honest. Return when you
          have them.
        conditions: teahouse_q1_active
        pointers: pl_end_conversation
      teahouse_turnin_q1_ready:
        text: Yes, these Sugar will do nicely. Here is your pay.
        conditions: teahouse_q1_active,teahouse_q1_has_items
        actions: teahouse_q1_complete
        pointers: pl_end_conversation
      teahouse_turnin_q1_missing:
        text: Not enough. I still need 12 Sugar.
        conditions: teahouse_q1_active,!teahouse_q1_has_items
        pointers: pl_end_conversation
      teahouse_assigned_q2:
        text: Bring me 4 Honey Bottle. Good honey makes even a rainy day taste gentle.
          Return when you have them.
        conditions: teahouse_q2_active
        pointers: pl_end_conversation
      teahouse_turnin_q2_ready:
        text: Yes, these Honey Bottle will do nicely. Here is your pay.
        conditions: teahouse_q2_active,teahouse_q2_has_items
        actions: teahouse_q2_complete
        pointers: pl_end_conversation
      teahouse_turnin_q2_missing:
        text: Not enough. I still need 4 Honey Bottle.
        conditions: teahouse_q2_active,!teahouse_q2_has_items
        pointers: pl_end_conversation
      teahouse_assigned_q3:
        text: Bring me 20 Sugar Cane. Fresh cane gives me syrup, paper wraps, and
          trade favors. Return when you have them.
        conditions: teahouse_q3_active
        pointers: pl_end_conversation
      teahouse_turnin_q3_ready:
        text: Yes, these Sugar Cane will do nicely. Here is your pay.
        conditions: teahouse_q3_active,teahouse_q3_has_items
        actions: teahouse_q3_complete
        pointers: pl_end_conversation
      teahouse_turnin_q3_missing:
        text: Not enough. I still need 20 Sugar Cane.
        conditions: teahouse_q3_active,!teahouse_q3_has_items
        pointers: pl_end_conversation
      teahouse_assigned_q4:
        text: Bring me 24 Wheat. Tea is better with small cakes, and small cakes begin
          with wheat. Return when you have them.
        conditions: teahouse_q4_active
        pointers: pl_end_conversation
      teahouse_turnin_q4_ready:
        text: Yes, these Wheat will do nicely. Here is your pay.
        conditions: teahouse_q4_active,teahouse_q4_has_items
        actions: teahouse_q4_complete
        pointers: pl_end_conversation
      teahouse_turnin_q4_missing:
        text: Not enough. I still need 24 Wheat.
        conditions: teahouse_q4_active,!teahouse_q4_has_items
        pointers: pl_end_conversation
      teahouse_assigned_q5:
        text: Bring me 16 Sweet Berries. Berry tea warms the hands and brightens the
          heart. Return when you have them.
        conditions: teahouse_q5_active
        pointers: pl_end_conversation
      teahouse_turnin_q5_ready:
        text: Yes, these Sweet Berries will do nicely. Here is your pay.
        conditions: teahouse_q5_active,teahouse_q5_has_items
        actions: teahouse_q5_complete
        pointers: pl_end_conversation
      teahouse_turnin_q5_missing:
        text: Not enough. I still need 16 Sweet Berries.
        conditions: teahouse_q5_active,!teahouse_q5_has_items
        pointers: pl_end_conversation
      teahouse_assigned_q6:
        text: Bring me 18 Bamboo. Bamboo whisks and trays do not replace themselves.
          Return when you have them.
        conditions: teahouse_q6_active
        pointers: pl_end_conversation
      teahouse_turnin_q6_ready:
        text: Yes, these Bamboo will do nicely. Here is your pay.
        conditions: teahouse_q6_active,teahouse_q6_has_items
        actions: teahouse_q6_complete
        pointers: pl_end_conversation
      teahouse_turnin_q6_missing:
        text: Not enough. I still need 18 Bamboo.
        conditions: teahouse_q6_active,!teahouse_q6_has_items
        pointers: pl_end_conversation
    player_options:
      pl_open_shop:
        text: Open the shop.
        pointers: teahouse_shop
      pl_talk_little:
        text: Do you have work for me?
        pointers: teahouse_talk_active,teahouse_talk_available,teahouse_talk_cooldown
      pl_about:
        text: Tell me about this place.
        pointers: teahouse_about
      pl_accept_random_quest:
        text: I will take the contract.
        pointers: teahouse_accept
      pl_refuse_random_quest:
        text: Not right now.
        pointers: teahouse_refuse
      pl_turn_in_materials:
        text: I brought the materials.
        pointers: teahouse_turnin_q1_ready,teahouse_turnin_q2_ready,teahouse_turnin_q3_ready,teahouse_turnin_q4_ready,teahouse_turnin_q5_ready,teahouse_turnin_q6_ready,teahouse_turnin_q1_missing,teahouse_turnin_q2_missing,teahouse_turnin_q3_missing,teahouse_turnin_q4_missing,teahouse_turnin_q5_missing,teahouse_turnin_q6_missing
      pl_show_assigned_quest:
        text: What do you need again?
        pointers: teahouse_assigned_q1,teahouse_assigned_q2,teahouse_assigned_q3,teahouse_assigned_q4,teahouse_assigned_q5,teahouse_assigned_q6
      pl_just_hi:
        text: Nothing, just looking around.
        pointers: teahouse_goodbye
      pl_end_conversation:
        text: End conversation
  sakebrewery_conv:
    quester: Sake Brewery - Goro
    first: sakebrewery_start
    stop: true
    NPC_options:
      sakebrewery_start:
        text: You smell that? Rice, heat, barrels, and trouble. Welcome to the brewery.
        pointers: pl_open_shop,pl_talk_little,pl_about,pl_just_hi
      sakebrewery_shop:
        text: The brewery shelves are open. Drink responsibly, or at least amusingly.
        actions: sakebrewery_open_shop
        pointers: pl_end_conversation
      sakebrewery_talk_available:
        text: The vats are hungry. Bring supplies and I will pay properly. Take one
          contract, bring the materials, and I will pay you.
        conditions: '!sakebrewery_daily_cooldown_v2,!sakebrewery_has_active_quest_v2'
        pointers: pl_accept_random_quest,pl_refuse_random_quest
      sakebrewery_talk_cooldown:
        text: I already gave you work recently. Come back later, when the shop needs
          more supplies.
        conditions: sakebrewery_daily_cooldown_v2,!sakebrewery_has_active_quest_v2
        pointers: pl_end_conversation
      sakebrewery_talk_active:
        text: You already have one of my contracts. Did you bring the materials?
        conditions: sakebrewery_has_active_quest_v2
        pointers: pl_turn_in_materials,pl_show_assigned_quest,pl_end_conversation
      sakebrewery_about:
        text: My family turned grain into courage long before the city had copper
          pipes.
        pointers: pl_end_conversation
      sakebrewery_accept:
        text: Good. I will write the contract now.
        actions: sakebrewery_accept_random_daily_quest
        pointers: pl_end_conversation
      sakebrewery_refuse:
        text: No problem. The shop will still be here when you change your mind.
        pointers: pl_end_conversation
      sakebrewery_goodbye:
        text: Safe travels, and come back hungry.
        pointers: pl_end_conversation
      sakebrewery_assigned_q1:
        text: Bring me 32 Wheat. Grain feeds workers and fills tavern bowls. Return
          when you have them.
        conditions: sakebrewery_q1_active
        pointers: pl_end_conversation
      sakebrewery_turnin_q1_ready:
        text: Yes, these Wheat will do nicely. Here is your pay.
        conditions: sakebrewery_q1_active,sakebrewery_q1_has_items
        actions: sakebrewery_q1_complete
        pointers: pl_end_conversation
      sakebrewery_turnin_q1_missing:
        text: Not enough. I still need 32 Wheat.
        conditions: sakebrewery_q1_active,!sakebrewery_q1_has_items
        pointers: pl_end_conversation
      sakebrewery_assigned_q2:
        text: Bring me 16 Sugar. A careful sweetness keeps the brew balanced. Return
          when you have them.
        conditions: sakebrewery_q2_active
