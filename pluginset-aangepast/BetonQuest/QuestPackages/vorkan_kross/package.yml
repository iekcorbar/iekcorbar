npc_holograms:
  vorkan_available:
    lines:
    - '&d&l❗'
    npcs: '79'
    conditions: '!vorkan_daily_cooldown_v2,!vorkan_has_active_quest_v2'
    follow: true
    check_interval: 20
    max_range: 25
  vorkan_active:
    lines:
    - '&8&l❓'
    - '&7Quest in progress'
    npcs: '79'
    conditions: vorkan_has_active_quest_v2
    follow: true
    check_interval: 20
    max_range: 25
npc_conversations:
  '79': vorkan_conv
conversations:
  vorkan_conv:
    quester: Weapon Merchant Vorkan Kross
    first: vorkan_start_close,vorkan_start_friendly,vorkan_start
    stop: true
    NPC_options:
      vorkan_start_close:
        text: Back again, eh? Good. I prefer customers who survive long enough to
          return. \n\nDo not lean on the weapon racks. Half of them are sharper than
          they look, and the other half are loaded. \n\nWhat does my best client need
          today?
        conditions: vorkan_friendship_61
        pointers: pl_open_shop_2,pl_talk_little,pl_about_vorkan,pl_just_hi
      vorkan_start_friendly:
        text: Welcome back. I remember your face, and more importantly, I remember
          that you pay attention. \n\nKeep your hands clear of the forge tools unless
          you want fewer fingers. \n\nWhat can Vorkan Kross do for you?
        conditions: vorkan_friendship_31,!vorkan_friendship_61
        pointers: pl_open_shop_1,pl_talk_little,pl_about_vorkan,pl_just_hi
      vorkan_start:
        text: Welcome, traveler. \n\nBlades, spears, mechanisms, reinforced grips...
          if it can end a fight quickly, I probably sell it. \n\nSpeak clearly. What
          do you need?
        conditions: '!vorkan_friendship_31'
        pointers: pl_open_shop,pl_talk_little,pl_about_vorkan,pl_just_hi
      vorkan_shop:
        text: A fine choice. \n\nLet me open the weapon racks.
        actions: vorkan_open_shop
        pointers: pl_end_conversation
      vorkan_shop_1:
        text: A fine choice. \n\nLet me open the weapon racks.
        actions: vorkan_open_shop_1
        pointers: pl_end_conversation
      vorkan_shop_2:
        text: A fine choice. \n\nLet me open the weapon racks.
        actions: vorkan_open_shop_2
        pointers: pl_end_conversation
      vorkan_talk_available:
        text: You want work? Good. I need materials, not excuses. \n\nBring me what
          I ask for and I will pay. Maybe I will even remember your name.
        conditions: '!vorkan_daily_cooldown_v2,!vorkan_has_active_quest_v2'
        pointers: pl_accept_random_quest,pl_refuse_random_quest
      vorkan_talk_cooldown:
        text: We already had a deal recently. \n\nA forge needs time to heat, cool,
          and curse properly. Come back later.
        conditions: vorkan_daily_cooldown_v2,!vorkan_has_active_quest_v2
        pointers: pl_end_conversation
      vorkan_talk_active:
        text: You are already carrying one of my contracts. \n\nEither bring the materials
          or stop blocking the counter.
        conditions: vorkan_has_active_quest_v2
        pointers: pl_turn_in_materials,pl_end_conversation
      vorkan_turnin_q1_ready:
        text: Straight enough. A weapon with a crooked handle kills the wrong fool.
        conditions: vorkan_q1_active,vorkan_q1_has_items
        actions: vorkan_q1_complete
        pointers: pl_end_conversation
      vorkan_turnin_q1_missing:
        text: Not enough. I asked for 24 Sticks.
        conditions: vorkan_q1_active,!vorkan_q1_has_items
        pointers: pl_end_conversation
      vorkan_turnin_q2_ready:
        text: This will wrap a hilt nicely. Practical, not pretty.
        conditions: vorkan_q2_active,vorkan_q2_has_items
        actions: vorkan_q2_complete
        pointers: pl_end_conversation
      vorkan_turnin_q2_missing:
        text: Not enough. I asked for 16 Leather.
        conditions: vorkan_q2_active,!vorkan_q2_has_items
        pointers: pl_end_conversation
      vorkan_turnin_q3_ready:
        text: Strong fibers. Good. A bow is only as honest as its string.
        conditions: vorkan_q3_active,vorkan_q3_has_items
        actions: vorkan_q3_complete
        pointers: pl_end_conversation
      vorkan_turnin_q3_missing:
        text: Not enough. I asked for 12 String.
        conditions: vorkan_q3_active,!vorkan_q3_has_items
        pointers: pl_end_conversation
      vorkan_turnin_q4_ready:
        text: Good coal. Dark, dry, and angry enough for the furnace.
        conditions: vorkan_q4_active,vorkan_q4_has_items
        actions: vorkan_q4_complete
        pointers: pl_end_conversation
      vorkan_turnin_q4_missing:
        text: Not enough. I asked for 16 Coal.
        conditions: vorkan_q4_active,!vorkan_q4_has_items
        pointers: pl_end_conversation
      vorkan_turnin_q5_ready:
        text: Iron. Simple. Reliable. The world survives on this metal.
        conditions: vorkan_q5_active,vorkan_q5_has_items
        actions: vorkan_q5_complete
        pointers: pl_end_conversation
      vorkan_turnin_q5_missing:
        text: Not enough. I asked for 10 Iron Ingots.
        conditions: vorkan_q5_active,!vorkan_q5_has_items
        pointers: pl_end_conversation
      vorkan_turnin_q6_ready:
        text: Copper bends without complaining. I respect that.
        conditions: vorkan_q6_active,vorkan_q6_has_items
        actions: vorkan_q6_complete
        pointers: pl_end_conversation
      vorkan_turnin_q6_missing:
        text: Not enough. I asked for 12 Copper Ingots.
        conditions: vorkan_q6_active,!vorkan_q6_has_items
        pointers: pl_end_conversation
      vorkan_turnin_q7_ready:
        text: Gold for decoration. Wasteful, but profitable.
        conditions: vorkan_q7_active,vorkan_q7_has_items
        actions: vorkan_q7_complete
        pointers: pl_end_conversation
      vorkan_turnin_q7_missing:
        text: Not enough. I asked for 6 Gold Ingots.
        conditions: vorkan_q7_active,!vorkan_q7_has_items
        pointers: pl_end_conversation
      vorkan_turnin_q8_ready:
        text: Redstone. Now keep it away from the powder barrels.
        conditions: vorkan_q8_active,vorkan_q8_has_items
        actions: vorkan_q8_complete
        pointers: pl_end_conversation
      vorkan_turnin_q8_missing:
        text: Not enough. I asked for 6 Redstone Dust.
        conditions: vorkan_q8_active,!vorkan_q8_has_items
        pointers: pl_end_conversation
      vorkan_turnin_q9_ready:
        text: Good flint. Sharp enough to punish careless fingers.
        conditions: vorkan_q9_active,vorkan_q9_has_items
        actions: vorkan_q9_complete
        pointers: pl_end_conversation
      vorkan_turnin_q9_missing:
        text: Not enough. I asked for 10 Flint.
        conditions: vorkan_q9_active,!vorkan_q9_has_items
        pointers: pl_end_conversation
      vorkan_turnin_q10_ready:
        text: Careful. That powder has more temper than most soldiers.
        conditions: vorkan_q10_active,vorkan_q10_has_items
        actions: vorkan_q10_complete
        pointers: pl_end_conversation
      vorkan_turnin_q10_missing:
        text: Not enough. I asked for 6 Gunpowder.
        conditions: vorkan_q10_active,!vorkan_q10_has_items
        pointers: pl_end_conversation
      vorkan_turnin_q11_ready:
        text: A diamond. Expensive, stubborn, and worth the trouble.
        conditions: vorkan_q11_active,vorkan_q11_has_items
        actions: vorkan_q11_complete
        pointers: pl_end_conversation
      vorkan_turnin_q11_missing:
        text: Not enough. I asked for 1 Diamond.
        conditions: vorkan_q11_active,!vorkan_q11_has_items
        pointers: pl_end_conversation
      vorkan_turnin_q12_ready:
        text: Netherite scrap. Now this is the kind of problem I enjoy.
        conditions: vorkan_q12_active,vorkan_q12_has_items
        actions: vorkan_q12_complete
        pointers: pl_end_conversation
      vorkan_turnin_q12_missing:
        text: Not enough. I asked for 1 Netherite Scrap.
        conditions: vorkan_q12_active,!vorkan_q12_has_items
        pointers: pl_end_conversation
      vorkan_about:
        text: Me? \n\nI learned weapons before I learned manners. The first lesson
          lasted. The second did not. \n\nI buy raw materials, forge reliable killing
          tools, and sell them to people who know the difference between a weapon
          and a decoration. \n\nA sword must have balance. A spear must have reach.
          A crossbow must obey. \n\nEverything else is poetry, and poetry rarely survives
          a battlefield.
        pointers: pl_more_story,pl_end_conversation
      vorkan_story_1:
        text: Once, a noble asked me for a sword that looked terrifying. I gave him
          one that was perfectly balanced instead. He complained until it saved his
          life.
        conditions: vorkan_current_story_1
        actions: vorkan_story_1_mark_heard,vorkan_story_clear_selection
        pointers: pl_end_conversation
      vorkan_story_2:
        text: My first forge master said a weapon reveals the hand that made it. Mine
          revealed impatience, burns, and excellent steel.
        conditions: vorkan_current_story_2
        actions: vorkan_story_2_mark_heard,vorkan_story_clear_selection
        pointers: pl_end_conversation
      vorkan_story_3:
        text: A mercenary once tried to haggle with a loaded crossbow on the table.
          He received a discount and a very useful lesson in silence.
        conditions: vorkan_current_story_3
        actions: vorkan_story_3_mark_heard,vorkan_story_clear_selection
        pointers: pl_end_conversation
      vorkan_story_4:
        text: I tested a spear against a charging boar. The spear worked. The fence
          behind me did not.
        conditions: vorkan_current_story_4
        actions: vorkan_story_4_mark_heard,vorkan_story_clear_selection
        pointers: pl_end_conversation
      vorkan_story_5:
        text: The prettiest blade I ever made broke in one week. The ugliest one is
          still in service after ten years. Remember that.
        conditions: vorkan_current_story_5
        actions: vorkan_story_5_mark_heard,vorkan_story_clear_selection
        pointers: pl_end_conversation
      vorkan_story_6:
        text: A good grip matters more than gold. Gold impresses fools. Grip keeps
          you alive when rain, blood, and fear arrive together.
        conditions: vorkan_current_story_6
        actions: vorkan_story_6_mark_heard,vorkan_story_clear_selection
        pointers: pl_end_conversation
      vorkan_story_7:
        text: I once forged a dagger so quiet that the buyer paid double and never
          told me his name. Wise man.
        conditions: vorkan_current_story_7
        actions: vorkan_story_7_mark_heard,vorkan_story_clear_selection
        pointers: pl_end_conversation
      vorkan_story_8:
        text: Some customers ask for legendary weapons. I ask if they have legendary
          coin. Most legends end there.
        conditions: vorkan_current_story_8
        actions: vorkan_story_8_mark_heard,vorkan_story_clear_selection
        pointers: pl_end_conversation
      vorkan_accept:
        text: Good. Let us see what the forge demands today.
        actions: vorkan_assign_random_daily_quest,vorkan_start_daily_cooldown
        pointers: pl_show_assigned_quest
      vorkan_assigned_q1:
        text: Bring me 24 Sticks. A blade begins with grip, balance, and boring old
          wood. Return when you have them.
        conditions: vorkan_q1_active
        pointers: pl_end_conversation
      vorkan_assigned_q2:
        text: Bring me 16 Leather. Good grips need leather that will not slip in blood
          or rain. Return when you have them.
        conditions: vorkan_q2_active
        pointers: pl_end_conversation
      vorkan_assigned_q3:
        text: Bring me 12 String. Bowstrings snap when cheap hands make them. Bring
          me proper cord. Return when you have them.
        conditions: vorkan_q3_active
        pointers: pl_end_conversation
      vorkan_assigned_q4:
        text: Bring me 16 Coal. My forge is hungry, and hungry forges make better
          steel. Return when you have them.
        conditions: vorkan_q4_active
        pointers: pl_end_conversation
      vorkan_assigned_q5:
        text: Bring me 10 Iron Ingots. Iron is the spine of every honest weapon. Return
          when you have them.
        conditions: vorkan_q5_active
        pointers: pl_end_conversation
      vorkan_assigned_q6:
        text: Bring me 12 Copper Ingots. Copper is useful for fittings, rivets, and
          clever little mechanisms. Return when you have them.
        conditions: vorkan_q6_active
        pointers: pl_end_conversation
      vorkan_assigned_q7:
        text: Bring me 6 Gold Ingots. Gold does not make a blade stronger, but nobles
          pay for shine. Return when you have them.
        conditions: vorkan_q7_active
        pointers: pl_end_conversation
      vorkan_assigned_q8:
        text: Bring me 6 Redstone Dust. Some weapons need a spark before they become
          dangerous. Return when you have them.
        conditions: vorkan_q8_active
        pointers: pl_end_conversation
      vorkan_assigned_q9:
        text: Bring me 10 Flint. Sharp edges teach apprentices humility. Return when
          you have them.
        conditions: vorkan_q9_active
        pointers: pl_end_conversation
      vorkan_assigned_q10:
        text: Bring me 6 Gunpowder. I am testing a few loud solutions to quiet problems.
          Return when you have them.
        conditions: vorkan_q10_active
        pointers: pl_end_conversation
      vorkan_assigned_q11:
