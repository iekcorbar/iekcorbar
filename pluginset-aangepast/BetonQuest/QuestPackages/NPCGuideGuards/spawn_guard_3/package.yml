package:
  enabled: true
  version: 3.2.0-QUEST-2 # Don't change this! The plugin's automatic quest updater handles it.
  templates:
  - NPCGuideGuard

npcs:
  '100': citizens 100

npc_conversations:
  '100': guard_dialogue

