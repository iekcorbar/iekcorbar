conversations:
  aster_conv:
    quester: Special Upgrade Merchant Aster Veyl
    first: aster_start_close,aster_start_friendly,aster_start
    stop: true
    NPC_options:
      aster_start_close:
        text: |-
          You return with all your limbs and most of your equipment intact. Promising.

          My rarer catalysts are not displayed for strangers. Fortunately, you are no longer one.

          What would you like to improve today?
        conditions: aster_friendship_61
        pointers: pl_open_shop_2,pl_talk_little,pl_about_aster,pl_just_hi
      aster_start_friendly:
        text: |-
          Welcome back. I have set aside several stable upgrade cores for you.

          Do not touch the loose echo shards; they sometimes repeat thoughts that were never spoken.

          What do you need?
        conditions: aster_friendship_31,!aster_friendship_61
        pointers: pl_open_shop_1,pl_talk_little,pl_about_aster,pl_just_hi
      aster_start:
        text: |-
          Welcome, traveler.

          I sell upgrade catalysts, socketable components, and objects that persuade weapons and armor to exceed their original limits.

          Handle nothing without permission. What are you looking for?
        conditions: '!aster_friendship_31'
        pointers: pl_open_shop,pl_talk_little,pl_about_aster,pl_just_hi
      aster_shop:
        text: |-
          Of course.

          Let me open the special upgrade collection.
        actions: aster_open_shop
        pointers: pl_end_conversation
      aster_shop_1:
        text: |-
          Of course.

          Let me open the special upgrade collection.
        actions: aster_open_shop_1
        pointers: pl_end_conversation
      aster_shop_2:
        text: |-
          Of course.

          Let me open the special upgrade collection.
        actions: aster_open_shop_2
        pointers: pl_end_conversation
      aster_talk_available:
        text: I need unusual components for my work. Bring me what I request and I
          will pay you for the risk.
        conditions: '!aster_daily_cooldown_v2,!aster_has_active_quest_v2'
        pointers: pl_accept_random_quest,pl_refuse_random_quest
      aster_talk_cooldown:
        text: Not yet. Rare materials must be tested, cleaned, and allowed to settle
          before they can be used. Return later.
        conditions: aster_daily_cooldown_v2,!aster_has_active_quest_v2
        pointers: pl_end_conversation
      aster_talk_active:
        text: You already accepted one of my component contracts. Bring the requested
          material when you have it.
        conditions: aster_has_active_quest_v2
        pointers: pl_turn_in_materials,pl_end_conversation
      aster_about:
        text: |-
          My name is Aster Veyl. I study resonance: the hidden property that allows one material to change the behavior of another.

          A weapon can accept fury, precision, flame, or distance. Armor can accept memory, resistance, movement, or silence.

          The difficult part is not inserting power. It is preventing the item from rejecting it.
        pointers: pl_more_story,pl_end_conversation
      aster_story_1:
        text: I ruined my first enchanted blade by forcing a blaze core into a socket
          made for frost. The explosion removed my eyebrows and improved my caution.
        conditions: aster_current_story_1
        actions: aster_story_1_mark_heard,aster_story_clear_selection,aster_life_book_reward_check
        pointers: pl_end_conversation
      aster_story_2:
        text: A shulker shell once remained closed for three days after I placed an
          echo shard inside it. When it opened, it repeated every hammer strike from
          the workshop.
        conditions: aster_current_story_2
        actions: aster_story_2_mark_heard,aster_story_clear_selection,aster_life_book_reward_check
        pointers: pl_end_conversation
      aster_story_3:
        text: Ender pearls dislike symmetry. Place two perfectly opposite each other
          and the item may decide that somewhere else is a better place to exist.
        conditions: aster_current_story_3
        actions: aster_story_3_mark_heard,aster_story_clear_selection,aster_life_book_reward_check
        pointers: pl_end_conversation
      aster_story_4:
        text: I made a nautilus insert for a diver whose armor kept pulling him downward.
          It worked so well that he complained about floating during meals.
        conditions: aster_current_story_4
        actions: aster_story_4_mark_heard,aster_story_clear_selection,aster_life_book_reward_check
        pointers: pl_end_conversation
      aster_story_5:
        text: Phantom membrane is excellent for reducing weight, but it must be bound
          at dawn. At midnight it remembers the sky and tries to leave.
        conditions: aster_current_story_5
        actions: aster_story_5_mark_heard,aster_story_clear_selection,aster_life_book_reward_check
        pointers: pl_end_conversation
      aster_story_6:
        text: A Heart of the Sea is not merely a power source. Treat it carelessly
          and every metal object in the room begins to sound like distant waves.
        conditions: aster_current_story_6
        actions: aster_story_6_mark_heard,aster_story_clear_selection,aster_life_book_reward_check
        pointers: pl_end_conversation
      aster_story_7:
        text: Amethyst is the most honest material I use. Strike the wrong frequency
          and it tells you immediately, usually by shattering.
        conditions: aster_current_story_7
        actions: aster_story_7_mark_heard,aster_story_clear_selection,aster_life_book_reward_check
        pointers: pl_end_conversation
      aster_story_8:
        text: The best socket is invisible once the work is complete. A customer should
          notice the result, not the mechanism.
        conditions: aster_current_story_8
        actions: aster_story_8_mark_heard,aster_story_clear_selection,aster_life_book_reward_check
        pointers: pl_end_conversation
      aster_accept:
        text: Very well. Let us see which resonance is missing from my workshop today.
        actions: aster_assign_random_daily_quest,aster_start_daily_cooldown
        pointers: pl_show_assigned_quest
      aster_refuse:
        text: Sensible. Rare components punish careless collectors. Return when you
          are prepared.
        pointers: pl_end_conversation
      aster_goodbye:
        text: Keep your equipment dry, your sockets clean, and unstable magic away
          from your pockets.
        pointers: pl_end_conversation
      aster_turnin_q1_ready:
        text: Excellent. These ender pearls carry a clean, usable resonance.
        conditions: aster_q1_active,aster_q1_has_items
        actions: aster_q1_complete
        pointers: pl_end_conversation
      aster_turnin_q1_missing:
        text: Not enough. I asked for 8 Ender Pearls.
        conditions: aster_q1_active,!aster_q1_has_items
        pointers: pl_end_conversation
      aster_assigned_q1:
        text: Bring me 8 Ender Pearls. Ender pearls retain the tension of folded space.
          I use them to stabilize mobile upgrade cores. Return when you have them.
        conditions: aster_q1_active
        pointers: pl_end_conversation
      aster_turnin_q2_ready:
        text: Excellent. These shulker shells carry a clean, usable resonance.
        conditions: aster_q2_active,aster_q2_has_items
        actions: aster_q2_complete
        pointers: pl_end_conversation
      aster_turnin_q2_missing:
        text: Not enough. I asked for 2 Shulker Shells.
        conditions: aster_q2_active,!aster_q2_has_items
        pointers: pl_end_conversation
      aster_assigned_q2:
        text: Bring me 2 Shulker Shells. Shulker shells hold enchantments under pressure
          without cracking. Perfect for reinforced socket casings. Return when you
          have them.
        conditions: aster_q2_active
        pointers: pl_end_conversation
      aster_turnin_q3_ready:
        text: Excellent. These nautilus shells carry a clean, usable resonance.
        conditions: aster_q3_active,aster_q3_has_items
        actions: aster_q3_complete
        pointers: pl_end_conversation
      aster_turnin_q3_missing:
        text: Not enough. I asked for 4 Nautilus Shells.
        conditions: aster_q3_active,!aster_q3_has_items
        pointers: pl_end_conversation
      aster_assigned_q3:
        text: Bring me 4 Nautilus Shells. Nautilus shells carry a clean spiral resonance,
          ideal for channeling defensive effects. Return when you have them.
        conditions: aster_q3_active
        pointers: pl_end_conversation
      aster_turnin_q4_ready:
        text: Excellent. These heart of the sea carry a clean, usable resonance.
        conditions: aster_q4_active,aster_q4_has_items
        actions: aster_q4_complete
        pointers: pl_end_conversation
      aster_turnin_q4_missing:
        text: Not enough. I asked for 1 Heart of the Sea.
        conditions: aster_q4_active,!aster_q4_has_items
        pointers: pl_end_conversation
      aster_assigned_q4:
        text: Bring me 1 Heart of the Sea. A Heart of the Sea can anchor a powerful
          aquatic catalyst without losing its charge. Return when you have it.
        conditions: aster_q4_active
        pointers: pl_end_conversation
      aster_turnin_q5_ready:
        text: Excellent. These phantom membranes carry a clean, usable resonance.
        conditions: aster_q5_active,aster_q5_has_items
        actions: aster_q5_complete
        pointers: pl_end_conversation
      aster_turnin_q5_missing:
        text: Not enough. I asked for 6 Phantom Membranes.
        conditions: aster_q5_active,!aster_q5_has_items
        pointers: pl_end_conversation
      aster_assigned_q5:
        text: Bring me 6 Phantom Membranes. Phantom membranes are light, elastic,
          and unusually receptive to aerial enchantments. Return when you have them.
        conditions: aster_q5_active
        pointers: pl_end_conversation
      aster_turnin_q6_ready:
        text: Excellent. These echo shards carry a clean, usable resonance.
        conditions: aster_q6_active,aster_q6_has_items
        actions: aster_q6_complete
        pointers: pl_end_conversation
      aster_turnin_q6_missing:
        text: Not enough. I asked for 2 Echo Shards.
        conditions: aster_q6_active,!aster_q6_has_items
        pointers: pl_end_conversation
      aster_assigned_q6:
        text: Bring me 2 Echo Shards. Echo shards remember vibrations long after the
