  aster_life_book_received_tag: tag add aster_life_book_received
  aster_life_book_reward: 'command give %player% minecraft:written_book[written_book_content={title:"The
    Resonance Codex",author:"Aster Veyl",pages:[''{"text":"The Resonance Codex\n\nI
    once believed an upgrade was merely a stronger edge or thicker plate. Then I heard
    an amethyst shard sing beside an echo shard."}'',''{"text":"Every material carries
    a memory: fire in blaze rods, distance in ender pearls, pressure in shulker shells,
    and the sea in a heart torn from its depths."}'',''{"text":"Sockets are not holes.
    They are agreements between an item and a foreign power. Force the bond, and both
    may break."}'',''{"text":"The finest enhancement does not replace the weapon or
    armor. It reveals what the item was always capable of becoming."}'']}] 1'
  aster_life_book_msg: 'notify &6Special Upgrade Merchant Aster Veyl&7: &fYou have
    heard every lesson I chose to preserve. Take this codex; it contains the principles
    behind my finest work. io:chat'
  aster_life_book_reward_check: folder aster_life_book_reward,aster_life_book_received_tag,aster_life_book_msg
    conditions:aster_story_1_heard,aster_story_2_heard,aster_story_3_heard,aster_story_4_heard,aster_story_5_heard,aster_story_6_heard,aster_story_7_heard,aster_story_8_heard,!aster_life_book_received
