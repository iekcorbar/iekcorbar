journal:
  aster_q1:
    en: |-
      &fAster's Component Request

      &7Bring me &88 Ender Pearls&f. Ender pearls retain the tension of folded space. I use them to stabilize mobile upgrade cores.
    en-US: |-
      &fAster's Component Request

      &7Bring me &88 Ender Pearls&f. Ender pearls retain the tension of folded space. I use them to stabilize mobile upgrade cores.
  aster_q2:
    en: |-
      &fAster's Component Request

      &7Bring me &82 Shulker Shells&f. Shulker shells hold enchantments under pressure without cracking. Perfect for reinforced socket casings.
    en-US: |-
      &fAster's Component Request

      &7Bring me &82 Shulker Shells&f. Shulker shells hold enchantments under pressure without cracking. Perfect for reinforced socket casings.
  aster_q3:
    en: |-
      &fAster's Component Request

      &7Bring me &84 Nautilus Shells&f. Nautilus shells carry a clean spiral resonance, ideal for channeling defensive effects.
    en-US: |-
      &fAster's Component Request

      &7Bring me &84 Nautilus Shells&f. Nautilus shells carry a clean spiral resonance, ideal for channeling defensive effects.
  aster_q4:
    en: |-
      &fAster's Component Request

      &7Bring me &81 Heart of the Sea&f. A Heart of the Sea can anchor a powerful aquatic catalyst without losing its charge.
    en-US: |-
      &fAster's Component Request

      &7Bring me &81 Heart of the Sea&f. A Heart of the Sea can anchor a powerful aquatic catalyst without losing its charge.
  aster_q5:
    en: |-
      &fAster's Component Request

      &7Bring me &86 Phantom Membranes&f. Phantom membranes are light, elastic, and unusually receptive to aerial enchantments.
    en-US: |-
      &fAster's Component Request

      &7Bring me &86 Phantom Membranes&f. Phantom membranes are light, elastic, and unusually receptive to aerial enchantments.
  aster_q6:
    en: |-
      &fAster's Component Request

      &7Bring me &82 Echo Shards&f. Echo shards remember vibrations long after the source is gone. They are invaluable for reactive upgrades.
    en-US: |-
      &fAster's Component Request

      &7Bring me &82 Echo Shards&f. Echo shards remember vibrations long after the source is gone. They are invaluable for reactive upgrades.
  aster_q7:
    en: |-
      &fAster's Component Request

      &7Bring me &88 Blaze Rods&f. Blaze rods provide stable heat and concentrated elemental power for offensive cores.
    en-US: |-
      &fAster's Component Request

      &7Bring me &88 Blaze Rods&f. Blaze rods provide stable heat and concentrated elemental power for offensive cores.
  aster_q8:
    en: |-
      &fAster's Component Request

      &7Bring me &812 Armadillo Scutes&f. Armadillo scutes make excellent flexible reinforcement for armor inserts and impact dampeners.
    en-US: |-
      &fAster's Component Request

      &7Bring me &812 Armadillo Scutes&f. Armadillo scutes make excellent flexible reinforcement for armor inserts and impact dampeners.
  aster_q9:
    en: |-
      &fAster's Component Request

      &7Bring me &816 Amethyst Shards&f. Amethyst shards are reliable conductors for magical frequency and socket alignment.
    en-US: |-
      &fAster's Component Request

      &7Bring me &816 Amethyst Shards&f. Amethyst shards are reliable conductors for magical frequency and socket alignment.
  aster_q10:
    en: |-
      &fAster's Component Request

      &7Bring me &810 Glow Ink Sacs&f. Glow ink reveals hidden runes and keeps delicate inscriptions visible during infusion.
    en-US: |-
      &fAster's Component Request

      &7Bring me &810 Glow Ink Sacs&f. Glow ink reveals hidden runes and keeps delicate inscriptions visible during infusion.
  aster_q11:
    en: |-
      &fAster's Component Request

      &7Bring me &816 Chorus Fruits&f. Chorus fruit carries unstable spatial energy. Properly refined, it creates unpredictable but potent upgrades.
    en-US: |-
      &fAster's Component Request

      &7Bring me &816 Chorus Fruits&f. Chorus fruit carries unstable spatial energy. Properly refined, it creates unpredictable but potent upgrades.
