name: AfkCinema
version: '${project.version}'
main: com.iekcorbar.afkcinema.AfkCinemaPlugin
api-version: '26.2'
author: iekcorbar
description: 'AFK-bioscoop met stand-in + opneembare camerapaden (drone-shots), server-side.'
softdepend: [Citizens]
commands:
  cine:
    description: 'Bioscoop: /cine afk [speler] · stop · automatisch · opname <pad> · pad <beheer> · herlaad'
    usage: '/cine <afk|stop|automatisch|opname|pad|herlaad>'
    permission: afkcinema.cine
permissions:
  afkcinema.cine:
    default: true
    description: Zelf de cinema starten/stoppen en pads afspelen.
  afkcinema.admin:
    default: op
    description: Andere spelers filmen, pads opnemen/wissen, herladen.
