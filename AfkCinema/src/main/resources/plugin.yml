name: AfkCinema
version: '${project.version}'
main: com.iekcorbar.afkcinema.AfkCinemaPlugin
api-version: '26.2'
author: iekcorbar
description: 'AFK cinema: a camera orbits your character while you are away, plus recordable camera paths.'
softdepend: [Citizens]
commands:
  cine:
    description: 'Cinema: /cine afk [player] · stop · auto · menu · screen · record <path> · pad · reload'
    usage: '/cine <afk|stop|auto|menu|screen|record|pad|reload>'
    permission: afkcinema.cine
permissions:
  afkcinema.cine:
    default: true
    description: Start and stop your own cinema flight and play camera paths.
  afkcinema.admin:
    default: op
    description: Film other players, record and delete camera paths, reload.
