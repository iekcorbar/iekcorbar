# AfkCinema — configuration

afk-seconds: 180          # no movement/interaction = AFK after this many seconds
broadcast-afk: true       # "welcome back" title when a player returns

cine:
  head-offset: 1.4        # camera target height: the subject's head
  menu-distance: 4.0      # where the floating steam panel appears (blocks in front of you)
  collision-lift: true    # lift the camera when a wall is in the way
  orbit-speed: 0.0035     # radians per tick around the subject (smaller = calmer)
  orbit-radius: 5.0       # base distance of the orbit
  orbit-breathe: 1.6      # how much the radius "breathes"
  orbit-crane: 1.9        # how much the height drifts up and down
  afk-shot: orbit         # what the AFK camera does: orbit | pad:<path name>
  screen-default: true    # open menus float in the world above your head, visible to everyone (/cine screen toggles)
  screen-clicks: true     # floating menu slots are clickable: left-click = use that slot, sneak-click = shift-click

  pad-speed: 2.0          # blocks per second when playing a camera path
  pad-loop: back-and-forth  # back-and-forth | loop (needs 3+ points) | once
  pad-easing: true        # soft start/stop per segment (keeps the Catmull-Rom smooth)
