# AfkCinema — configuratie

afk-seconds: 180          # geen beweging/interactie = AFK na dit aantal seconden
broadcast-afk: true       # aankondigen als iemand AFK wordt (camera's staan klaar)

cine:
  sequence-length: 5      # aantal shots per vooraf geplande sequentie
  shot-min-seconds: 8     # shots worden langer dan /cine-stop verveelt
  shot-max-seconds: 15
  collision-lift: true    # camera optillen als een muur in de weg staat (i.p.v. skip)
  head-offset: 1.4        # doelhoogte: hoofd van het onderwerp
