# The Blood Moon (0.6.0): the minting hour of the Blood Token.
# A token placed while the moon stands above the horizon inside this window comes out
# Blessed (gold veins, red glow). start/end-hour run on a 24-hour IN-GAME clock
# (dawn is 06:00); the moon itself only keeps night watch near full moons, so Blessed
# coins are a one-in-eight-nights affair even inside the window. enabled: false turns
# the blessing off; /relics token then always mints a plain one.
blood-moon:
  enabled: true
  start-hour: 20
  end-hour: 4
# The Game Night Winner's Crate (0.7.9). Staff places the crate once per venue
# (/relics give <you> gamenight_crate) and hands tonight's winner the key
# (/relics give <winner> gamenight_key). One key = one opening = EXACTLY ONE prize,
# rolled from the weighted rows below. pool:<name> rows draw one prize that this
# player has NEVER won before (tracked in crates-used.yml); a fully won pool drops out
# of the roll. Since 0.7.13 the only row is pool:any - EVERY relic (Game Night set
# included) is in the draw, so the key never favours one tier. fallback: is what a
# repeat-winner who has won every relic still gets.
# cmd: entries run as console - the same seam the shop's give_command uses, so any
# plugin item can be a prize. MMOItems ids/tiers verified against the live item folder
# 2026-11-20; re-check after big MMOItems config changes (/mi give <TYPE> <ID> <player>).
gamenight-crate:
  broadcast: true
  fallback: random:relic
  prizes:
    - prize:100:pool:any       # every relic (Game Night set included), never the same one twice per player
  pools:
    common:
      - random:relic
      - random:disc
      - relic:gamenight_trophy
      - relic:gamenight_sword
      - relic:gamenight_sash
      - relic:gamenight_dice_tower
      - relic:gamenight_certificate
      - relic:blood_token
    rare:
      - cmd:mi give SWORD CUTLASS {player}
      - cmd:mi give SWORD YANISDARK_SWORD {player}
      - cmd:mi give DAGGER DRACULA_DAGGER {player}
      - cmd:mi give KATANA FLOWING_KATANA {player}
