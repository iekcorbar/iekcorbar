    seconds: 31
    event: disc.we_wish
    recipe: COOKIE
    colour: 2
  silent_night:
    title: Silent Night
    seconds: 86
    event: disc.silent_night
    recipe: CANDLE
    colour: 3
  bountiful_barn_ballad:
    title: Bountiful Barn Ballad
    seconds: 130
    event: disc.bountiful_barn_ballad
    recipe: ""
    colour: 4
  gears_of_christmas:
    title: Gears Of Christmas
    seconds: 132
