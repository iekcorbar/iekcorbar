# Wildlife - new animals ADDED next to the vanilla ones (nothing vanilla is replaced or removed).
docs-url: https://iekcorbar.com/wiki?page=wildlife

spawning:
  enabled: true
  # every interval each player gets one try to have a group appear nearby
  interval-seconds: 6
  # chance (0-1) that the try happens at all - keep it low: animals are meant to be scarce
  chance: 0.55
  min-distance: 24
  max-distance: 56
  # no new animals while this many Wildlife animals are within near-radius of the player
  max-animals-near-player: 8
  near-radius: 64
  # chance (0-1) that an animal is the rare colour variant
  rare-chance: 0.025
  # chance (0-1) that an underground player gets a CAVE-species try (steam dragons): a floor with
  # headroom 14-30 blocks away, at most groupMax within 48 blocks - finding one is a real event
  cave-chance: 0.06

# biome soundscapes around players who are outdoors (birds, crickets, frogs, gulls, cicadas, wind);
# played in the Ambient/Environment volume category, so players can turn them down themselves
ambience:
  enabled: false
  volume: 0.6

