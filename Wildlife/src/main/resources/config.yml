# the steam dragon (0.8.0): tamed with coal, ridden by its owner
dragon:
  # horizontal top speed while ridden, in blocks per tick (0.55 = 11 m/s; sprinting rider +50 %)
  seat-height: 2.0   # height of the rider above the dragon feet (adult): too low = inside the dragon, too high = floating
  nest-claim-days: 14   # a claimed Dragon Nest is freed when its dragon has not come near for this many days
  nest-range: 64        # how far dragons look for a nest
  ride-speed: 0.55
  # chance that a new dragon is the Ender look (all-black, violet eyes): extremely rare on purpose
  ender-chance: 0.003
  egg-hatch-minutes: 8        # a dragon egg hatches after this long in a player inventory


# breeding: right-click an adult with its food (see /wildlife help or the wiki); two of one kind in love close together get a baby
breeding:
  enabled: true
  # a baby grows up after this long (a golden dandelion keeps it small until it gets another one)
  grow-minutes: 20
  # an adult can breed again after this long
  cooldown-minutes: 5
  # no more babies while this many of the species are already within 32 blocks
  max-near: 10
