name: Wildlife
version: '${project.version}'
main: com.iekcorbar.wildlife.WildlifePlugin
api-version: '26.2'
description: New wildlife next to the vanilla animals, a Field Journal and a Wildlife advancement tab.
author: iekcorbar
depend: [FreeMinecraftModels]
softdepend: [Vault, CMI, AfkCinema, Gouw, Hihou, IekcorbarSiteSync, IekQuests, Kitchen, Kura, Relics, Sakagura, Satchel, Steamworks, SteamworksAdditions, SteamworksPower, Zukan]

commands:
  wildlife:
    description: Wildlife commands
    usage: /wildlife <help|journal|spawn|egg|give|giveall|info|reload>
    aliases: [wl]

  zoo:
    description: Zoo settings, items, tickets and gates
    usage: /zoo <set|give|list|info|ticket|gate|help>

permissions:
  wildlife.zoo.staff:
    description: Walk through every zoo gate and change any kiosk
    default: op
  wildlife.admin:
    description: Spawn animals, give items, reload, remove animals
    default: op
  wildlife.use:
    description: Use basic wildlife commands (journal, stats, list, find, tamed)
    default: true
  wildlife.dragon.*:
    description: Everything a player can do with a dragon (all default true; set one to false to take it away)
    default: true
    children:
      wildlife.dragon.tame: true
      wildlife.dragon.ride: true
      wildlife.dragon.pet: true
      wildlife.dragon.whistle: true
      wildlife.dragon.bag: true
      wildlife.dragon.paint: true
      wildlife.dragon.nest: true
  wildlife.dragon.tame:
    description: Tame a wild dragon with coal
    default: true
  wildlife.dragon.ride:
    description: Ride your own dragon
    default: true
  wildlife.dragon.pet:
    description: /wildlife pet, sit/stand, come, rename and release your dragon
    default: true
  wildlife.dragon.whistle:
    description: Use the Dragon Whistle
    default: true
  wildlife.dragon.bag:
    description: Fit and open saddlebags
    default: true
  wildlife.dragon.paint:
    description: Repaint your dragon with a dye
    default: true
  wildlife.dragon.nest:
    description: Let your dragon claim a Dragon Nest (staff free any nest with wildlife.admin)
    default: true

