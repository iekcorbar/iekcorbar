# Hihou - secret treasure chests with physical keys.
#
# How many bare-hand hits it takes to break a chest. Keep this high: staff use
# /hihou remove instead, players should not be able to farm a chest open.
break-hits: 100
# Broadcast to the whole server when a chest is unlocked or a lucky prize drops.
announce: true
# Lucky chests draw 1 random prize per unlock from this pool: "MATERIAL [amount] [weight]"
# (weight is relative - EMERALD at 20 vs TOTEM at 1 means 20x as common).
lucky-pool:
  - "EMERALD 3 20"
  - "GOLDEN_CARROT 8 18"
  - "EXPERIENCE_BOTTLE 6 16"
  - "FIREWORK_ROCKET 4 12"
  - "CAKE 1 8"
  - "DIAMOND 1 8"
  - "NAME_TAG 1 4"
  - "TOTEM_OF_UNDYING 1 1"

# --- BedWars (Hihou's bw/ module) -----------------------------------------------------------
# 0.6.0: pick a random match mode (classic / no beds / double iron / need for speed) at every
# launch unless staff forced one with /ih bw mode. false = always classic.
bw-random-modes: true
# 0.6.0: coin rewards paid through the Vault economy plugin (0 switches that reward off).
# The numbers are per match event: a kill, a bed destroyed, and the win itself.
bw-rewards:
  kill: 5
  bed: 10
  win: 25
