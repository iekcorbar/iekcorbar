name: Kitchen
version: '${project.version}'
main: com.iekcorbar.kitchen.KitchenPlugin
api-version: '26.2'
description: Japanese farming and cooking - crops, cutting board, cooking pot, kitchen props and animated meals.
author: iekcorbar
softdepend: [WorldEdit, WorldGuard, AfkCinema, Gouw, Hihou, IekcorbarSiteSync, Kura, Relics, Sakagura, Satchel, Steamworks, SteamworksAdditions, SteamworksPower, Wildlife, Zukan]

commands:
  kitchen:
    description: Kitchen commands
    usage: /kitchen <help|give|take|list|reload>
    aliases: [kt]

permissions:
  kitchen.admin:
    description: Give items, reload the config
    default: op

